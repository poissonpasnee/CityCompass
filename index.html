<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CityCompass Navigator</title>
    
    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Empêche le scroll global */
            height: 100vh;
            width: 100vw;
        }

        /* --- UI GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        /* --- MAP OPTIMIZATION --- */
        #map {
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #1a1a1a;
            touch-action: none; /* CRUCIAL pour la fluidité mobile */
        }
        /* Masquer les contrôles Leaflet par défaut pour un look clean */
        .leaflet-control-zoom, .leaflet-control-attribution { display: none; }

        /* --- NAVIGATION BAR (BOTTOM) --- */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            gap: 5px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-item i { font-size: 24px; }
        .nav-item.active { color: #0A84FF; }
        
        /* Bouton Central (Boussole) plus gros */
        .nav-item-center {
            position: relative;
            top: -15px; /* Effet flottant */
            background: #0A84FF;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 20px rgba(10, 132, 255, 0.4);
            border: 4px solid #000; /* Fusion avec le fond noir */
        }
        .nav-item-center i { font-size: 30px; }

        /* --- PAGES --- */
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            padding-bottom: 100px; /* Espace pour la navbar */
        }
        .page.active { display: flex; }

        /* --- PAGE: CARTE --- */
        .search-bar-container {
            position: absolute;
            top: 50px; left: 20px; right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            border: none;
            padding: 0 20px;
            font-size: 16px;
            color: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .search-btn {
            width: 50px;
            height: 50px;
            background: #0A84FF;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .suggestions-box {
            position: absolute;
            top: 60px; left: 0; right: 0;
            background: rgba(30,30,30,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            display: none;
        }
        .suggestion-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        .suggestion-item:active { background: rgba(255,255,255,0.1); }

        /* --- PAGE: BOUSSOLE --- */
        .compass-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* La Boussole Visuelle */
        .compass-ring {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(10, 132, 255, 0.1);
        }
        
        /* Cercle de progression (SVG) */
        .progress-ring {
            position: absolute;
            top: -10px; left: -10px;
            width: 300px; height: 300px;
            transform: rotate(-90deg); /* Commencer en haut */
            pointer-events: none;
        }
        .progress-ring circle {
            transition: stroke-dashoffset 0.5s ease;
        }

        /* Disque rotatif interne */
        .compass-inner {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle at center, #2a2a2a, #111);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.1s ease-out; /* Rotation fluide */
        }
        
        /* La Flèche de direction */
        .nav-arrow {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 60px solid #0A84FF;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 10px #0A84FF);
            z-index: 10;
        }
        .nav-arrow::after {
            content: '';
            position: absolute;
            top: 60px; left: -20px;
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 60px solid rgba(255,255,255,0.2);
        }

        /* Indicateur Nord (petit N sur le disque) */
        .north-mark {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            color: #ff3b30;
            font-weight: bold;
            font-size: 14px;
        }

        /* Informations Distance */
        .nav-info {
            margin-top: 30px;
            text-align: center;
        }
        .dist-label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .dist-value { font-size: 42px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
        .target-name { font-size: 16px; color: #0A84FF; margin-top: 5px; }

        /* Widget Vitesse Style Waze */
        .waze-speed-widget {
            margin-top: 20px;
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid #ff3b30; /* Rouge Waze */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .speed-val { font-size: 28px; font-weight: 800; line-height: 1; }
        .speed-unit { font-size: 10px; font-weight: bold; color: #888; }

        /* Bouton Autorisation iOS */
        #ios-perm-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #0A84FF;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 2000;
            display: none;
            box-shadow: 0 0 30px rgba(10, 132, 255, 0.5);
        }

        /* --- PAGE: OUTILS --- */
        .tools-grid {
            padding: 80px 20px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            overflow-y: auto;
        }
        .tool-card {
            background: rgba(30,30,30,0.6);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toggle-switch {
            position: relative;
            width: 50px; height: 30px;
            background: #444;
            border-radius: 15px;
            transition: 0.3s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 26px; height: 26px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-active { background: #34C759; }
        .toggle-active::after { left: 22px; }

    </style>
</head>
<body>

    <!-- BOUTON IOS -->
    <div id="ios-perm-btn" onclick="requestCompassPermission()">Activer la Boussole</div>

    <!-- NAVIGATION BAR -->
    <div class="nav-bar glass-panel">
        <div class="nav-item" onclick="switchPage('tools')">
            <i class="fa-solid fa-layer-group"></i>
            <span>Outils</span>
        </div>
        
        <!-- BOUTON BOUSSOLE (Au centre) -->
        <div class="nav-item-center" onclick="switchPage('compass')">
            <i class="fa-regular fa-compass"></i>
        </div>

        <div class="nav-item active" onclick="switchPage('map')">
            <i class="fa-solid fa-map"></i>
            <span>Carte</span>
        </div>
    </div>

    <!-- PAGE 1: CARTE -->
    <div id="page-map" class="page active">
        <div class="search-bar-container">
            <input type="text" id="search-input" class="search-input" placeholder="Où allons-nous ?" oninput="handleSearch(this.value)">
            <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
            <div id="suggestions" class="suggestions-box glass-panel"></div>
        </div>
        <div id="map"></div>
    </div>

    <!-- PAGE 2: BOUSSOLE -->
    <div id="page-compass" class="page">
        <div class="compass-container">
            <!-- Cercle de progression SVG -->
            <svg class="progress-ring">
                <circle stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="transparent" r="140" cx="150" cy="150" />
                <circle id="dist-circle" stroke="#0A84FF" stroke-width="6" stroke-linecap="round" fill="transparent" r="140" cx="150" cy="150" stroke-dasharray="880" stroke-dashoffset="880" />
            </svg>

            <div class="compass-ring">
                <div class="compass-inner" id="compass-disk">
                    <div class="north-mark">N</div>
                    <div class="nav-arrow"></div>
                </div>
            </div>

            <div class="nav-info">
                <div class="dist-label">Distance</div>
                <div class="dist-value" id="dist-display">-- m</div>
                <div class="target-name" id="target-display">Aucune destination</div>
            </div>

            <!-- Widget Vitesse Waze -->
            <div class="waze-speed-widget">
                <div class="speed-val" id="speed-val">0</div>
                <div class="speed-unit">km/h</div>
            </div>
        </div>
    </div>

    <!-- PAGE 3: OUTILS -->
    <div id="page-tools" class="page">
        <h2 style="padding: 100px 20px 0; font-size: 28px;">Outils</h2>
        <div class="tools-grid">
            <div class="tool-card">
                <span>Mode Fantôme</span>
                <div class="toggle-switch" onclick="this.classList.toggle('toggle-active')"></div>
            </div>
            <div class="tool-card">
                <span>Mode Nuit Forcé</span>
                <div class="toggle-switch toggle-active" onclick="this.classList.toggle('toggle-active')"></div>
            </div>
            <div class="tool-card">
                <span>Favoris (Admin)</span>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE (Remplacez par vos clés si nécessaire)
        const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co'; // Clé récupérée de l'historique
        const SB_KEY = 'YOUR_ANON_KEY_HERE'; // Insérez votre clé 'anon' key ici
        const supabase = window.supabase ? supabase.createClient(SB_URL, SB_KEY) : null;

        // ÉTAT GLOBAL
        let map, userMarker, targetMarker;
        let currentPos = null;
        let targetPos = null;
        let startDistance = 0; // Pour le calcul du cercle
        let currentHeading = 0; // Boussole magnétique

        // --- 1. INITIALISATION CARTE OPTIMISÉE ---
        function initMap() {
            // Options pour fluidité maximale (zoomSnap 0 permet des niveaux de zoom intermédiaires fluides)
            map = L.map('map', {
                zoomControl: false,
                zoomSnap: 0, 
                zoomDelta: 0.5,
                wheelPxPerZoomLevel: 120,
                tap: false // Souvent nécessaire pour iOS
            }).setView([48.8566, 2.3522], 13);

            // Style sombre CartoDB
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '',
                maxZoom: 20
            }).addTo(map);

            // Icône utilisateur (point bleu pulsant)
            const userIcon = L.divIcon({
                className: 'user-marker',
                html: '<div style="width: 20px; height: 20px; background: #0A84FF; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 20px #0A84FF;"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            userMarker = L.marker([0, 0], {icon: userIcon}).addTo(map);

            // Clic sur carte -> Définir destination
            map.on('click', (e) => {
                setTarget(e.latlng.lat, e.latlng.lng, "Point repère");
            });
        }

        // --- 2. GESTION NAVIGATION ---
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            
            // Mise à jour icône active (sauf si c'est le bouton central)
            if(pageId !== 'compass') {
                const iconMap = {'map': 2, 'tools': 0}; // Index dans nav-bar
                // Logique simplifiée pour l'exemple
            }

            if (pageId === 'map') {
                setTimeout(() => map.invalidateSize(), 100); // Rafraîchir la carte
            }
        }

        // --- 3. LOGIQUE BOUSSOLE & GPS ---
        function startTracking() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(updatePosition, (err) => console.error(err), {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            }
            
            // Écouteur DeviceOrientation (Gyroscope)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.webkitCompassHeading) {
                        // iOS
                        currentHeading = e.webkitCompassHeading;
                    } else if (e.alpha) {
                        // Android (approximation, peut nécessiter calibration offset)
                        currentHeading = 360 - e.alpha;
                    }
                    updateCompassVisuals();
                });
            }

            // Détection iOS pour le bouton de permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('ios-perm-btn').style.display = 'block';
            }
        }

        function requestCompassPermission() {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        document.getElementById('ios-perm-btn').style.display = 'none';
                    } else {
                        alert("Permission refusée. La boussole ne tournera pas.");
                    }
                })
                .catch(console.error);
        }

        function updatePosition(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const speed = pos.coords.speed; // en m/s

            currentPos = { lat, lng };
            userMarker.setLatLng([lat, lng]);

            // Mise à jour vitesse (Waze style)
            // Si speed est null (statique), 0. * 3.6 pour km/h
            const speedKmh = speed ? Math.round(speed * 3.6) : 0;
            document.getElementById('speed-val').innerText = speedKmh;

            updateCompassVisuals();
        }

        function setTarget(lat, lng, name) {
            targetPos = { lat, lng };
            document.getElementById('target-display').innerText = name;
            
            // Marqueur destination
            if (targetMarker) map.removeLayer(targetMarker);
            targetMarker = L.marker([lat, lng]).addTo(map);

            // Calcul distance initiale pour le cercle de progression
            if (currentPos) {
                startDistance = getDistance(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);
            }

            // Passer à la boussole automatiquement (optionnel, ou juste notifier)
            // switchPage('compass'); 
        }

        function updateCompassVisuals() {
            if (!currentPos || !targetPos) {
                // Si pas de cible, la boussole montre le Nord (Arrow rotation = -heading)
                document.getElementById('compass-disk').style.transform = `rotate(${-currentHeading}deg)`;
                return;
            }

            // 1. Calcul Distance
            const dist = getDistance(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);
            document.getElementById('dist-display').innerText = dist < 1000 ? Math.round(dist) + " m" : (dist/1000).toFixed(1) + " km";

            // 2. Calcul Cap vers cible (Bearing)
            const bearing = getBearing(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);
            
            // 3. Rotation Boussole
            // On veut que la Flèche (qui pointe vers le haut du div) pointe vers la Cible.
            // Donc on tourne le DISQUE pour que le "Haut" du disque soit aligné avec le Bearing,
            // MOINS notre propre Heading actuel.
            // Rotation = Bearing - Heading
            const rotation = bearing - currentHeading;
            document.getElementById('compass-disk').style.transform = `rotate(${rotation}deg)`;

            // 4. Cercle de Progression (SVG)
            // Circonférence r=140 => 2*PI*140 ≈ 880
            const maxDash = 880;
            let progress = 0; // 0 = plein (proche), 1 = vide (loin) ?
            // L'utilisateur veut: "se ferme de plus en plus dès que je me rapproche"
            // Donc proche = fermé = dashOffset à 0. Loin = ouvert = dashOffset à max.
            
            if (startDistance > 0) {
                const ratio = Math.min(dist / startDistance, 1); // 1 au début, 0 à la fin
                const offset = maxDash * ratio; 
                document.getElementById('dist-circle').style.strokeDashoffset = offset;
            }
        }

        // --- UTILITAIRES MATHS ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // mètres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * Math.PI / 180;
            const startLngRad = startLng * Math.PI / 180;
            const destLatRad = destLat * Math.PI / 180;
            const destLngRad = destLng * Math.PI / 180;

            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) -
                      Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            
            let brng = Math.atan2(y, x);
            brng = brng * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        // --- RECHERCHE TYPE GOOGLE ---
        async function handleSearch(query) {
            const box = document.getElementById('suggestions');
            if(query.length < 3) { box.style.display = 'none'; return; }
            
            // Utilisation de l'API Nominatim (OpenStreetMap)
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=5`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                box.innerHTML = '';
                if(data.length > 0) {
                    box.style.display = 'block';
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerText = place.display_name.split(',')[0]; // Nom court
                        div.onclick = () => {
                            setTarget(parseFloat(place.lat), parseFloat(place.lon), place.display_name.split(',')[0]);
                            map.setView([place.lat, place.lon], 16);
                            box.style.display = 'none';
                            document.getElementById('search-input').value = place.display_name;
                        };
                        box.appendChild(div);
                    });
                }
            } catch(e) { console.error(e); }
        }

        // Lancement
        window.onload = () => {
            initMap();
            startTracking();
        };

    </script>
</body>
</html>
