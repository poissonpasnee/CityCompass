<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CityCompass Liquid</title>

  <!-- LEAFLET & SUPABASE -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* --- THEME LIQUIDE & GLASSMORPHISM --- */
    :root {
      --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      --glass: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      --blur: blur(20px);
      
      --text: #1f1f1f; --text-muted: #666;
      --accent: #007aff; --danger: #ff3b30;
      
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
      --nav-height: 85px;
    }
    
    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --glass: rgba(0, 0, 0, 0.60);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff; --text-muted: #aaa;
      --accent: #0a84ff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
      margin: 0; padding: 0; height: 100vh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient); color: var(--text);
      transition: background 0.5s;
    }

    /* --- COMPOSANTS GLASS --- */
    .glass-card {
      background: var(--glass);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    .btn-liquid {
      width: 100%; padding: 16px; border-radius: 16px; border: none;
      background: var(--accent); color: white; font-weight: 700; font-size: 16px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.3);
      transition: transform 0.1s; display: flex; align-items: center; justify-content: center;
    }
    .btn-liquid:active { transform: scale(0.97); }
    
    .input-glass {
      width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.2); color: var(--text); font-size: 16px;
      margin-bottom: 12px; outline: none; transition: 0.3s;
    }
    .input-glass:focus { background: rgba(255,255,255,0.4); border-color: var(--accent); }

    /* --- VUES --- */
    #app { height: 100%; width: 100%; position: relative; }
    
    .view {
      position: absolute; inset: 0 0 var(--nav-height) 0;
      display: none; flex-direction: column; opacity: 0; transition: opacity 0.2s;
    }
    .view.active { display: flex; opacity: 1; z-index: 10; }
    
    .view-content { flex: 1; overflow-y: auto; padding: calc(var(--safe-top) + 20px) 20px 40px; }
    
    /* LOGIN VIEW */
    #viewLogin { bottom: 0; z-index: 2000; justify-content: center; align-items: center; padding: 30px; }
    
    /* MAP VIEW */
    #viewMap { padding: 0; }
    #map { width: 100%; height: 100%; z-index: 1; }
    .search-float {
      position: absolute; top: calc(var(--safe-top) + 16px); left: 16px; right: 16px; z-index: 100;
      display: flex; align-items: center; padding: 0 16px; height: 50px;
    }
    .search-input { flex: 1; border: none; background: transparent; font-size: 16px; color: var(--text); height: 100%; outline: none; }
    .sugg-box { position: absolute; top: 60px; left: 0; right: 0; max-height: 250px; overflow-y: auto; display: none; }
    .sugg-item { padding: 12px 16px; border-bottom: 1px solid var(--glass-border); font-size: 14px; background: rgba(255,255,255,0.1); cursor: pointer; }
    
    /* DRAWER */
    #drawer {
      position: absolute; bottom: 20px; left: 16px; right: 16px; padding: 24px; z-index: 200;
      transform: translateY(150%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #drawer.visible { transform: translateY(0); }

    /* COMPASS VIEW */
    .compass-ui { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring {
      width: 280px; height: 280px; border-radius: 50%; border: 4px solid var(--glass-border);
      position: relative; display: flex; justify-content: center; transition: transform 0.1s linear;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      box-shadow: 0 0 40px rgba(0,122,255,0.1); margin-bottom: 30px;
    }
    .needle-n { width: 6px; height: 20px; background: var(--danger); position: absolute; top: -10px; border-radius: 4px; }
    .needle-t { width: 8px; height: 35px; background: var(--accent); position: absolute; top: -15px; border-radius: 4px; display: none; box-shadow: 0 0 10px var(--accent); }
    .deg-display { font-size: 60px; font-weight: 900; }
    .nav-pill { background: var(--accent); color: white; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; margin-top: 10px; display: none; }

    /* PROFILE & LISTS */
    .list-group { overflow: hidden; margin-bottom: 20px; }
    .list-item {
      padding: 16px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.02); transition: background 0.2s; cursor: pointer;
    }
    .list-item:active { background: rgba(255,255,255,0.1); }
    .list-item:last-child { border-bottom: none; }

    /* TAB BAR */
    .tabbar {
      position: fixed; bottom: 0; width: 100%; height: var(--nav-height);
      display: flex; justify-content: space-around; padding-bottom: var(--safe-bot);
      background: var(--glass); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border-top: 1px solid var(--glass-border); z-index: 1000;
    }
    .tab { flex: 1; background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 10px; transition: color 0.2s; cursor: pointer; }
    .tab.active { color: var(--accent); }
    .tab svg { width: 26px; height: 26px; margin-bottom: 4px; fill: currentColor; }

    /* ADMIN */
    #adminModal { position: absolute; inset:0; background: var(--bg-gradient); z-index: 5000; display:none; padding-top:var(--safe-top); }
    .user-row { padding: 12px; border-bottom:1px solid rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- 1. LOGIN -->
  <div class="view active" id="viewLogin">
    <div class="glass-card" style="padding:40px 30px; width:100%; max-width:360px; text-align:center;">
      <div style="font-size:50px; margin-bottom:20px;">🧭</div>
      <h1 style="margin:0 0 10px;">CityCompass</h1>
      <p style="margin:0 0 30px; opacity:0.6;">Liquid Edition v44</p>
      
      <input type="email" id="email" class="input-glass" placeholder="Email" value="user@demo.com">
      <input type="password" id="pass" class="input-glass" placeholder="Mot de passe" value="123456">
      
      <button class="btn-liquid" onclick="handleLogin()">Connexion</button>
      <div style="margin-top:20px; font-size:14px; color:var(--accent); cursor:pointer;" onclick="handleSignup()">Pas de compte ? S'inscrire</div>
      <div id="loginMsg" style="margin-top:15px; font-size:13px; color:var(--danger); min-height: 20px;"></div>
    </div>
  </div>

  <!-- 2. APP -->
  <div id="app" style="display:none;">
    
    <!-- MAP -->
    <div class="view" id="viewMap">
      <div class="search-float glass-card">
        <span style="margin-right:10px;">🔍</span>
        <input id="sInput" class="search-input" placeholder="Rechercher..." autocomplete="off">
        <div id="sList" class="sugg-box glass-card"></div>
      </div>
      
      <div id="map"></div>

      <div id="drawer" class="glass-card">
        <div style="font-weight:800; font-size:20px;" id="dTitle">Lieu</div>
        <div style="font-size:13px; opacity:0.7; margin-bottom:15px;" id="dCoords">---</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <button class="btn-liquid" style="background:rgba(0,0,0,0.1); color:var(--text);" onclick="addToFavs()">⭐️ Favoris</button>
          <button class="btn-liquid" onclick="goNav()">🧭 Boussole</button>
        </div>
      </div>
    </div>

    <!-- COMPASS -->
    <div class="view" id="viewCompass">
      <div class="compass-ui">
        <div class="ring" id="cRing">
          <div class="needle-n"></div>
          <div class="needle-t" id="cTarget"></div>
        </div>
        <div class="deg-display" id="cVal">---°</div>
        <div class="nav-pill" id="navInfo">CIBLE À <span id="distVal">0</span> M</div>
        <button class="btn-liquid" style="width:200px; margin-top:40px;" onclick="startSensors()" id="btnSensors">Activer Capteurs</button>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="view" id="viewProfile">
      <div class="view-content">
        <h1 style="margin-bottom:20px;">Mon Profil</h1>
        
        <div class="glass-card list-group" style="padding:20px; text-align:center; margin-bottom:20px;">
          <div style="font-size:40px; margin-bottom:10px;">👤</div>
          <div style="font-weight:700;" id="pEmail">Chargement...</div>
          <div style="font-size:24px; font-weight:800; color:var(--accent); margin-top:5px;"><span id="pPoints">...</span> Pts</div>
        </div>

        <h3 style="margin:20px 0 10px; font-size:14px; text-transform:uppercase; opacity:0.6; padding-left:10px;">Mes Favoris</h3>
        <div class="glass-card list-group" id="favList">
          <div class="list-item" style="color:var(--text-muted); justify-content:center;">Aucun favori</div>
        </div>

        <h3 style="margin:20px 0 10px; font-size:14px; text-transform:uppercase; opacity:0.6; padding-left:10px;">Réglages</h3>
        <div class="glass-card list-group">
          <div class="list-item">
            <span>Mode Nuit</span>
            <input type="checkbox" id="swTheme" onchange="toggleTheme()">
          </div>
          <div class="list-item" id="adminBtn" style="display:none;" onclick="showAdmin()">
            <span style="color:var(--accent); font-weight:700;">Panel Admin 🛠️</span>
          </div>
          <div class="list-item" onclick="handleLogout()">
            <span style="color:var(--danger); font-weight:700;">Déconnexion</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ADMIN OVERLAY -->
  <div id="adminModal" class="view">
    <div class="view-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1>Admin Panel</h1>
        <button onclick="$('adminModal').style.display='none'" style="border:none; background:none; font-size:20px;">✕</button>
      </div>
      <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:12px; margin-bottom:10px; font-size:12px;">
        Gestion des utilisateurs Supabase (auth + table profiles)
      </div>
      <div class="glass-card list-group" id="userList">
        <!-- Users populated by JS -->
      </div>
    </div>
  </div>

  <!-- TABS -->
  <nav class="tabbar" id="tabbar" style="display:none;">
    <button class="tab" onclick="switchView('viewMap', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      <span style="font-size:10px; font-weight:600;">Carte</span>
    </button>
    <button class="tab" onclick="switchView('viewCompass', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
      <span style="font-size:10px; font-weight:600;">Boussole</span>
    </button>
    <button class="tab" onclick="switchView('viewProfile', this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
      <span style="font-size:10px; font-weight:600;">Profil</span>
    </button>
  </nav>

  <script>
    // --- CONFIG SUPABASE ---
    const SB_URL = 'https://vjlfbcwnfwyrxstfvefq.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqbGZiY3duZnd5cnhzdGZ2ZWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMDc2MjcsImV4cCI6MjA4NDc4MzYyN30.WTuWbxB-8isJOp2lNnq73njQmifDjxTNEWngMgKtmv4';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    const $ = id => document.getElementById(id);
    let state = {
      user: null,
      profile: null,
      favs: JSON.parse(localStorage.getItem('cc_favs') || '[]'),
      target: null,
      pos: null
    };

    // --- 1. PERSISTENCE & INIT ---
    window.onload = async () => {
      // Restore Theme
      if(localStorage.getItem('cc_theme')==='dark') {
        document.body.setAttribute('data-theme','dark');
        $('swTheme').checked = true;
      }

      // Check Session
      const {  { session } } = await supabase.auth.getSession();
      if (session) {
        state.user = session.user;
        await loadProfile();
        initApp();
      } else {
        $('viewLogin').classList.add('active');
        $('viewLogin').style.opacity = 1;
      }
    };

    async function loadProfile() {
      // Récupère le profil depuis la table "profiles"
      const { data, error } = await supabase.from('profiles').select('*').eq('id', state.user.id).single();
      
      if(error) console.error("Erreur profil:", error);
      
      state.profile = data || { points: 0, role: 'user' };
      $('pEmail').textContent = state.user.email;
      $('pPoints').textContent = state.profile.points;
      
      if(state.profile.role === 'admin' || state.user.email.includes('admin')) {
        $('adminBtn').style.display = 'flex';
      }
      renderFavs();
    }

    // --- 2. AUTH ---
    async function handleLogin() {
      const email = $('email').value;
      const password = $('pass').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) $('loginMsg').textContent = "Erreur: " + error.message;
      else location.reload();
    }

    async function handleSignup() {
      const email = $('email').value;
      const password = $('pass').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) $('loginMsg').textContent = "Erreur: " + error.message;
      else alert('Inscription réussie ! Vous êtes connecté.'); // Auto-login often happens
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      localStorage.clear();
      location.reload();
    }

    function initApp() {
      $('viewLogin').style.display = 'none';
      $('app').style.display = 'block';
      $('tabbar').style.display = 'flex';
      
      // RESTORE LAST VIEW
      const lastView = localStorage.getItem('cc_view') || 'viewMap';
      const btns = document.querySelectorAll('.tab');
      let targetBtn = btns[0];
      if(lastView === 'viewCompass') targetBtn = btns[1];
      if(lastView === 'viewProfile') targetBtn = btns[2];
      
      switchView(lastView, targetBtn);
      
      initMap();
    }

    // --- 3. NAVIGATION (VIEW MANAGER) ---
    window.switchView = (id, btn) => {
      document.querySelectorAll('.view').forEach(v => {
        v.classList.remove('active');
        v.style.opacity = 0;
      });
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      
      const target = $(id);
      target.classList.add('active');
      // Petit délai pour l'anim css opacity
      setTimeout(() => target.style.opacity = 1, 10);
      
      btn.classList.add('active');
      localStorage.setItem('cc_view', id);
      
      if(id === 'viewMap' && map) setTimeout(()=>map.invalidateSize(), 50);
    }

    // --- 4. MAP & DRAWER ---
    let map, mapMarker, selPlace;
    function initMap() {
      if(map) return;
      map = L.map('map', {zoomControl:false}).setView([43.604, 1.444], 14);
      
      const theme = localStorage.getItem('cc_theme');
      const url = theme==='dark' 
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
      
      L.tileLayer(url, {maxZoom:19}).addTo(map);
      
      map.locate({setView:true, maxZoom:15});
      map.on('locationfound', e => {
        state.pos = e.latlng;
        L.circleMarker(e.latlng, {radius:8, color:'#fff', fillColor:'#007aff', fillOpacity:1}).addTo(map);
      });
      
      map.on('click', e => selectPlace(e.latlng.lat, e.latlng.lng, 'Point Repère'));
    }

    function selectPlace(lat, lng, name) {
      selPlace = {lat, lng, name};
      
      if(mapMarker) map.removeLayer(mapMarker);
      mapMarker = L.marker([lat, lng]).addTo(map);
      map.flyTo([lat, lng], 16);
      
      $('dTitle').textContent = name.substring(0,20);
      $('dCoords').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      $('drawer').classList.add('visible');
    }

    // --- 5. SEARCH & KEYBOARD FIX ---
    let sTimer;
    $('sInput').addEventListener('input', (e) => {
      clearTimeout(sTimer);
      const q = e.target.value;
      if(q.length < 3) { $('sList').style.display='none'; return; }
      
      sTimer = setTimeout(async() => {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=4`);
        const d = await r.json();
        const list = $('sList');
        list.innerHTML = '';
        list.style.display = 'block';
        
        d.forEach(p => {
          const div = document.createElement('div');
          div.className = 'sugg-item';
          div.textContent = p.display_name.split(',')[0];
          div.onclick = () => {
            selectPlace(parseFloat(p.lat), parseFloat(p.lon), div.textContent);
            list.style.display='none';
            $('sInput').value = div.textContent;
          };
          list.appendChild(div);
        });
      }, 400);
    });

    // --- 6. FAVORIS & PROFILE ---
    function addToFavs() {
      if(!selPlace) return;
      state.favs.push(selPlace);
      localStorage.setItem('cc_favs', JSON.stringify(state.favs));
      renderFavs();
      $('drawer').classList.remove('visible');
      alert('Ajouté aux favoris');
    }

    function renderFavs() {
      const list = $('favList');
      if(state.favs.length === 0) return;
      list.innerHTML = '';
      
      state.favs.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div style="font-weight:600;">${f.name}</div>
            <div style="font-size:12px; opacity:0.6;">${f.lat.toFixed(3)}, ${f.lng.toFixed(3)}</div>
          </div>
          <button class="btn-liquid" style="width:auto; padding:8px 16px; font-size:12px;" onclick="loadFav(${i})">GO</button>
        `;
        list.appendChild(div);
      });
    }

    window.loadFav = (i) => {
      selPlace = state.favs[i];
      goNav();
    };

    // --- 7. COMPASS & NAVIGATION ---
    function goNav() {
      if(selPlace) {
        state.target = selPlace;
        $('drawer').classList.remove('visible');
        switchView('viewCompass', document.querySelectorAll('.tab')[1]);
        
        $('navInfo').style.display = 'inline-block';
        $('cTarget').style.display = 'block';
      }
    }

    function startSensors() {
      if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(r => {
          if(r === 'granted') window.addEventListener('deviceorientation', handleOrient, true);
        });
      } else {
        window.addEventListener('deviceorientation', handleOrient, true);
      }
      $('btnSensors').style.display = 'none';
    }

    function handleOrient(e) {
      const h = e.webkitCompassHeading || Math.abs(e.alpha - 360);
      if(!h) return;
      
      $('cRing').style.transform = `rotate(${-h}deg)`;
      $('cVal').textContent = Math.round(h) + '°';
      
      if(state.target && state.pos) {
        const dist = map.distance(state.pos, [state.target.lat, state.target.lng]);
        $('distVal').textContent = Math.round(dist);
        
        // Bearing
        const lat1=state.pos.lat*Math.PI/180, lat2=state.target.lat*Math.PI/180;
        const dLon=(state.target.lng-state.pos.lng)*Math.PI/180;
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
        const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        
        $('cTarget').style.transform = `rotate(${brng}deg)`;
      }
    }

    // --- 8. ADMIN PANEL ---
    async function showAdmin() {
      $('adminModal').style.display = 'flex';
      // Lecture de la table profiles
      const { data, error } = await supabase.from('profiles').select('*');
      const list = $('userList');
      list.innerHTML = '';
      
      if(error) {
         list.innerHTML = '<div style="padding:20px">Erreur lecture profils (Vérifiez script SQL).</div>';
         return;
      }

      data.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-row';
        div.innerHTML = `
          <div><div style="font-weight:700;">${u.email}</div>Points: ${u.points}</div>
          <button style="background:var(--accent); color:white; border:none; padding:8px 12px; border-radius:8px;" onclick="addPoints('${u.id}', ${u.points})">+100</button>
        `;
        list.appendChild(div);
      });
    }
    
    window.addPoints = async (uid, currentPts) => {
      const { error } = await supabase.from('profiles').update({ points: currentPts + 100 }).eq('id', uid);
      if(!error) { alert('Points ajoutés !'); showAdmin(); }
      else alert('Erreur: ' + error.message);
    }

    function toggleTheme() {
      const isDark = $('swTheme').checked;
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      localStorage.setItem('cc_theme', isDark ? 'dark' : 'light');
      location.reload(); // Quick refresh for maps
    }

  </script>
</body>
</html>
