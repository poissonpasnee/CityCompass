<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityCompass Explorer</title>
    <!-- Leaflet CSS (Carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- FontAwesome (Icônes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- NOTRE CSS (Design) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- VUE : LOGIN (Si pas connecté) -->
    <div id="view-login" class="view">
        <div class="login-container">
            <div class="compass-anim">
                <i class="fas fa-compass fa-spin" style="font-size: 80px; color: #007AFF; --fa-animation-duration: 3s;"></i>
            </div>
            <h1>CityCompass</h1>
            <p>Explorer. Naviguer. Dominer.</p>
            <input type="email" id="email" placeholder="Email" class="input-glass">
            <input type="password" id="password" placeholder="Mot de passe" class="input-glass">
            <button onclick="Auth.login()" class="btn-primary">Connexion</button>
            <button onclick="Auth.signup()" class="btn-secondary">Inscription</button>
            <p id="auth-msg" style="margin-top:10px; font-size:12px;"></p>
        </div>
    </div>

    <!-- VUE : CARTE -->
    <div id="view-map" class="view" style="display:none;">
        <div id="map"></div>
        
        <!-- Recherche -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Rechercher un lieu..." oninput="MapManager.search(this.value)">
            <div id="search-results" class="results-list"></div>
        </div>

        <!-- Bouton Recentrer -->
        <button class="fab-btn" onclick="MapManager.locate()">
            <i class="fas fa-location-arrow"></i>
        </button>
    </div>

    <!-- VUE : BOUSSOLE -->
    <div id="view-compass" class="view" style="display:none;">
        <div class="header-glass">Navigation</div>
        
        <div class="compass-wrapper">
            <div class="compass-ring"></div>
            <div id="compass-card"></div> <!-- Le fond qui tourne (Nord) -->
            <div id="compass-needle"></div> <!-- L'aiguille (Destination) -->
            <div class="compass-readout"><span id="val-heading">0</span>°</div>
        </div>

        <div class="widgets-container">
            <h3>Tableau de bord</h3>
            <div id="widgets-grid">
                <!-- Les widgets sont insérés ici par JS -->
            </div>
        </div>
    </div>

    <!-- VUE : PROFIL & ADMIN -->
    <div id="view-profile" class="view" style="display:none;">
        <div class="header-glass">Mon Profil</div>
        
        <div class="profile-card">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <h2 id="profile-email">Utilisateur</h2>
            <div class="points-badge" id="profile-points">0 XP</div>
        </div>

        <!-- SECTION ADMIN -->
        <div id="admin-panel" style="display:none;">
            <div class="admin-title">👑 Zone Administrateur</div>
            
            <div class="admin-tools">
                <button onclick="Admin.broadcast()">📢 Message Global</button>
                <button onclick="Admin.addRec()">⭐ Créer Recommandation</button>
            </div>

            <div class="user-list-header">Utilisateurs</div>
            <div id="admin-user-list">
                <!-- Liste chargée par JS -->
            </div>
        </div>

        <button onclick="Auth.logout()" class="btn-danger" style="margin-top:30px; width:100%;">Déconnexion</button>
    </div>

    <!-- BARRE DE NAVIGATION (Bas) -->
    <div id="navbar" class="navbar" style="display:none;">
        <button class="nav-item" onclick="App.show('view-map', this)">
            <i class="fas fa-map-marked-alt"></i>
            <span>Carte</span>
        </button>
        <button class="nav-item" onclick="App.show('view-compass', this)">
            <i class="fas fa-compass"></i>
            <span>Boussole</span>
        </button>
        <button class="nav-item" onclick="App.show('view-profile', this)">
            <i class="fas fa-user-astronaut"></i>
            <span>Profil</span>
        </button>
    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <!-- Nos scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/widgets.js"></script>
    <script src="js/compass.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/mapManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
