<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CityCompass v53 Retro</title>

    <!-- Leaflet & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase & Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- DESIGN v20 GLASS --- */
        :root {
            --glass: rgba(255, 255, 255, 0.85);
            --glass-dark: rgba(28, 28, 30, 0.85);
            --blur: blur(20px);
            --shadow: 0 8px 32px rgba(0,0,0,0.2);
            --accent: #007AFF;
            --danger: #FF3B30;
            --text: #000;
        }
        body[data-theme="dark"] {
            --glass: rgba(30, 30, 30, 0.85);
            --text: #FFF;
            --accent: #0A84FF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { margin: 0; height: 100vh; overflow: hidden; background: #000; color: var(--text); }

        /* CARTE PLEIN ÉCRAN */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* BARRES D'OUTILS (HUD) */
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }
        
        /* TOP BAR */
        .top-bar {
            margin-top: 15px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
        }
        .points-badge {
            background: var(--glass); backdrop-filter: var(--blur); padding: 8px 16px; border-radius: 20px;
            font-weight: 700; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
        }

        /* BOTTOM BAR */
        .dock {
            margin-bottom: 20px; background: var(--glass); backdrop-filter: var(--blur);
            border-radius: 25px; padding: 10px 20px; display: flex; justify-content: space-between;
            pointer-events: auto; box-shadow: var(--shadow); width: 100%; max-width: 400px; align-self: center;
        }
        .dock-item {
            font-size: 24px; color: #888; padding: 10px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .dock-item.active { color: var(--accent); transform: translateY(-5px); }
        .dock-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: var(--accent); border-radius: 50%;
        }

        /* PANNEAUX LATERAUX (v20 Style) */
        .panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--glass);
            backdrop-filter: blur(30px); z-index: 2000; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 20px 20px 20px; overflow-y: auto; pointer-events: auto;
        }
        .panel.open { right: 0; }
        .panel h2 { font-size: 32px; margin-bottom: 30px; font-weight: 800; }
        .close-btn {
            position: absolute; top: 30px; right: 20px; background: rgba(128,128,128,0.2);
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; border: none; color: var(--text);
        }

        /* WIDGETS UI */
        .widget-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; margin-bottom: 12px; background: rgba(128,128,128,0.1); border-radius: 18px;
        }
        .widget-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; margin-right: 15px; font-size: 18px; }
        
        /* BOUSSOLE FULLSCREEN */
        #compassOverlay {
            position: absolute; top:0; left:0; width:100%; height:100%; background: var(--glass);
            backdrop-filter: blur(50px); z-index: 3000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #compassOverlay.active { opacity: 1; pointer-events: auto; }
        #compassRing {
            width: 280px; height: 280px; border: 8px solid var(--text); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        #compassArrow { font-size: 80px; color: var(--danger); }
        
        /* LOGIN (v52 Engine) */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box {
            background: #fff; padding: 40px; border-radius: 24px; width: 90%; max-width: 340px; text-align: center;
        }
        body[data-theme="dark"] .login-box { background: #1c1c1e; color: white; }
        .inp {
            width: 100%; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #ddd;
            background: rgba(128,128,128,0.1); font-size: 16px; color: var(--text);
        }
        .btn-main {
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold;
            background: var(--accent); color: white; margin-top: 10px; cursor: pointer;
        }

    </style>
</head>
<body data-theme="light">

    <!-- LOGIN (ENGINE V52) -->
    <div id="loginScreen">
        <div class="login-box">
            <h1 style="margin:0 0 20px 0;">CityCompass</h1>
            <input type="email" id="email" class="inp" placeholder="Email">
            <input type="password" id="password" class="inp" placeholder="Mot de passe">
            
            <button class="btn-main" onclick="handleLogin()">Se connecter</button>
            <button class="btn-main" style="background:transparent; color:var(--text); border:1px solid #ddd;" onclick="handleSignup()">Créer un compte</button>
            
            <p id="msg" style="color:red; font-size:13px; margin-top:15px; min-height:20px;"></p>
        </div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>

    <!-- HUD (INTERFACE V20) -->
    <div class="hud-layer" id="hud" style="display:none;">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="points-badge" onclick="openPanel('panelProfile')">
                <i class="fa-solid fa-user-astronaut" style="color:var(--accent);"></i>
                <span id="userPoints">0 XP</span>
            </div>
            <div class="glass-btn" onclick="toggleTheme()" style="width:40px; height:40px; border-radius:50%; background:var(--glass); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>

        <!-- Bottom Dock -->
        <div class="dock">
            <div class="dock-item" onclick="openPanel('panelShop')"><i class="fa-solid fa-bag-shopping"></i></div>
            <div class="dock-item" onclick="openPanel('panelLayers')"><i class="fa-solid fa-layer-group"></i></div>
            <div class="dock-item active" onclick="locateMe()"><i class="fa-solid fa-location-arrow"></i></div>
            <div class="dock-item" onclick="openCompass()"><i class="fa-regular fa-compass"></i></div>
        </div>
    </div>

    <!-- PANNEAU SHOP -->
    <div id="panelShop" class="panel">
        <button class="close-btn" onclick="closePanels()">&times;</button>
        <h2>Boutique</h2>
        
        <div class="widget-row">
            <div style="display:flex; align-items:center;">
                <div class="widget-icon" style="background:#34C759;"><i class="fa-solid fa-traffic-light"></i></div>
                <div><b>Trafic Live</b><br><span style="font-size:12px; opacity:0.6;">Afficher les bouchons</span></div>
            </div>
            <input type="checkbox" onchange="toggleLayer('traffic', this.checked)">
        </div>
        
        <div class="widget-row">
            <div style="display:flex; align-items:center;">
                <div class="widget-icon" style="background:#5856D6;"><i class="fa-solid fa-train-subway"></i></div>
                <div><b>Transports</b><br><span style="font-size:12px; opacity:0.6;">Métro et Bus</span></div>
            </div>
            <input type="checkbox" onchange="toggleLayer('transit', this.checked)">
        </div>

        <div class="widget-row">
            <div style="display:flex; align-items:center;">
                <div class="widget-icon" style="background:#FF9500;"><i class="fa-solid fa-bicycle"></i></div>
                <div><b>Pistes Cyclables</b><br><span style="font-size:12px; opacity:0.6;">Vélos & Trottinettes</span></div>
            </div>
            <input type="checkbox" onchange="toggleLayer('bike', this.checked)">
        </div>
    </div>

    <!-- PANNEAU LAYERS -->
    <div id="panelLayers" class="panel">
        <button class="close-btn" onclick="closePanels()">&times;</button>
        <h2>Fonds de Carte</h2>
        <div class="widget-row" onclick="setBaseMap('standard')"><b>🗺️ Plan Standard</b></div>
        <div class="widget-row" onclick="setBaseMap('sat')"><b>🛰️ Satellite</b></div>
        <div class="widget-row" onclick="setBaseMap('dark')"><b>🌑 Mode Sombre</b></div>
    </div>

    <!-- PANNEAU PROFIL -->
    <div id="panelProfile" class="panel">
        <button class="close-btn" onclick="closePanels()">&times;</button>
        <h2>Mon Profil</h2>
        <div style="text-align:center; margin-bottom:30px;">
            <div style="width:80px; height:80px; background:#eee; border-radius:50%; margin:0 auto 10px auto; display:flex; align-items:center; justify-content:center; font-size:30px;">👽</div>
            <h3 id="userName">User</h3>
            <p id="userEmailSub" style="opacity:0.6;">email@test.com</p>
        </div>
        
        <div class="widget-row" style="background:rgba(255, 59, 48, 0.1); color:var(--danger);" onclick="logout()">
            <b>Se déconnecter</b> <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </div>
    </div>

    <!-- BOUSSOLE FULLSCREEN (v20) -->
    <div id="compassOverlay">
        <button class="close-btn" style="top:50px; left:20px; right:auto;" onclick="closeCompass()">&times;</button>
        <div id="compassRing">
            <div style="position:absolute; top:-40px; font-weight:bold; font-size:24px;">N</div>
            <i id="compassArrow" class="fa-solid fa-location-arrow"></i>
        </div>
        <h2 id="compassHeading" style="margin-top:40px;">0° N</h2>
    </div>

<script>
    // --- CONFIGURATION (VOTRE PROJET) ---
    const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';
    
    let sb, map, userMarker, watchId;
    let layers = {}; 
    let state = { theme: 'light' };
    
    const msg = (txt) => document.getElementById('msg').innerText = txt;

    // --- AUTHENTIFICATION ---
    window.handleLogin = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email || !password) return msg("Remplissez tout.");
        
        msg("Connexion...");
        try {
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if(error) throw error;
            initApp(data.user);
        } catch(e) { msg(e.message); }
    };

    window.handleSignup = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email || !password) return msg("Remplissez tout.");
        
        msg("Création...");
        try {
            const { data, error } = await sb.auth.signUp({ email, password });
            if(error) throw error;
            
            if(data.session) initApp(data.user);
            else msg("✅ Compte créé ! Vérifiez vos emails.");
        } catch(e) { msg(e.message); }
    };

    window.logout = async () => { await sb.auth.signOut(); location.reload(); };

    // --- LOGIQUE APP ---
    function initApp(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        
        // Remplir profil
        document.getElementById('userName').innerText = user.email.split('@')[0];
        document.getElementById('userEmailSub').innerText = user.email;
        
        initMap();
    }

    function initMap() {
        if(map) return;
        map = L.map('map', { zoomControl: false }).setView([43.604, 1.444], 13);
        layers.base = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        locateMe();
    }

    // UI Functions
    window.openPanel = (id) => {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
        document.getElementById(id).classList.add('open');
    };
    window.closePanels = () => document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));

    // Boussole
    window.openCompass = () => {
        document.getElementById('compassOverlay').classList.add('active');
        if(window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleOrientation);
        }
    };
    window.closeCompass = () => {
        document.getElementById('compassOverlay').classList.remove('active');
        window.removeEventListener('deviceorientation', handleOrientation);
    };

    function handleOrientation(e) {
        const alpha = e.webkitCompassHeading || Math.abs(e.alpha - 360);
        document.getElementById('compassArrow').style.transform = `rotate(${-alpha}deg)`;
        document.getElementById('compassHeading').innerText = Math.round(alpha) + "°";
    }

    // Carte & Theme
    window.locateMe = () => {
        if(!map) return;
        map.locate({setView: true, maxZoom: 16, watch: true});
        map.on('locationfound', e => {
            if(!userMarker) {
                userMarker = L.circleMarker(e.latlng, { color: '#007AFF', fillColor: '#007AFF', fillOpacity: 1, radius: 8 }).addTo(map);
                L.circle(e.latlng, { radius: e.accuracy/2, color: '#007AFF', opacity: 0.1 }).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
            }
        });
    };

    window.toggleTheme = () => {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', state.theme);
        setBaseMap(state.theme === 'dark' ? 'dark' : 'standard');
    };

    window.setBaseMap = (type) => {
        let url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
        if(type === 'dark') url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        if(type === 'sat') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        layers.base.setUrl(url);
        closePanels();
    };

    window.toggleLayer = (type, active) => {
        if(active) alert(type + " activé");
    };

    // --- START ---
    window.onload = async () => {
        try {
            sb = supabase.createClient(SB_URL, SB_KEY);
            const { data: { session } } = await sb.auth.getSession();
            if(session) initApp(session.user);
        } catch(e) { msg("Erreur: " + e.message); }
    };
</script>
</body>
</html>
