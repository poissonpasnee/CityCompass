<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <title>CityCompass v26</title>

  <!-- LIBS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* --- DESIGN SYSTEM v26 (Google Maps Style) --- */
    :root {
      --primary: #4285F4; --surface: #FFFFFF; --bg: #F8F9FA;
      --text: #202124; --text-sub: #5F6368;
      --shadow: 0 2px 6px rgba(0,0,0,0.15); --shadow-hover: 0 4px 12px rgba(0,0,0,0.15);
      --radius: 16px; --nav-h: 70px;
    }
    
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; user-select:none; }
    body { margin:0; font-family:'Google Sans', Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); height:100dvh; overflow:hidden; }

    /* LAYOUT */
    .view { position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); z-index:1; }
    .view.active { display:flex; z-index:10; }
    
    /* MAP VIEW (Full Screen) */
    #viewMap { padding-bottom:var(--nav-h); }
    #map { flex:1; width:100%; height:100%; z-index:0; }
    
    /* SEARCH BAR (Floating) */
    .search-floater {
      position:absolute; top:max(15px, env(safe-area-inset-top)); left:15px; right:15px;
      background:var(--surface); height:48px; border-radius:8px; display:flex; align-items:center;
      box-shadow:var(--shadow); padding:0 15px; z-index:1000;
    }
    .avatar-btn { width:32px; height:32px; background:#eee; border-radius:50%; margin-left:auto; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; }
    
    /* WIDGETS (Shop Preview) */
    .widget-scroller {
      position:absolute; top:80px; left:0; right:0; overflow-x:auto; white-space:nowrap;
      padding:0 15px; -webkit-overflow-scrolling:touch; z-index:900;
      scrollbar-width:none;
    }
    .widget-scroller::-webkit-scrollbar { display:none; }
    
    .widget-pill {
      display:inline-flex; align-items:center; gap:6px; background:var(--surface); 
      padding:8px 16px; border-radius:20px; box-shadow:var(--shadow); margin-right:10px;
      font-size:14px; font-weight:500; color:var(--text); cursor:pointer;
    }
    .widget-pill i { color:var(--primary); }

    /* AUTH OVERLAY (Clean & Simple) */
    #viewAuth { z-index:5000; background:var(--surface); justify-content:center; padding:30px; }
    .auth-card { max-width:400px; margin:0 auto; text-align:center; width:100%; }
    
    .input-mat {
      width:100%; padding:14px 16px; border:1px solid #ddd; border-radius:8px;
      font-size:16px; margin-bottom:12px; transition:0.2s;
    }
    .input-mat:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(66,133,244,0.2); }
    
    .btn-mat {
      width:100%; padding:14px; background:var(--primary); color:white; border:none;
      border-radius:8px; font-weight:500; font-size:16px; cursor:pointer; 
      box-shadow:var(--shadow); margin-bottom:12px;
    }
    .btn-mat:active { transform:scale(0.98); }
    .btn-text { background:none; color:var(--primary); box-shadow:none; font-size:14px; padding:10px; }

    /* BOTTOM SHEET (Shop/Profile) */
    .sheet {
      position:absolute; top:100%; left:0; right:0; height:90%; background:var(--surface);
      border-radius:24px 24px 0 0; box-shadow:0 -5px 20px rgba(0,0,0,0.1);
      transition:transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index:2000;
      display:flex; flex-direction:column; padding:20px;
    }
    .sheet.open { transform:translateY(-100%); }
    .sheet-handle { width:40px; height:4px; background:#ddd; border-radius:2px; margin:0 auto 20px; }

    /* ITEMS LIST */
    .shop-item {
      display:flex; align-items:center; padding:15px 0; border-bottom:1px solid #eee;
    }
    .item-icon { width:50px; height:50px; background:#f1f3f4; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--primary); margin-right:15px; }
    .item-info { flex:1; }
    .item-title { font-weight:500; font-size:16px; margin-bottom:4px; }
    .item-desc { font-size:13px; color:var(--text-sub); }
    .btn-buy { padding:6px 14px; background:var(--bg); color:var(--primary); border-radius:20px; font-weight:600; font-size:13px; border:none; }
    
    /* COMPASS OVERLAY */
    #viewCompass { background:#000; color:#fff; align-items:center; justify-content:center; }
    .compass-ring { width:200px; height:200px; border:2px solid #333; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
    .compass-arrow { font-size:80px; color:var(--primary); transition:transform 0.1s linear; }

  </style>
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="viewAuth" class="view active">
    <div class="auth-card">
      <div style="font-size:50px; color:var(--primary); margin-bottom:20px;"><i class="fa-solid fa-map-location-dot"></i></div>
      <h2 style="margin:0 0 40px 0;">CityCompass</h2>
      
      <div id="authLogin">
        <input id="lEmail" class="input-mat" placeholder="Email" type="email">
        <input id="lPass" class="input-mat" placeholder="Mot de passe" type="password">
        <button class="btn-mat" onclick="auth.login()">Connexion</button>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
           <button class="btn-text" onclick="ui.toAuth('authReg')">Créer un compte</button>
           <button class="btn-text" style="color:#999" onclick="ui.toAuth('authReset')">Oublié ?</button>
        </div>
      </div>

      <div id="authReg" style="display:none;">
        <h3 style="margin-top:0;">Rejoindre</h3>
        <input id="rEmail" class="input-mat" placeholder="Votre Email" type="email">
        <input id="rPass" class="input-mat" placeholder="Choisir Mot de passe" type="password">
        <button class="btn-mat" onclick="auth.register()">S'inscrire</button>
        <button class="btn-text" onclick="ui.toAuth('authLogin')">Retour</button>
      </div>
      
      <div id="authReset" style="display:none;">
        <h3>Récupération</h3>
        <input id="resEmail" class="input-mat" placeholder="Email du compte" type="email">
        <button class="btn-mat" onclick="auth.reset()">Envoyer lien</button>
        <button class="btn-text" onclick="ui.toAuth('authLogin')">Annuler</button>
      </div>
    </div>
  </div>

  <!-- MAP VIEW (MAIN) -->
  <div id="viewMap" class="view">
    <!-- Search Bar -->
    <div class="search-floater">
       <i class="fa-solid fa-bars" style="color:var(--text-sub); margin-right:15px;" onclick="ui.toggleSheet('sheetMenu')"></i>
       <span style="color:var(--text-sub); font-size:15px;">Rechercher un lieu...</span>
       <div class="avatar-btn" onclick="ui.toggleSheet('sheetProfile')">
          <i class="fa-solid fa-user"></i>
       </div>
    </div>

    <!-- Widgets -->
    <div class="widget-scroller">
       <div class="widget-pill" onclick="ui.toggleSheet('sheetShop')"><i class="fa-solid fa-bag-shopping"></i> Boutique</div>
       <div class="widget-pill" onclick="ui.openCompass()"><i class="fa-regular fa-compass"></i> Boussole</div>
       <div class="widget-pill"><i class="fa-solid fa-star"></i> <span id="ptsBadge">0</span> pts</div>
       <div class="widget-pill" style="background:#E8F0FE; color:var(--primary);" onclick="app.gpsCenter()"><i class="fa-solid fa-location-crosshairs"></i> Ma Position</div>
    </div>

    <div id="map"></div>
  </div>

  <!-- COMPASS VIEW -->
  <div id="viewCompass" class="view">
    <div class="compass-ring">
        <div style="position:absolute; top:-30px; font-weight:bold; color:var(--primary)">N</div>
        <i id="compassArrow" class="fa-solid fa-location-arrow compass-arrow"></i>
    </div>
    <div style="position:absolute; bottom:50px;">
       <button class="btn-mat" style="width:auto; padding:10px 30px; background:#333;" onclick="ui.closeCompass()">Fermer</button>
    </div>
  </div>

  <!-- SHEET: SHOP -->
  <div id="sheetShop" class="sheet">
     <div class="sheet-handle" onclick="ui.closeSheets()"></div>
     <h2 style="margin:0 0 20px 0;">Boutique</h2>
     <div style="flex:1; overflow-y:auto;">
        <!-- Item 1 -->
        <div class="shop-item">
           <div class="item-icon"><i class="fa-solid fa-moon"></i></div>
           <div class="item-info">
              <div class="item-title">Mode Sombre</div>
              <div class="item-desc">Interface nuit pour la carte</div>
           </div>
           <button class="btn-buy" onclick="app.toggleDark()">ACTIVER</button>
        </div>
        <!-- Item 2 -->
        <div class="shop-item">
           <div class="item-icon" style="color:#FBBC04"><i class="fa-solid fa-crown"></i></div>
           <div class="item-info">
              <div class="item-title">Statut VIP</div>
              <div class="item-desc">Badge spécial sur le profil</div>
           </div>
           <button class="btn-buy">500 PTS</button>
        </div>
     </div>
  </div>

  <!-- SHEET: PROFILE -->
  <div id="sheetProfile" class="sheet">
     <div class="sheet-handle" onclick="ui.closeSheets()"></div>
     <div style="text-align:center; padding-bottom:20px; border-bottom:1px solid #eee;">
        <div style="width:80px; height:80px; background:#eee; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px; color:#aaa;">👤</div>
        <h2 id="profEmail" style="margin:5px 0; font-size:18px;">user@mail.com</h2>
        <div id="profRole" style="color:var(--text-sub); font-size:14px;">Membre Standard</div>
     </div>
     
     <div style="padding-top:20px;">
        <button class="btn-mat" style="background:#f1f3f4; color:var(--danger); box-shadow:none;" onclick="auth.logout()">Se déconnecter</button>
     </div>
     
     <!-- ADMIN SECTION -->
     <div id="adminSec" style="display:none; margin-top:30px; border-top:1px dashed #ccc; padding-top:20px;">
        <h4 style="margin:0 0 10px 0;">GOD MODE (Admin)</h4>
        <input id="admTarget" class="input-mat" placeholder="Email Cible">
        <input id="admPts" class="input-mat" type="number" placeholder="Points">
        <button class="btn-mat" style="background:#0F9D58;" onclick="app.adminGive()">Donner Points</button>
     </div>
  </div>

<script>
// ============================================
// 1. INIT
// ============================================
const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';

const sb = supabase.createClient(SB_URL, SB_KEY);
let currentUser = null;
let mapObj = null;

// ============================================
// 2. AUTH SYSTEM (EMAIL)
// ============================================
const auth = {
    async login() {
        const email = document.getElementById('lEmail').value;
        const pass = document.getElementById('lPass').value;
        if(!email || !pass) return alert("Remplissez tout !");

        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) alert("Erreur: " + error.message);
    },

    async register() {
        const email = document.getElementById('rEmail').value;
        const pass = document.getElementById('rPass').value;
        if(!email || !pass) return alert("Remplissez tout !");

        const { error } = await sb.auth.signUp({
            email, password: pass,
            options: { shouldCreateUser: true }
        });

        if(error) alert("Erreur: " + error.message);
        else alert("Compte créé !");
    },

    async reset() {
        const email = document.getElementById('resEmail').value;
        if(!email) return alert("Email requis");
        const { error } = await sb.auth.resetPasswordForEmail(email);
        alert(error ? "Erreur: " + error.message : "Email envoyé !");
    },

    async init(user) {
        currentUser = user;
        const { data } = await sb.from('users').select('*').eq('id', user.id).single();
        if(data) {
            currentUser.role = data.role;
            currentUser.points = data.points;
        } else {
            currentUser.role = 'user'; currentUser.points = 0;
        }
        ui.startApp();
    },

    logout() {
        sb.auth.signOut();
        location.reload();
    }
};

// ============================================
// 3. UI LOGIC (v26 Style)
// ============================================
const ui = {
    toAuth(id) {
        ['authLogin','authReg','authReset'].forEach(x => document.getElementById(x).style.display='none');
        document.getElementById(id).style.display='block';
    },

    startApp() {
        document.getElementById('viewAuth').style.display = 'none';
        document.getElementById('viewMap').classList.add('active');
        
        // Populate Profile
        document.getElementById('profEmail').innerText = currentUser.email;
        document.getElementById('profRole').innerText = currentUser.role.toUpperCase();
        document.getElementById('ptsBadge').innerText = currentUser.points;
        
        if(currentUser.role === 'admin') document.getElementById('adminSec').style.display='block';
        
        setTimeout(app.initMap, 100);
    },

    toggleSheet(id) {
        const el = document.getElementById(id);
        const isOpen = el.classList.contains('open');
        this.closeSheets();
        if(!isOpen) el.classList.add('open');
    },

    closeSheets() {
        document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    },

    openCompass() {
        document.getElementById('viewCompass').classList.add('active');
        if(window.DeviceOrientationEvent) window.addEventListener('deviceorientation', app.handleCompass);
    },
    
    closeCompass() {
        document.getElementById('viewCompass').classList.remove('active');
        window.removeEventListener('deviceorientation', app.handleCompass);
    }
};

// ============================================
// 4. APP FEATURES
// ============================================
const app = {
    initMap() {
        if(mapObj) return;
        mapObj = L.map('map', {zoomControl: false}).setView([48.85, 2.35], 13);
        // Google Maps Style Layer (Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19, attribution: '&copy; OSM'
        }).addTo(mapObj);
        
        // Custom GPS Dot
        const dotIcon = L.divIcon({
            className: 'gps-dot',
            html: '<div style="width:16px; height:16px; background:#4285F4; border:3px solid white; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>'
        });
        const me = L.marker([0,0], {icon: dotIcon}).addTo(mapObj);
        
        mapObj.locate({setView: true, watch: true, enableHighAccuracy:true});
        mapObj.on('locationfound', e => me.setLatLng(e.latlng));
    },

    gpsCenter() {
        if(mapObj) mapObj.locate({setView: true, maxZoom:16});
    },

    handleCompass(e) {
        const deg = e.webkitCompassHeading || Math.abs(e.alpha - 360);
        document.getElementById('compassArrow').style.transform = `rotate(${-deg}deg)`;
    },
    
    toggleDark() {
        const isDark = document.body.style.filter === 'invert(1) hue-rotate(180deg)';
        document.body.style.filter = isDark ? '' : 'invert(1) hue-rotate(180deg)';
        if(mapObj) mapObj.getContainer().style.filter = isDark ? '' : 'invert(1) hue-rotate(180deg)';
    },
    
    async adminGive() {
        const tgt = document.getElementById('admTarget').value; // Ici email
        alert("Attention: Le système actuel requiert l'ID unique (UUID) de l'utilisateur, pas l'email, pour modifier les points. Demandez à l'utilisateur son UUID dans son profil.");
    }
};

// AUTO START
sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_IN' && session) {
        auth.init(session.user);
    }
});

</script>
</body>
</html>
