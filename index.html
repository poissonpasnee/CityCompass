<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CityCompass v20 - Fortress</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root { --primary: #00f2ff; --bg: #0a0a0a; --glass: rgba(255,255,255,0.05); --text: #fff; --danger: #ff4757; --success: #2ecc71; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

    /* LOGIN SCREEN - FULL SECURITY */
    #loginScreen { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .compass-anim { width: 80px; height: 80px; border: 4px solid var(--primary); border-radius: 50%; position: relative; animation: spin 3s infinite linear; margin-bottom: 30px; box-shadow: 0 0 30px var(--primary); }
    .compass-anim::after { content: ''; position: absolute; top: 10px; left: 34px; width: 4px; height: 25px; background: red; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .login-box { width: 90%; max-width: 320px; text-align: center; }
    .input-group { margin-bottom: 15px; position: relative; }
    input { width: 100%; padding: 15px; background: #222; border: 1px solid #333; color: #fff; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; text-align: center; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
    .btn-main { width: 100%; padding: 15px; background: var(--primary); color: #000; font-weight: 800; border: none; border-radius: 12px; font-size: 16px; margin-top: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .btn-sec { background: transparent; color: #666; margin-top: 15px; font-size: 14px; text-decoration: underline; cursor: pointer; border: none; }
    
    /* APP UI */
    #app { opacity: 0; transition: opacity 1s; height: 100%; display: none; }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    /* HUD */
    .hud-top { position: absolute; top: 0; left: 0; right: 0; padding: 15px; z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .user-pill { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); pointer-events: auto; display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 32px; height: 32px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
    
    /* NAVIGATION BAR */
    .nav-bar { position: absolute; bottom: 20px; left: 20px; right: 20px; height: 70px; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .nav-item { font-size: 24px; color: #666; transition: 0.3s; padding: 10px; position: relative; }
    .nav-item.active { color: var(--primary); transform: translateY(-5px); }
    .nav-item.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }

    /* PANELS (Profile, Shop, Admin) */
    .panel { position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
    .panel.open { transform: translateY(0); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .panel-title { font-size: 24px; font-weight: 800; }
    .close-btn { font-size: 24px; padding: 10px; cursor: pointer; }

    .widget { background: #111; border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #222; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #aaa; }
    .stat-val { color: #fff; font-weight: 600; }

    /* TOAST NOTIFICATIONS */
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: #fff; padding: 12px 24px; border-radius: 50px; z-index: 9999; transition: 0.3s; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 1px solid var(--primary); }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* UTILS */
    .hidden { display: none !important; }
    .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="compass-anim"></div>
  <h2 style="margin-bottom: 5px;">CITY COMPASS</h2>
  <p style="color:#666; margin-bottom: 30px; font-size: 12px;">SECURE ACCESS V20</p>
  
  <div class="login-box">
    <!-- Form Connexion -->
    <div id="formLogin">
      <div class="input-group">
        <input type="text" id="inputLoginCode" placeholder="ID (ex: 1234 5678...)" inputmode="numeric" maxlength="19">
      </div>
      <div class="input-group">
        <input type="password" id="inputLoginPass" placeholder="Mot de Passe" style="letter-spacing: 3px;">
      </div>
      <button class="btn-main" id="btnLogin">Connexion</button>
      <button class="btn-sec" onclick="toggleForms()">Créer un compte</button>
    </div>

    <!-- Form Inscription -->
    <div id="formCreate" class="hidden">
      <p style="color:var(--primary); font-size:13px; margin-bottom:15px;">Un ID unique sera généré pour vous.</p>
      <div class="input-group">
        <input type="password" id="inputCreatePass" placeholder="Créez votre Mot de Passe">
      </div>
      <button class="btn-main" id="btnCreateAccount">Créer Compte & ID</button>
      <button class="btn-sec" onclick="toggleForms()">Retour Connexion</button>
    </div>
  </div>
</div>

<!-- APP CONTENT -->
<div id="app">
  <div class="hud-top">
    <div class="user-pill" onclick="openProfile()">
      <div class="user-avatar" id="hudAvatar">U</div>
      <div>
        <div style="font-size:12px; color:#aaa;">ID: <span id="hudID">...</span></div>
        <div style="font-size:14px; font-weight:bold;"><span id="hudScore">0</span> pts</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="setView('map')">🗺️</div>
    <div class="nav-item" onclick="openShop()">🛒</div>
    <div class="nav-item" onclick="openProfile()">👤</div>
  </div>
</div>

<!-- PROFILE PANEL -->
<div id="panelProfile" class="panel">
  <div class="panel-header">
    <div class="panel-title">Profil Explorateur</div>
    <div class="close-btn" onclick="closePanels()">✕</div>
  </div>
  
  <div class="widget" style="text-align:center;">
    <div class="user-avatar" style="width:60px; height:60px; font-size:24px; margin:0 auto 10px;">U</div>
    <h3 id="profileID" style="margin:0; color:var(--primary);">ID: ....</h3>
    <p style="color:#666; font-size:12px;">Membre depuis 2026</p>
  </div>

  <div class="widget">
    <div class="stat-row"><span>Points Totaux</span> <span class="stat-val" id="profileScore">0</span></div>
    <div class="stat-row"><span>Lieux Découverts</span> <span class="stat-val" id="profilePlaces">0</span></div>
    <div class="stat-row"><span>Distance Parcourue</span> <span class="stat-val">12.4 km</span></div>
  </div>

  <button class="btn-main" id="btnAdmin" style="background:#333; margin-bottom:10px; display:none;" onclick="openAdmin()">Admin Console 🔒</button>
  <button class="btn-danger" id="btnLogout">Déconnexion</button>
</div>

<!-- SHOP PANEL -->
<div id="panelShop" class="panel">
  <div class="panel-header">
    <div class="panel-title">Boutique</div>
    <div class="close-btn" onclick="closePanels()">✕</div>
  </div>
  <div id="shopContent">
    <!-- Items injectés par JS -->
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="panelAdmin" class="panel" style="background:#1a1a1a;">
  <div class="panel-header">
    <div class="panel-title" style="color:var(--primary);">ADMIN GOD MODE</div>
    <div class="close-btn" onclick="closePanels()">✕</div>
  </div>
  <div class="widget">
    <h3>Gestion Utilisateurs</h3>
    <input type="text" id="adminSearchUser" placeholder="Chercher ID utilisateur..." style="margin-bottom:10px;">
    <button class="btn-main" onclick="adminFindUser()">Chercher</button>
    <div id="adminUserResult" style="margin-top:15px; padding:10px; background:#000; border-radius:8px; display:none;">
      <!-- Resultat recherche -->
    </div>
  </div>
</div>

<div id="toast">Message</div>

<!-- JAVASCRIPT LOGIC -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- INITIALISATION SUPABASE ---
// REMPLACEZ CES VALEURS PAR VOS VRAIES CLÉS !
const SUPABASE_URL = "VOTRE_URL_SUPABASE_ICI";
const SUPABASE_KEY = "VOTRE_CLE_ANON_ICI";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- STATE MANAGEMENT ---
let currentUser = null;
let map, userMarker;
const SUPER_ADMIN_ID = "3339683758546584"; // Votre ID Admin

// DOM ELEMENTS
const $ = id => document.getElementById(id);

// --- AUTHENTIFICATION SYSTEM (SECURISÉ) ---

// Au chargement, on vérifie si une session existe
async function checkSession() {
    const savedID = localStorage.getItem('cc_user_id');
    // On ne fait PAS de login automatique complet. 
    // On pré-remplit juste l'ID, mais on demande le mot de passe si on veut être strict (ou on fait confiance au stockage local).
    // Pour la V20 STRICTE demandée : on oblige la reconnexion si pas de session active vérifiée.
    
    if (savedID) {
        $('inputLoginCode').value = formatID(savedID);
        // Si vous voulez une reconnexion auto sans mot de passe (moins sécurisé), décommentez ceci :
        // autoLogin(savedID); 
    }
}

// FORMATAGE ID (Ajoute des espaces tous les 4 chiffres)
function formatID(val) {
    if(!val) return '';
    return val.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ').trim();
}

$('inputLoginCode').addEventListener('input', (e) => {
    e.target.value = formatID(e.target.value);
});

function toggleForms() {
    $('formLogin').classList.toggle('hidden');
    $('formCreate').classList.toggle('hidden');
}

// 1. CREATION DE COMPTE
async function createAccount() {
    const pass = $('inputCreatePass').value;
    if (pass.length < 4) return showToast("Mot de passe trop court !");

    // Générer un ID unique à 16 chiffres
    let newID = '';
    for(let i=0; i<16; i++) newID += Math.floor(Math.random()*10);

    // Insérer dans Supabase
    const { data, error } = await supabaseClient
        .from('users')
        .insert([{ id: newID, password: pass, points: 100, inventory: {} }])
        .select();

    if (error) {
        showToast("Erreur création: " + error.message);
    } else {
        showToast("Compte créé ! Notez votre ID.");
        $('inputLoginCode').value = formatID(newID);
        $('inputLoginPass').value = pass;
        toggleForms(); // Retour au login
    }
}

// 2. CONNEXION (LOGIN)
async function login() {
    const rawID = $('inputLoginCode').value.replace(/\s/g, '');
    const pass = $('inputLoginPass').value;

    if (rawID.length !== 16) return showToast("L'ID doit faire 16 chiffres");
    if (!pass) return showToast("Mot de passe OBLIGATOIRE !");

    // Vérification Supabase
    const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('id', rawID)
        .eq('password', pass) // Vérification stricte
        .single();

    if (error || !data) {
        showToast("ID ou Mot de passe incorrect !");
        // Animation de refus
        $('.login-box').style.animation = "shake 0.5s";
        setTimeout(() => $('.login-box').style.animation = "", 500);
    } else {
        // SUCCÈS
        currentUser = data;
        localStorage.setItem('cc_user_id', rawID);
        launchApp();
    }
}

// Pour re-connecter auto si besoin (non utilisé par défaut pour sécurité max)
async function autoLogin(rawID) {
    const { data } = await supabaseClient.from('users').select('*').eq('id', rawID).single();
    if(data) { currentUser = data; launchApp(); }
}

$('btnLogin').onclick = login;
$('btnLogout').onclick = () => {
    localStorage.removeItem('cc_user_id');
    location.reload();
};

// --- APP LAUNCHER ---
function launchApp() {
    // Hide Login, Show App
    $('loginScreen').style.opacity = '0';
    setTimeout(() => {
        $('loginScreen').style.display = 'none';
        $('app').style.display = 'block';
        setTimeout(() => $('app').style.opacity = '1', 50);
        initMap();
        updateHUD();
        
        // Admin Check
        if(currentUser.id === SUPER_ADMIN_ID) $('btnAdmin').style.display = 'block';
    }, 500);
}

// --- HUD & UI ---
function updateHUD() {
    if(!currentUser) return;
    $('hudID').innerText = formatID(currentUser.id).substring(0,9) + "...";
    $('hudScore').innerText = currentUser.points;
    $('profileID').innerText = formatID(currentUser.id);
    $('profileScore').innerText = currentUser.points;
}

function showToast(msg) {
    const t = $('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function openProfile() { $('panelProfile').classList.add('open'); }
function openShop() { $('panelShop').classList.add('open'); loadShop(); }
function openAdmin() { $('panelAdmin').classList.add('open'); }
function closePanels() { document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')); }

// --- MAP ENGINE (Leaflet) ---
function initMap() {
    if(map) return; // Déjà init
    
    // Centré sur Toulouse par défaut
    map = L.map('map', { zoomControl: false }).setView([43.6047, 1.4442], 13);
    
    // CartoDB Dark Matter (Ultra rapide & Beau)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OSM & CartoDB',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // User Marker
    const iconUser = L.divIcon({
        className: 'user-marker',
        html: `<div style="width:20px; height:20px; background:#00f2ff; border-radius:50%; box-shadow:0 0 15px #00f2ff; border:3px solid #fff;"></div>`,
        iconSize: [24, 24]
    });
    userMarker = L.marker([43.6047, 1.4442], {icon: iconUser}).addTo(map);

    // GPS Tracking
    if(navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            const {latitude, longitude} = pos.coords;
            userMarker.setLatLng([latitude, longitude]);
        }, err => console.log(err), {enableHighAccuracy: true});
    }
}

// --- SHOP LOGIC ---
const SHOP_ITEMS = [
    { id: 'item_nv', name: 'Vision Nocturne', price: 50, icon: '🌑' },
    { id: 'item_speed', name: 'Boost Vitesse', price: 120, icon: '⚡' },
    { id: 'item_scan', name: 'Scanner Zone', price: 200, icon: '📡' }
];

function loadShop() {
    const container = $('shopContent');
    container.innerHTML = '';
    
    SHOP_ITEMS.forEach(item => {
        const owned = currentUser.inventory && currentUser.inventory[item.id];
        const div = document.createElement('div');
        div.className = 'widget';
        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        div.style.alignItems = 'center';
        div.innerHTML = `
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="font-size:24px;">${item.icon}</div>
                <div>
                    <div style="font-weight:bold;">${item.name}</div>
                    <div style="font-size:12px; color:#666;">${owned ? 'Possédé' : item.price + ' pts'}</div>
                </div>
            </div>
            <button class="btn-main" style="width:auto; padding:8px 15px; background:${owned ? '#2ecc71' : 'var(--primary)'}" 
                onclick="buyItem('${item.id}', ${item.price})">
                ${owned ? 'Activé' : 'Acheter'}
            </button>
        `;
        container.appendChild(div);
    });
}

async function buyItem(itemId, price) {
    if(currentUser.inventory && currentUser.inventory[itemId]) return showToast("Déjà possédé !");
    if(currentUser.points < price) return showToast("Pas assez de points !");

    // Transaction
    const newPoints = currentUser.points - price;
    const newInv = { ...currentUser.inventory, [itemId]: true };

    const { error } = await supabaseClient.from('users').update({ points: newPoints, inventory: newInv }).eq('id', currentUser.id);

    if(!error) {
        currentUser.points = newPoints;
        currentUser.inventory = newInv;
        updateHUD();
        loadShop(); // Refresh UI
        showToast("Achat réussi !");
    } else {
        showToast("Erreur transaction");
    }
}

// --- ADMIN LOGIC ---
async function adminFindUser() {
    const searchID = $('adminSearchUser').value.replace(/\s/g, '');
    const { data, error } = await supabaseClient.from('users').select('*').eq('id', searchID).single();
    
    const resDiv = $('adminUserResult');
    resDiv.style.display = 'block';
    
    if(error || !data) {
        resDiv.innerHTML = '<div style="color:red">Utilisateur introuvable</div>';
    } else {
        resDiv.innerHTML = `
            <div>ID: ${data.id}</div>
            <div>Points: <input type="number" id="adminEditPoints" value="${data.points}" style="width:80px; padding:5px;"></div>
            <button class="btn-main" onclick="adminSaveUser('${data.id}')" style="margin-top:10px;">Sauvegarder</button>
        `;
    }
}

async function adminSaveUser(targetID) {
    const newPts = parseInt($('adminEditPoints').value);
    await supabaseClient.from('users').update({ points: newPts }).eq('id', targetID);
    showToast("Utilisateur mis à jour !");
    $('adminUserResult').style.display = 'none';
}

// Style CSS pour l'animation Shake
const styleSheet = document.createElement("style");
styleSheet.innerText = `@keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }`;
document.head.appendChild(styleSheet);

// Auto-start check
checkSession();

</script>
</body>
</html>
