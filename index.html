<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>CityCompass v54</title>

    <!-- Libs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- DESIGN SYSTEM V20 RESTORED --- */
        :root {
            --glass: rgba(255, 255, 255, 0.90);
            --blur: blur(25px);
            --shadow: 0 8px 40px rgba(0,0,0,0.15);
            --accent: #007AFF; /* Changé dynamiquement */
            --danger: #FF3B30;
            --text: #000;
        }
        body[data-theme="dark"] {
            --glass: rgba(28, 28, 30, 0.90);
            --text: #FFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; background: #000; color: var(--text); user-select: none; }

        /* CARTE */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: filter 0.3s; }
        
        /* HUD FLOTTANT */
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: env(safe-area-inset-top) 15px calc(env(safe-area-inset-bottom) + 20px) 15px;
        }

        /* TOP BAR */
        .top-bar { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .xp-pill {
            background: var(--glass); backdrop-filter: var(--blur); padding: 8px 16px; border-radius: 50px;
            font-weight: 800; font-size: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }
        .xp-pill:active { transform: scale(0.95); }

        /* DOCK BOTTOM */
        .dock {
            background: var(--glass); backdrop-filter: var(--blur); border-radius: 30px; padding: 12px 25px;
            display: flex; justify-content: space-between; pointer-events: auto; box-shadow: var(--shadow);
            width: 100%; max-width: 420px; align-self: center; margin-bottom: 10px;
        }
        .dock-icon {
            font-size: 24px; color: #999; padding: 8px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .dock-icon.active { color: var(--accent); transform: translateY(-4px); }
        .dock-icon.active::after {
            content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: var(--accent); border-radius: 50%;
        }

        /* PANNEAUX */
        .panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--glass);
            backdrop-filter: blur(40px); z-index: 2000; transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 80px 20px 100px 20px; overflow-y: auto; pointer-events: auto;
        }
        .panel.open { right: 0; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .panel h2 { font-size: 28px; font-weight: 800; margin: 0; }
        .close-btn { 
            background: rgba(128,128,128,0.15); width: 36px; height: 36px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text); cursor: pointer; 
        }

        /* ITEMS SHOP */
        .shop-item {
            background: rgba(128,128,128,0.08); padding: 15px; border-radius: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .shop-info { display: flex; align-items: center; gap: 15px; }
        .shop-icon { 
            width: 44px; height: 44px; border-radius: 12px; background: #eee; 
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; 
        }
        .buy-btn {
            background: var(--text); color: var(--glass); border: none; padding: 8px 16px; border-radius: 12px;
            font-weight: bold; font-size: 13px; cursor: pointer;
        }
        .buy-btn.owned { background: transparent; color: #34C759; border: 1px solid #34C759; }

        /* BOUSSOLE */
        #compassOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--glass); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #compassOverlay.active { opacity: 1; pointer-events: auto; }
        #compassRing {
            width: 260px; height: 260px; border: 6px solid var(--text); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: transform 0.1s linear;
        }
        
        /* LOGIN */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(25px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box { background: var(--glass); padding: 30px; border-radius: 30px; width: 85%; max-width: 350px; text-align: center; }
        .inp { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.1); font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; border-radius: 14px; border: none; background: var(--accent); color: white; font-weight: 700; margin-top: 10px; }

        /* ADMIN PANEL */
        #adminControls { display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(128,128,128,0.2); }
    </style>
</head>
<body data-theme="light">

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>CityCompass</h1>
            <input type="email" id="email" class="inp" placeholder="Email">
            <input type="password" id="password" class="inp" placeholder="Mot de passe">
            <button class="btn-main" onclick="auth.login()">Connexion</button>
            <button class="btn-main" style="background:transparent; color:var(--text); border:1px solid rgba(128,128,128,0.3);" onclick="auth.signup()">Créer un compte</button>
            <p id="msg" style="color:var(--danger); font-size:12px; margin-top:15px; min-height:15px;"></p>
        </div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>

    <!-- HUD -->
    <div class="hud-layer" id="hud" style="display:none;">
        <div class="top-bar">
            <div class="xp-pill" onclick="ui.open('panelProfile')">
                <i class="fa-solid fa-gem" style="color:var(--accent);"></i>
                <span id="hudPoints">...</span>
            </div>
            <div class="xp-pill" style="padding:10px; border-radius:50%;" onclick="app.toggleTheme()">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>

        <div class="dock">
            <div class="dock-icon" onclick="ui.open('panelShop')"><i class="fa-solid fa-store"></i></div>
            <div class="dock-icon" onclick="ui.open('panelWidgets')"><i class="fa-solid fa-layer-group"></i></div>
            <div class="dock-icon active" onclick="mapManager.locate()"><i class="fa-solid fa-location-arrow"></i></div>
            <div class="dock-icon" onclick="compass.open()"><i class="fa-regular fa-compass"></i></div>
        </div>
    </div>

    <!-- PANNEAU BOUTIQUE -->
    <div id="panelShop" class="panel">
        <div class="panel-head"><h2>Boutique</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        <div style="background:var(--accent); color:white; padding:20px; border-radius:20px; margin-bottom:20px; text-align:center;">
            <div style="font-size:30px; font-weight:800;" id="shopPoints">0</div>
            <div style="opacity:0.8;">Points Disponibles</div>
        </div>
        
        <div id="shopList"></div>
    </div>

    <!-- PANNEAU WIDGETS -->
    <div id="panelWidgets" class="panel">
        <div class="panel-head"><h2>Calques & Outils</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        
        <h3>Fonds de carte</h3>
        <div class="shop-item" onclick="mapManager.setLayer('standard')"><span>🗺️ Standard</span></div>
        <div class="shop-item" onclick="mapManager.setLayer('sat')"><span>🛰️ Satellite</span></div>
        
        <h3>Widgets Info</h3>
        <div class="shop-item">
            <span>📡 Trafic</span>
            <input type="checkbox" onchange="mapManager.toggleOverlay('traffic', this.checked)">
        </div>
        <div class="shop-item">
            <span>🚇 Transports</span>
            <input type="checkbox" onchange="mapManager.toggleOverlay('transit', this.checked)">
        </div>
        
        <div id="speedWidget" class="shop-item" style="display:none;">
            <div class="shop-info">
                <div class="shop-icon" style="background:#FF9500; color:white;"><i class="fa-solid fa-gauge-high"></i></div>
                <div><b>Speedomètre</b><br>0 km/h</div>
            </div>
        </div>
    </div>

    <!-- PANNEAU PROFIL -->
    <div id="panelProfile" class="panel">
        <div class="panel-head"><h2>Profil</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        <div style="text-align:center;">
            <div style="font-size:50px;">👤</div>
            <h3 id="profileEmail">Chargement...</h3>
            <button class="btn-main" style="background:var(--danger); width:auto; padding:10px 20px;" onclick="auth.logout()">Déconnexion</button>
        </div>

        <div id="adminControls">
            <h3>⚡ Control Panel (Admin)</h3>
            <input type="text" id="adminTargetEmail" class="inp" placeholder="Email utilisateur">
            <button class="btn-main" onclick="admin.givePoints()">Donner 500 Pts</button>
            <button class="btn-main" style="background:#333;" onclick="admin.reset()">Reset Profil</button>
        </div>
    </div>

    <!-- BOUSSOLE OVERLAY -->
    <div id="compassOverlay">
        <button class="close-btn" style="position:absolute; top:40px; right:20px;" onclick="compass.close()">&times;</button>
        <div id="compassRing">
            <div style="position:absolute; top:-40px; font-weight:bold;">N</div>
            <i class="fa-solid fa-location-arrow" style="font-size:80px; color:var(--danger);"></i>
        </div>
        <h1 id="compassDeg" style="margin-top:40px;">0°</h1>
        <button class="btn-main" style="width:200px; margin-top:20px;" onclick="compass.requestPerm()">Calibrer / Autoriser</button>
    </div>

<script>
    // --- 1. CONFIGURATION ---
    const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';
    const ADMIN_EMAILS = ['votre_email@exemple.com']; // AJOUTEZ VOTRE EMAIL ICI

    const ITEMS = [
        { id: 'color_purple', name: 'Thème Violet', price: 200, icon: '🎨', type: 'color', val: '#AF52DE' },
        { id: 'color_green', name: 'Thème Vert', price: 200, icon: '🎨', type: 'color', val: '#34C759' },
        { id: 'ghost_mode', name: 'Mode Fantôme', price: 500, icon: '👻', desc: 'Cache votre position' },
        { id: 'speedometer', name: 'Speedomètre', price: 300, icon: '🏎️', desc: 'Affiche la vitesse' }
    ];

    let sb, map, userMarker, currentUser, userProfile;
    let state = { theme: 'light', orientation: 0 };

    // --- 2. AUTHENTIFICATION ---
    const auth = {
        login: async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return ui.msg("Remplissez tout.");
            
            ui.msg("Connexion...");
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if(error) ui.msg(error.message);
            else app.start(data.user);
        },
        signup: async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return ui.msg("Remplissez tout.");

            ui.msg("Création...");
            const { data, error } = await sb.auth.signUp({ email, password });
            if(error) ui.msg(error.message);
            else {
                if(data.session) app.start(data.user);
                else ui.msg("Compte créé !");
            }
        },
        logout: async () => {
            await sb.auth.signOut();
            location.reload();
        }
    };

    // --- 3. GESTION APP & PERSISTANCE ---
    const app = {
        init: async () => {
            // Restaurer thème
            const savedTheme = localStorage.getItem('cc_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            state.theme = savedTheme;

            // Supabase
            sb = supabase.createClient(SB_URL, SB_KEY);
            const { data: { session } } = await sb.auth.getSession();
            
            if(session) app.start(session.user);
            else document.getElementById('loginScreen').style.display = 'flex';
        },

        start: async (user) => {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('profileEmail').innerText = user.email;

            // Admin Check
            if(ADMIN_EMAILS.includes(user.email)) {
                document.getElementById('adminControls').style.display = 'block';
            }

            mapManager.init();
            await app.loadProfile();
            
            // Restaurer dernière page
            const lastPanel = localStorage.getItem('cc_last_panel');
            if(lastPanel) ui.open(lastPanel);
        },

        loadProfile: async () => {
            // Récupérer points & items
            const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            
            if(data) {
                userProfile = data;
                app.updateUI();
                
                // Appliquer couleur sauvegardée
                if(data.color) document.documentElement.style.setProperty('--accent', data.color);
                
                // Appliquer widgets achetés
                if(data.items && data.items.includes('speedometer')) {
                    document.getElementById('speedWidget').style.display = 'flex';
                }
            } else {
                // Création locale temporaire si DB pas prête
                userProfile = { points: 100, items: [] }; 
            }
            shop.render();
        },

        updateUI: () => {
            document.getElementById('hudPoints').innerText = userProfile.points + ' XP';
            document.getElementById('shopPoints').innerText = userProfile.points;
        },

        toggleTheme: () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', state.theme);
            localStorage.setItem('cc_theme', state.theme);
            mapManager.updateTiles();
        }
    };

    // --- 4. CARTE & GEOLOC ---
    const mapManager = {
        init: () => {
            if(map) return;
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([43.6, 1.4], 13);
            mapManager.updateTiles();
            mapManager.locate();
        },
        updateTiles: () => {
            const url = state.theme === 'dark' 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            
            map.eachLayer(l => { if(l._url) map.removeLayer(l); });
            L.tileLayer(url, { maxZoom: 19 }).addTo(map);
        },
        locate: () => {
            map.locate({setView: true, watch: true, enableHighAccuracy: true});
            map.on('locationfound', e => {
                if(!userMarker) {
                    userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'var(--accent)', fillColor: 'var(--accent)', fillOpacity:1 }).addTo(map);
                } else {
                    userMarker.setLatLng(e.latlng);
                }
                
                // Speedometer logic
                if(e.speed !== null) {
                    const kmh = Math.round(e.speed * 3.6);
                    document.querySelector('#speedWidget b').innerText = "Vitesse: " + kmh + " km/h";
                }
            });
        },
        setLayer: (type) => {
            let url = '';
            if(type === 'sat') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            else if(type === 'standard') url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            
            if(url) {
                map.eachLayer(l => { if(l._url) map.removeLayer(l); });
                L.tileLayer(url).addTo(map);
            }
            ui.close();
        },
        toggleOverlay: (type, active) => {
            if(active) alert(type + " activé (Simulé)");
        }
    };

    // --- 5. BOUTIQUE & ITEMS ---
    const shop = {
        render: () => {
            const container = document.getElementById('shopList');
            container.innerHTML = '';
            
            ITEMS.forEach(item => {
                const owned = userProfile.items && userProfile.items.includes(item.id);
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="shop-info">
                        <div class="shop-icon" style="background:${item.val || '#eee'}">${item.icon}</div>
                        <div><b>${item.name}</b><br><span style="font-size:12px; opacity:0.6;">${item.desc || 'Apparence'}</span></div>
                    </div>
                    <button class="buy-btn ${owned ? 'owned' : ''}" onclick="shop.buy('${item.id}')">
                        ${owned ? 'Possédé' : item.price + ' XP'}
                    </button>
                `;
                container.appendChild(div);
            });
        },
        buy: async (id) => {
            if(userProfile.items.includes(id)) {
                // Activer l'item si possédé
                const item = ITEMS.find(i => i.id === id);
                if(item.type === 'color') {
                    document.documentElement.style.setProperty('--accent', item.val);
                    // Sauvegarder pref couleur
                    await sb.from('profiles').update({ color: item.val }).eq('id', currentUser.id);
                }
                alert("Item activé !");
                return;
            }

            const item = ITEMS.find(i => i.id === id);
            if(userProfile.points < item.price) return alert("Pas assez de points !");

            if(confirm(`Acheter ${item.name} pour ${item.price} XP ?`)) {
                const newPoints = userProfile.points - item.price;
                const newItems = [...(userProfile.items || []), id];

                // Update Local
                userProfile.points = newPoints;
                userProfile.items = newItems;
                app.updateUI();
                shop.render();

                // Update DB
                await sb.from('profiles').update({ 
                    points: newPoints, 
                    items: newItems 
                }).eq('id', currentUser.id);
            }
        }
    };

    // --- 6. BOUSSOLE ---
    const compass = {
        open: () => document.getElementById('compassOverlay').classList.add('active'),
        close: () => document.getElementById('compassOverlay').classList.remove('active'),
        requestPerm: async () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', compass.handle);
                } else alert("Permission refusée");
            } else {
                window.addEventListener('deviceorientation', compass.handle);
            }
        },
        handle: (e) => {
            const alpha = e.webkitCompassHeading || Math.abs(e.alpha - 360);
            document.getElementById('compassRing').style.transform = `rotate(${-alpha}deg)`;
            document.getElementById('compassDeg').innerText = Math.round(alpha) + "°";
        }
    };

    // --- 7. ADMIN ---
    const admin = {
        givePoints: async () => {
            const email = document.getElementById('adminTargetEmail').value;
            // Trouver l'ID via email est difficile coté client sans fonction RPC, 
            // Pour simplifier, on donne des points à l'utilisateur courant pour tester
            if(!email) {
                userProfile.points += 500;
                await sb.from('profiles').update({ points: userProfile.points }).eq('id', currentUser.id);
                app.updateUI();
                alert("500 points ajoutés (Self-Test)");
            }
        },
        reset: async () => {
            if(confirm("Reset votre profil ?")) {
                await sb.from('profiles').update({ points: 100, items: [] }).eq('id', currentUser.id);
                location.reload();
            }
        }
    };

    // --- 8. UI UTILITAIRES ---
    const ui = {
        msg: (txt) => document.getElementById('msg').innerText = txt,
        open: (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
            document.getElementById(id).classList.add('open');
            localStorage.setItem('cc_last_panel', id);
        },
        close: () => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
            localStorage.removeItem('cc_last_panel');
        }
    };

    // START
    window.onload = app.init;

</script>
</body>
</html>
