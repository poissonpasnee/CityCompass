<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityCompass Debug</title>
    
    <!-- Styles simplifiés pour être sûr que rien ne cache les boutons -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { font-family: sans-serif; background: #222; color: white; margin: 0; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #333; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #007AFF; color: white; }
        .btn-sec { background: transparent; border: 1px solid #777; color: #ccc; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    </style>

    <!-- Libs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>CityCompass</h1>
            <p id="statusMsg" style="color: #FF3B30;"></p>
            
            <input type="email" id="emailInput" placeholder="Email" value="test@test.com"> <!-- Valeur par défaut pour tester vite -->
            <input type="password" id="pwdInput" placeholder="Mot de passe">
            
            <button id="btnLogin" class="btn-primary">CONNEXION</button>
            <button id="btnSignup" class="btn-sec">CRÉER COMPTE</button>
        </div>
    </div>

    <!-- CARTE (cachée au début) -->
    <div id="map"></div>

    <script>
        // --- 1. CONFIGURATION ---
        const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';
        
        let supabase;

        // --- 2. FONCTIONS ---
        function log(msg) {
            document.getElementById('statusMsg').innerText = msg;
            console.log(msg);
        }

        async function initApp() {
            try {
                log("Initialisation...");
                supabase = window.supabase.createClient(SB_URL, SB_KEY);
                
                // Vérifier session
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    launchMap();
                } else {
                    log("Veuillez vous connecter.");
                }
            } catch (e) {
                log("Erreur Init: " + e.message);
                alert("Erreur Init: " + e.message);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('pwdInput').value;
            
            if(!email || !password) return log("Remplissez les champs !");
            
            log("Connexion en cours...");
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    log("Erreur: " + error.message);
                    alert("Erreur: " + error.message);
                } else {
                    log("Succès !");
                    launchMap();
                }
            } catch (e) {
                log("Crash Login: " + e);
                alert("Crash Login: " + e);
            }
        }

        async function handleSignup() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('pwdInput').value;
            
            log("Création compte...");
            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    log("Erreur: " + error.message);
                } else {
                    log("Compte créé ! Vérifiez vos emails ou connectez-vous.");
                }
            } catch (e) {
                log("Crash Signup: " + e);
            }
        }

        function launchMap() {
            document.getElementById('loginScreen').style.display = 'none';
            // Initialiser carte
            var map = L.map('map').setView([43.6, 1.4], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            // Géoloc
            map.locate({setView: true, maxZoom: 16});
            map.on('locationfound', function(e) {
                L.circleMarker(e.latlng, {color: 'blue'}).addTo(map);
            });
            
            alert("Bienvenue dans CityCompass !");
        }

        // --- 3. ÉCOUTEURS D'ÉVÉNEMENTS (Plus fiable que onclick HTML) ---
        window.onload = function() {
            initApp();
            
            document.getElementById('btnLogin').addEventListener('click', handleLogin);
            document.getElementById('btnSignup').addEventListener('click', handleSignup);
        };
    </script>
</body>
</html>
