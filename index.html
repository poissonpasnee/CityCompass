<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CityCompass V31</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3b82f6; --bg: #f8fafc; --text: #1e293b; --danger: #ef4444; --success: #22c55e;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        [data-theme="dark"] { --bg: #0f172a; --text: #f1f5f9; --primary: #60a5fa; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* SCREENS */
        .screen { position: absolute; inset: 0; background: var(--bg); z-index: 10; display: none; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); overflow-y: auto; }
        .screen.active { display: flex; z-index: 20; }

        /* LOGIN */
        .auth-box { width: 90%; max-width: 400px; margin: auto; text-align: center; padding: 20px; }
        .logo { font-size: 3rem; color: var(--primary); margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; background: rgba(255,255,255,0.9); color: #000; text-align:center; letter-spacing:1px; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: white; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .link { color: var(--primary); margin-top: 15px; text-decoration: underline; font-size: 0.9rem; cursor: pointer; }

        /* APP HUD */
        #map { flex: 1; width: 100%; z-index: 1; }
        .hud { position: absolute; top: calc(15px + var(--safe-top)); left: 15px; right: 15px; z-index: 500; display: flex; justify-content: space-between; pointer-events: none; }
        .widget { background: rgba(255,255,255,0.95); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: auto; display: flex; align-items: center; gap: 8px; font-weight: bold; color: #333; }
        
        /* NAV BAR */
        .nav { background: #fff; padding: 10px 0 calc(10px + var(--safe-bottom)); display: flex; justify-content: space-around; border-top: 1px solid #eee; z-index: 1000; }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 0.7rem; gap: 4px; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn i { font-size: 1.4rem; }

        /* PANELS */
        .panel { position: fixed; inset: 0; background: var(--bg); z-index: 2000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
        .panel.open { transform: translateY(0); }
        .panel-head { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #eee; }
        .panel-body { padding: 20px; flex: 1; overflow-y: auto; }

        /* SHOP ITEMS */
        .shop-item { background: #fff; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        [data-theme="dark"] .shop-item { background: #1e293b; }

        /* COMPASS */
        #compassScreen { background: #111; color: #fff; align-items: center; justify-content: center; z-index: 3000; }
        #arrow { font-size: 8rem; color: var(--primary); transition: transform 0.1s linear; }

        /* TOAST */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: white; padding: 10px 20px; border-radius: 50px; z-index: 9999; transition: transform 0.3s; font-size: 0.9rem; }
        #toast.visible { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- NOTIF -->
    <div id="toast">Info</div>

    <!-- 1. LOGIN -->
    <div id="scrLogin" class="screen active">
        <div class="auth-box">
            <div class="logo"><i class="fa-solid fa-compass"></i></div>
            <h2>CityCompass</h2>
            <p>v31 Fusion</p>
            
            <input type="text" id="inpUserCode" placeholder="Code ID (16 chiffres)" inputmode="numeric">
            <button id="btnLogin" class="btn" onclick="auth.login()">Connexion</button>
            <div class="link" onclick="auth.create()">Créer un compte</div>
        </div>
    </div>

    <!-- 2. APP -->
    <div id="scrApp" class="screen">
        <div class="hud">
            <div class="widget"><i class="fa-solid fa-coins" style="color:gold"></i> <span id="uiPts">0</span></div>
            <div class="widget"><i class="fa-solid fa-satellite-dish"></i> <span id="uiGps">GPS</span></div>
        </div>
        
        <div id="map"></div>
        
        <div class="nav">
            <button class="nav-btn active" onclick="ui.closePanels()"><i class="fa-solid fa-map"></i> Carte</button>
            <button class="nav-btn" onclick="ui.openComp()"><i class="fa-regular fa-compass"></i> Boussole</button>
            <button class="nav-btn" onclick="ui.openPanel('shop')"><i class="fa-solid fa-store"></i> Shop</button>
            <button class="nav-btn" onclick="ui.openPanel('profile')"><i class="fa-solid fa-user"></i> Profil</button>
        </div>
    </div>

    <!-- 3. PANELS -->
    <div id="panel_shop" class="panel">
        <div class="panel-head">Boutique <i class="fa-solid fa-xmark" onclick="ui.closePanels()"></i></div>
        <div class="panel-body" id="shopList">
            <!-- Items injected by JS -->
        </div>
    </div>

    <div id="panel_profile" class="panel">
        <div class="panel-head">Profil <i class="fa-solid fa-xmark" onclick="ui.closePanels()"></i></div>
        <div class="panel-body">
            <div style="text-align:center; margin-bottom:20px">
                <i class="fa-solid fa-user-astronaut" style="font-size:4rem; color:#cbd5e1"></i>
                <h3 id="pId">ID: --</h3>
                <p>Niveau <span id="pLevel">1</span></p>
            </div>
            <button class="btn" style="background:var(--text)" onclick="auth.logout()">Déconnexion</button>

            <!-- Admin Only -->
            <div id="admZone" style="display:none; margin-top:30px; border:2px dashed var(--danger); padding:15px; border-radius:10px">
                <h4 style="color:var(--danger); margin:0 0 10px 0">ADMIN</h4>
                <input id="admPtsTgt" placeholder="ID Cible" style="width:100%; margin-bottom:5px;">
                <input id="admPtsVal" placeholder="Montant" type="number" style="width:100%; margin-bottom:5px;">
                <button class="btn" style="background:var(--success)" onclick="admin.give()">Donner Points</button>
            </div>
        </div>
    </div>

    <!-- 4. COMPASS -->
    <div id="compassScreen" class="screen">
        <div style="position:absolute; top:50px">NORD</div>
        <i id="arrow" class="fa-solid fa-location-arrow"></i>
        <button class="btn" style="width:auto; position:absolute; bottom:50px; background:#333" onclick="ui.closeComp()">Fermer</button>
    </div>

<script>
// ==========================================
// CONFIGURATION SUPABASE
// ==========================================
const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';

const sb = supabase.createClient(SB_URL, SB_KEY);
const ADMIN_ID = "0000000000000000"; 

// ==========================================
// LOGIQUE
// ==========================================
const $ = (id) => document.getElementById(id);
const toast = (m) => { $('toast').innerText=m; $('toast').classList.add('visible'); setTimeout(()=>$('toast').classList.remove('visible'), 3000); };

let userCode = null;
let userPoints = 0;
let mapObj = null;
let mapTileLayer = null;
let activeFeatures = {}; // Stocke les achats

// Liste des objets (Logique de votre script paste.txt)
let shopItems = [
    { id: 'theme_dark', name: 'Mode Sombre', price: 0, icon: '🌙' },
    { id: 'map_sat', name: 'Vue Satellite', price: 500, icon: '🛰️' },
    { id: 'map_retro', name: 'Vue Blueprint', price: 300, icon: '🗺️' },
    { id: 'style_marker_car', name: 'Icône Voiture', price: 1000, icon: '🚗' },
];

const auth = {
    async login() {
        const id = $('inpUserCode').value.replace(/\s/g, '');
        if(id.length < 4) return toast("ID Invalide");
        
        const { data } = await sb.from('users').select('*').eq('id', id);
        if(data && data.length) {
            this.startSession(id, data[0].points);
        } else {
            toast("Compte introuvable");
        }
    },
    async create() {
        const id = Array(16).fill(0).map(()=>Math.floor(Math.random()*10)).join('');
        await sb.from('users').insert([{ id: id, points: 200 }]);
        alert("Votre ID : " + id);
        this.startSession(id, 200);
    },
    startSession(id, points) {
        userCode = id;
        userPoints = points;
        localStorage.setItem('cc_sess', id);
        
        $('scrLogin').classList.remove('active');
        $('scrApp').classList.add('active');
        
        $('uiPts').innerText = points;
        $('pId').innerText = "ID: " + id.replace(/(\d{4})(?=\d)/g, '$1 ');
        $('pLevel').innerText = Math.floor(points/500) + 1;
        
        if(id === ADMIN_ID) $('admZone').style.display = 'block';

        app.loadPurchases(); // Charger les achats depuis Supabase
        app.renderShop();
        setTimeout(ui.initMap, 500);
    },
    logout() { localStorage.removeItem('cc_sess'); location.reload(); }
};

const app = {
    async loadPurchases() {
        // Charge les achats depuis user_favorites (format JSONB du script paste.txt)
        const { data } = await sb.from('user_favorites').select('place_data').eq('user_id', userCode);
        if(data) {
            data.forEach(row => {
                if(row.place_data && row.place_data.type === 'purchase') {
                    activeFeatures[row.place_data.itemId] = true;
                }
            });
            ui.updateMapTiles();
            if(activeFeatures['theme_dark']) document.body.dataset.theme = 'dark';
            this.renderShop();
        }
    },
    
    renderShop() {
        const list = $('shopList'); list.innerHTML = '';
        shopItems.forEach(item => {
            const owned = activeFeatures[item.id];
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div>
                    <strong>${item.icon} ${item.name}</strong>
                    <div style="font-size:0.8rem; opacity:0.7">${item.price} pts</div>
                </div>
                <button class="btn" style="width:auto; padding:5px 15px; font-size:0.8rem; background:${owned?'#ccc':''}" 
                        onclick="app.buy('${item.id}', ${item.price})" ${owned?'disabled':''}>
                    ${owned ? 'Acquis' : 'Acheter'}
                </button>
            `;
            list.appendChild(div);
        });
    },

    async buy(itemId, price) {
        if(userPoints < price) return toast("Pas assez de points !");
        
        if(confirm("Confirmer l'achat ?")) {
            // 1. Débit points
            const newPts = userPoints - price;
            await sb.from('users').update({points: newPts}).eq('id', userCode);
            userPoints = newPts;
            $('uiPts').innerText = userPoints;
            
            // 2. Sauvegarde achat
            await sb.from('user_favorites').insert([{
                user_id: userCode,
                place_data: { type: 'purchase', itemId: itemId, date: new Date() }
            }]);
            
            activeFeatures[itemId] = true;
            this.renderShop();
            ui.updateMapTiles();
            if(itemId === 'theme_dark') document.body.dataset.theme = 'dark';
            toast("Achat réussi !");
        }
    }
};

const ui = {
    openPanel: (name) => $('panel_'+name).classList.add('open'),
    closePanels: () => document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')),
    
    openComp: () => {
        $('compassScreen').classList.add('active');
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(r => {
                if(r === 'granted') window.addEventListener('deviceorientation', ui.handleComp);
            });
        } else {
            window.addEventListener('deviceorientation', ui.handleComp);
        }
    },
    closeComp: () => {
        $('compassScreen').classList.remove('active');
        window.removeEventListener('deviceorientation', ui.handleComp);
    },
    handleComp: (e) => {
        const d = e.webkitCompassHeading || Math.abs(e.alpha - 360);
        $('arrow').style.transform = `rotate(${-d}deg)`;
    },

    initMap: () => {
        if(mapObj) return;
        mapObj = L.map('map', {zoomControl: false}).setView([48.85, 2.35], 13);
        ui.updateMapTiles();
        
        mapObj.locate({setView: true, watch: true});
        const m = L.marker([0,0]).addTo(mapObj);
        
        mapObj.on('locationfound', e => {
            m.setLatLng(e.latlng);
            $('uiGps').style.color = '#22c55e';
            
            // Icone personnalisée si achetée
            if(activeFeatures['style_marker_car']) {
                m.setIcon(L.divIcon({html:'🚗', className:'', iconSize:[24,24]}));
            }
        });
    },
    
    updateMapTiles: () => {
        if(!mapObj) return;
        if(mapTileLayer) mapObj.removeLayer(mapTileLayer);
        
        let url = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
        if(activeFeatures['theme_dark']) url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        if(activeFeatures['map_sat']) url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        
        mapTileLayer = L.tileLayer(url, {maxZoom: 19}).addTo(mapObj);
    }
};

const admin = {
    async give() {
        const id = $('admPtsTgt').value;
        const pts = parseInt($('admPtsVal').value);
        await sb.from('users').update({points: pts}).eq('id', id);
        toast("Points envoyés !");
    }
};

// Auto Login
const sess = localStorage.getItem('cc_sess');
if(sess) { $('inpUserCode').value = sess; auth.login(); }

</script>
</body>
</html>
