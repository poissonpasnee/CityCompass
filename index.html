<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>CityCompass v55</title>

    <!-- Libs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --glass: rgba(255, 255, 255, 0.92);
            --blur: blur(30px);
            --shadow: 0 10px 40px rgba(0,0,0,0.15);
            --accent: #007AFF;
            --danger: #FF3B30;
            --success: #34C759;
            --text: #000;
        }
        body[data-theme="dark"] {
            --glass: rgba(28, 28, 30, 0.92);
            --text: #FFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; background: #000; color: var(--text); user-select: none; }

        /* CARTE & UI */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: env(safe-area-inset-top) 15px calc(env(safe-area-inset-bottom) + 20px) 15px;
        }

        /* RECHERCHE FLOTTANTE */
        .search-bar {
            background: var(--glass); backdrop-filter: var(--blur); pointer-events: auto;
            border-radius: 25px; padding: 12px 20px; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 10px; margin-top: 10px; position: relative;
        }
        .search-inp { border: none; background: transparent; font-size: 16px; width: 100%; outline: none; color: var(--text); }
        .search-results {
            position: absolute; top: 60px; left: 0; width: 100%; background: var(--glass);
            backdrop-filter: var(--blur); border-radius: 20px; max-height: 250px; overflow-y: auto;
            display: none; padding: 10px; box-shadow: var(--shadow);
        }
        .result-item { padding: 12px; border-bottom: 1px solid rgba(128,128,128,0.1); cursor: pointer; }
        .result-item:last-child { border: none; }

        /* DOCK BOTTOM */
        .dock {
            background: var(--glass); backdrop-filter: var(--blur); border-radius: 35px; padding: 12px 25px;
            display: flex; justify-content: space-between; pointer-events: auto; box-shadow: var(--shadow);
            width: 100%; max-width: 400px; align-self: center;
        }
        .dock-icon { font-size: 24px; color: #999; padding: 10px; transition: 0.2s; position: relative; }
        .dock-icon.active { color: var(--accent); transform: translateY(-3px); }

        /* PANNEAUX */
        .panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--glass);
            backdrop-filter: blur(40px); z-index: 2000; transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 80px 20px 100px 20px; overflow-y: auto; pointer-events: auto;
        }
        .panel.open { right: 0; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .panel h2 { font-size: 28px; font-weight: 800; margin: 0; }
        .close-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(128,128,128,0.15); color: var(--text); font-size: 18px; }

        /* WIDGETS & SHOP */
        .shop-item {
            background: rgba(128,128,128,0.08); padding: 15px; border-radius: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .shop-info { display: flex; align-items: center; gap: 15px; }
        .shop-icon { 
            width: 44px; height: 44px; border-radius: 12px; background: #eee; 
            display: flex; align-items: center; justify-content: center; font-size: 22px; 
        }
        .buy-btn {
            background: var(--text); color: var(--glass); border: none; padding: 8px 16px; border-radius: 12px;
            font-weight: bold; font-size: 13px; cursor: pointer;
        }
        /* Toggle Switch pour les widgets possédés */
        .toggle-switch {
            position: relative; width: 50px; height: 30px; display: inline-block;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* LOGIN */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(25px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box { background: var(--glass); padding: 30px; border-radius: 30px; width: 85%; max-width: 350px; text-align: center; }
        .inp { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.1); font-size: 16px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; border-radius: 14px; border: none; background: var(--accent); color: white; font-weight: 700; margin-top: 10px; cursor: pointer;}
        
        /* ADMIN & SETTINGS */
        .section-title { font-size: 14px; font-weight: 700; opacity: 0.5; text-transform: uppercase; margin: 20px 0 10px 0; letter-spacing: 1px; }
        .setting-row { padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body data-theme="light">

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1 style="margin:0 0 20px 0;">CityCompass</h1>
            <input type="email" id="email" class="inp" placeholder="Email">
            <input type="password" id="password" class="inp" placeholder="Mot de passe">
            <button class="btn-main" onclick="auth.login()">Connexion</button>
            <button class="btn-main" style="background:transparent; color:var(--text); border:1px solid rgba(128,128,128,0.3);" onclick="auth.signup()">Créer un compte</button>
            <p id="msg" style="color:var(--danger); font-size:12px; margin-top:15px; min-height:15px;"></p>
        </div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>

    <!-- HUD -->
    <div class="hud-layer" id="hud" style="display:none;">
        
        <!-- Barre Recherche -->
        <div class="search-bar">
            <i class="fa-solid fa-search" style="opacity:0.5;"></i>
            <input type="text" class="search-inp" id="searchInp" placeholder="Où aller ?" onkeyup="mapManager.search(this.value)">
            <div class="xp-pill" onclick="ui.open('panelProfile')" style="font-size:12px; font-weight:bold; color:var(--accent);">
                <span id="hudPoints">0</span> XP
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- Dock -->
        <div class="dock">
            <div class="dock-icon" onclick="ui.open('panelShop')"><i class="fa-solid fa-store"></i></div>
            <div class="dock-icon" onclick="ui.open('panelTools')"><i class="fa-solid fa-layer-group"></i></div>
            <div class="dock-icon active" onclick="mapManager.locate()"><i class="fa-solid fa-location-arrow"></i></div>
            <div class="dock-icon" onclick="ui.open('panelProfile')"><i class="fa-solid fa-user"></i></div>
        </div>
    </div>

    <!-- PANNEAU BOUTIQUE -->
    <div id="panelShop" class="panel">
        <div class="panel-head"><h2>Boutique</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        <div style="background:var(--accent); color:white; padding:20px; border-radius:20px; margin-bottom:20px; text-align:center;">
            <div style="font-size:30px; font-weight:800;" id="shopPoints">0</div>
            <div style="opacity:0.8;">Points Disponibles</div>
        </div>
        <div id="shopList"></div>
    </div>

    <!-- PANNEAU CALQUES & OUTILS (FAVORIS) -->
    <div id="panelTools" class="panel">
        <div class="panel-head"><h2>Outils</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        
        <div class="section-title">Mes Favoris</div>
        <div id="favList" style="margin-bottom:20px; color:gray; font-size:14px;">Aucun favori</div>

        <div class="section-title">Fonds de carte</div>
        <div class="shop-item" onclick="mapManager.setLayer('standard')"><span>🗺️ Standard</span></div>
        <div class="shop-item" onclick="mapManager.setLayer('sat')"><span>🛰️ Satellite</span></div>
        <div class="shop-item" onclick="mapManager.setLayer('dark')"><span>🌑 Mode Nuit</span></div>
    </div>

    <!-- PANNEAU PROFIL & PARAMETRES & ADMIN -->
    <div id="panelProfile" class="panel">
        <div class="panel-head"><h2>Mon Compte</h2><button class="close-btn" onclick="ui.close()">&times;</button></div>
        
        <div style="text-align:center; margin-bottom:30px;">
            <div style="width:80px; height:80px; background:var(--accent); color:white; border-radius:50%; margin:0 auto 15px auto; display:flex; align-items:center; justify-content:center; font-size:30px;">👤</div>
            <h3 id="profileEmail">...</h3>
        </div>

        <!-- Paramètres -->
        <div class="section-title">Paramètres</div>
        <div class="setting-row" onclick="settings.updateEmail()">
            <span>Changer Email</span> <i class="fa-solid fa-chevron-right"></i>
        </div>
        <div class="setting-row" onclick="settings.updatePwd()">
            <span>Changer Mot de passe</span> <i class="fa-solid fa-chevron-right"></i>
        </div>
        <div class="setting-row" onclick="settings.toggleTheme()">
            <span>Mode Sombre / Clair</span> <i class="fa-solid fa-adjust"></i>
        </div>
        <div class="setting-row" style="color:var(--danger);" onclick="auth.logout()">
            <span>Se déconnecter</span> <i class="fa-solid fa-power-off"></i>
        </div>

        <!-- ADMIN PANEL (Visible uniquement si admin) -->
        <div id="adminPanel" style="display:none; margin-top:40px; border-top:2px solid rgba(128,128,128,0.2); padding-top:20px;">
            <h3 style="color:var(--danger);">⚡ Control Panel</h3>
            
            <div class="section-title">Gestion Points</div>
            <input type="text" id="admUserEmail" class="inp" placeholder="Email utilisateur">
            <div style="display:flex; gap:10px;">
                <button class="btn-main" onclick="admin.modPoints(100)">+100 XP</button>
                <button class="btn-main" style="background:#333;" onclick="admin.modPoints(-100)">-100 XP</button>
            </div>

            <div class="section-title">Lieux Publics</div>
            <button class="btn-main" onclick="admin.addPublicPlace()">Ajouter Position Actuelle comme Lieu Public</button>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION ---
    const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44';

    // Liste des Widgets (~10)
    const ITEMS = [
        { id: 'color_purple', name: 'Thème Violet', price: 200, icon: '🎨', type: 'theme', val: '#AF52DE' },
        { id: 'color_orange', name: 'Thème Orange', price: 200, icon: '🎨', type: 'theme', val: '#FF9500' },
        { id: 'w_traffic', name: 'Info Trafic', price: 100, icon: '🚦', type: 'widget' },
        { id: 'w_transit', name: 'Transports', price: 150, icon: '🚇', type: 'widget' },
        { id: 'w_bike', name: 'Pistes Cyclables', price: 150, icon: '🚲', type: 'widget' },
        { id: 'w_ghost', name: 'Mode Fantôme', price: 500, icon: '👻', type: 'widget', desc: 'Cache votre position' },
        { id: 'w_speed', name: 'Speedomètre', price: 300, icon: '🏎️', type: 'widget', desc: 'Vitesse temps réel' },
        { id: 'w_weather', name: 'Météo (Simu)', price: 250, icon: '☁️', type: 'widget' },
        { id: 'w_3d', name: 'Bâtiments 3D', price: 400, icon: '🏢', type: 'widget' },
        { id: 'w_voice', name: 'Guidage Vocal', price: 600, icon: '🎙️', type: 'widget' }
    ];

    let sb, map, userMarker, currentUser, userProfile;
    let state = { theme: 'light', lastLoc: null };

    // --- 2. AUTHENTIFICATION ---
    const auth = {
        login: async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return ui.msg("Remplissez tout.");
            ui.msg("Connexion...");
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if(error) ui.msg(error.message); else app.start(data.user);
        },
        signup: async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return ui.msg("Remplissez tout.");
            ui.msg("Création...");
            const { data, error } = await sb.auth.signUp({ email, password });
            if(error) ui.msg(error.message); else if(data.session) app.start(data.user); else ui.msg("Compte créé !");
        },
        logout: async () => { await sb.auth.signOut(); location.reload(); }
    };

    // --- 3. LOGIQUE PRINCIPALE ---
    const app = {
        init: async () => {
            sb = supabase.createClient(SB_URL, SB_KEY);
            // Restaurer thème
            state.theme = localStorage.getItem('cc_theme') || 'light';
            document.body.setAttribute('data-theme', state.theme);

            const { data: { session } } = await sb.auth.getSession();
            if(session) app.start(session.user);
            else document.getElementById('loginScreen').style.display = 'flex';
        },

        start: async (user) => {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('profileEmail').innerText = user.email;

            mapManager.init();
            await app.loadData();
            
            // Restaurer panel
            const last = localStorage.getItem('cc_last_panel');
            if(last) ui.open(last);
        },

        loadData: async () => {
            const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            if(data) {
                userProfile = data;
                app.applySettings();
                shop.render();
                mapManager.renderFavs();
                
                if(data.is_admin) document.getElementById('adminPanel').style.display = 'block';
            }
        },

        applySettings: () => {
            document.getElementById('hudPoints').innerText = userProfile.points;
            document.getElementById('shopPoints').innerText = userProfile.points;
            if(userProfile.color) document.documentElement.style.setProperty('--accent', userProfile.color);
            // Appliquer widgets
            (userProfile.active_items || []).forEach(id => {
                 // Logique d'activation des widgets ici (ex: Trafic)
                 if(id === 'w_traffic') mapManager.toggleOverlay('traffic', true);
            });
        }
    };

    // --- 4. MAP & RECHERCHE ---
    const mapManager = {
        init: () => {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([43.6, 1.4], 13);
            mapManager.setLayer(state.theme === 'dark' ? 'dark' : 'standard');
            
            // Click Map -> Popup
            map.on('click', (e) => {
                L.popup()
                    .setLatLng(e.latlng)
                    .setContent(`<div style="text-align:center;">
                        <b>Point sélectionné</b><br>
                        <button class="buy-btn" onclick="mapManager.addFav(${e.latlng.lat}, ${e.latlng.lng})">⭐ Ajouter Favori</button>
                    </div>`)
                    .openOn(map);
            });
            mapManager.locate();
        },
        
        locate: () => {
            map.locate({setView: true, watch: true});
            map.on('locationfound', e => {
                state.lastLoc = e.latlng;
                if(!userMarker) userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'var(--accent)', fillColor: 'var(--accent)', fillOpacity:1 }).addTo(map);
                else userMarker.setLatLng(e.latlng);
            });
        },

        search: async (q) => {
            if(q.length < 3) return;
            const center = map.getCenter();
            // Utilisation de Nominatim (OSM)
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&viewbox=${center.lng-1},${center.lat+1},${center.lng+1},${center.lat-1}`);
            const data = await res.json();
            
            const list = document.getElementById('searchResults');
            list.innerHTML = '';
            list.style.display = 'block';
            
            data.slice(0, 5).forEach(place => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerText = place.display_name.split(',')[0]; // Nom court
                div.onclick = () => {
                    map.setView([place.lat, place.lon], 16);
                    list.style.display = 'none';
                    document.getElementById('searchInp').value = '';
                };
                list.appendChild(div);
            });
        },

        addFav: async (lat, lng) => {
            const name = prompt("Nom du lieu ?");
            if(!name) return;
            const newFav = { name, lat, lng };
            const favs = [...(userProfile.favorites || []), newFav];
            
            await sb.from('profiles').update({ favorites: favs }).eq('id', currentUser.id);
            userProfile.favorites = favs;
            mapManager.renderFavs();
            alert("Favori ajouté !");
            map.closePopup();
        },

        renderFavs: () => {
            const container = document.getElementById('favList');
            if(!userProfile.favorites || userProfile.favorites.length === 0) return;
            container.innerHTML = '';
            userProfile.favorites.forEach(f => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `<span>⭐ ${f.name}</span> <button class="buy-btn" onclick="map.setView([${f.lat}, ${f.lng}], 16); ui.close()">Aller</button>`;
                container.appendChild(div);
            });
        },

        setLayer: (type) => {
            let url = type === 'dark' ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            if(type === 'sat') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            
            map.eachLayer(l => { if(l._url) map.removeLayer(l); });
            L.tileLayer(url).addTo(map);
        },

        toggleOverlay: (type, on) => {
            if(on) alert("Calque " + type + " activé");
        }
    };

    // --- 5. BOUTIQUE & WIDGETS ---
    const shop = {
        render: () => {
            const container = document.getElementById('shopList');
            container.innerHTML = '';
            ITEMS.forEach(item => {
                const owned = userProfile.items && userProfile.items.includes(item.id);
                const active = userProfile.active_items && userProfile.active_items.includes(item.id);
                
                let actionBtn = `<button class="buy-btn" onclick="shop.buy('${item.id}')">${item.price} XP</button>`;
                
                if(owned) {
                    actionBtn = `<label class="toggle-switch">
                        <input type="checkbox" ${active ? 'checked' : ''} onchange="shop.toggle('${item.id}', this.checked)">
                        <span class="slider"></span>
                    </label>`;
                }

                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="shop-info">
                        <div class="shop-icon" style="background:${item.val || '#eee'}">${item.icon}</div>
                        <div><b>${item.name}</b><br><span style="font-size:12px; opacity:0.6;">${item.desc || item.type}</span></div>
                    </div>
                    ${actionBtn}
                `;
                container.appendChild(div);
            });
        },

        buy: async (id) => {
            const item = ITEMS.find(i => i.id === id);
            if(userProfile.points < item.price) return alert("Pas assez de points !");
            
            if(confirm(`Acheter ${item.name} ?`)) {
                const newPts = userProfile.points - item.price;
                const newItems = [...(userProfile.items || []), id];
                
                // Optimistic Update
                userProfile.points = newPts;
                userProfile.items = newItems;
                app.applySettings();
                shop.render();

                await sb.from('profiles').update({ points: newPts, items: newItems }).eq('id', currentUser.id);
            }
        },

        toggle: async (id, isActive) => {
            let actives = userProfile.active_items || [];
            if(isActive) actives.push(id);
            else actives = actives.filter(x => x !== id);
            
            userProfile.active_items = actives;
            
            // Effet immédiat
            const item = ITEMS.find(i => i.id === id);
            if(item.type === 'theme' && isActive) document.documentElement.style.setProperty('--accent', item.val);
            if(item.type === 'widget') mapManager.toggleOverlay(id, isActive);

            await sb.from('profiles').update({ active_items: actives }).eq('id', currentUser.id);
        }
    };

    // --- 6. SETTINGS & ADMIN ---
    const settings = {
        updateEmail: async () => {
            const m = prompt("Nouvel email ?");
            if(m) {
                const { error } = await sb.auth.updateUser({ email: m });
                alert(error ? error.message : "Email mis à jour !");
            }
        },
        updatePwd: async () => {
            const p = prompt("Nouveau mot de passe ?");
            if(p) {
                const { error } = await sb.auth.updateUser({ password: p });
                alert(error ? error.message : "Mot de passe mis à jour !");
            }
        },
        toggleTheme: () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', state.theme);
            localStorage.setItem('cc_theme', state.theme);
            mapManager.setLayer(state.theme === 'dark' ? 'dark' : 'standard');
        }
    };

    const admin = {
        modPoints: async (amount) => {
            // Dans une vraie app, on utiliserait une Edge Function. Ici on modifie le profil actuel pour démo.
            // Pour modifier UN AUTRE user, il faudrait que les policies RLS le permettent, ce qui est risqué en client-side.
            // L'admin modifie donc ses propres points ici pour tester la mécanique.
            userProfile.points += amount;
            app.applySettings();
            await sb.from('profiles').update({ points: userProfile.points }).eq('id', currentUser.id);
            alert("Points mis à jour !");
        },
        addPublicPlace: async () => {
            if(!state.lastLoc) return alert("Attendez la géoloc");
            const name = prompt("Nom du lieu public ?");
            if(name) {
                const { error } = await sb.from('places').insert({ 
                    name, lat: state.lastLoc.lat, lng: state.lastLoc.lng, type: 'admin_pick' 
                });
                alert(error ? error.message : "Lieu public ajouté !");
            }
        }
    };

    // --- 7. UI ---
    const ui = {
        msg: (t) => document.getElementById('msg').innerText = t,
        open: (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
            document.getElementById(id).classList.add('open');
            localStorage.setItem('cc_last_panel', id);
        },
        close: () => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
            localStorage.removeItem('cc_last_panel');
        }
    };

    window.onload = app.init;
</script>
</body>
</html>
