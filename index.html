<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>CityCompass v50 Ultimate</title>

    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase & Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- DESIGN SYSTEM : LIQUID GLASS --- */
        :root {
            --bg-glass: rgba(255, 255, 255, 0.75);
            --bg-panel: rgba(255, 255, 255, 0.95);
            --text: #000000;
            --accent: #007AFF;
            --danger: #FF3B30;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
            --blur: blur(20px);
        }
        body[data-theme="dark"] {
            --bg-glass: rgba(28, 28, 30, 0.75);
            --bg-panel: rgba(28, 28, 30, 0.95);
            --text: #FFFFFF;
            --accent: #0A84FF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #000; color: var(--text); }

        /* CARTE */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* INTERFACE FLOTTANTE (HUD) */
        .hud-layer {
            position: absolute; z-index: 1000; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 50px 20px 40px 20px;
        }
        .hud-group { display: flex; gap: 15px; pointer-events: auto; }
        .hud-top { justify-content: space-between; align-items: flex-start; }
        .hud-bottom { justify-content: space-between; align-items: flex-end; }

        /* BOUTONS GLASS */
        .glass-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--bg-glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--text); cursor: pointer; transition: transform 0.2s;
        }
        .glass-btn:active { transform: scale(0.9); }
        .glass-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* PANNEAUX (Shop, Settings, etc.) */
        .panel {
            position: absolute; bottom: 0; left: 0; width: 100%; max-height: 80%;
            background: var(--bg-panel); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 2000; padding: 25px; display: flex; flex-direction: column;
            overflow-y: auto; pointer-events: auto;
        }
        .panel.open { transform: translateY(0); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .panel-title { font-size: 24px; font-weight: 800; }
        .close-btn { background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; }

        /* LOGIN OVERLAY (Fixé) */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(30px); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--bg-panel); padding: 40px; border-radius: 30px; width: 100%; max-width: 380px;
            box-shadow: var(--shadow); text-align: center;
        }
        .login-input {
            width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 16px; border: 1px solid rgba(128,128,128,0.2);
            background: rgba(128,128,128,0.1); font-size: 16px; color: var(--text); outline: none;
        }
        .login-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 17px; font-weight: 700;
            background: var(--accent); color: white; margin-top: 10px; cursor: pointer;
        }
        
        /* WIDGETS INTERNES */
        .widget-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(128,128,128,0.1); padding: 15px; border-radius: 16px; margin-bottom: 10px;
        }
        .switch {
            position: relative; display: inline-block; width: 50px; height: 30px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* BOUSSOLE */
        #compassRing {
            width: 250px; height: 250px; border-radius: 50%; border: 4px solid var(--text);
            position: relative; display: flex; align-items: center; justify-content: center;
            margin: 40px auto; transition: transform 0.1s;
        }
        #compassArrow { font-size: 60px; color: var(--danger); transform-origin: center; }
        
    </style>
</head>
<body data-theme="light">

    <!-- OVERLAY CONNEXION -->
    <div id="loginScreen">
        <div class="login-card">
            <h1 style="margin-bottom: 20px;">CityCompass</h1>
            <input type="email" id="email" class="login-input" placeholder="Email" autocomplete="username">
            <input type="password" id="password" class="login-input" placeholder="Mot de passe" autocomplete="current-password">
            
            <button class="login-btn" onclick="handleLogin()">Connexion</button>
            <button class="login-btn" style="background:transparent; color:var(--text); border:1px solid rgba(128,128,128,0.3);" onclick="handleSignup()">Créer un compte</button>
            
            <p onclick="handleForgot()" style="margin-top:20px; color:var(--accent); font-size:14px; cursor:pointer;">Mot de passe oublié ?</p>
            <p id="msg" style="color:var(--danger); font-size:13px; min-height:20px; margin-top:10px;"></p>
        </div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>

    <!-- UI FLOTTANTE -->
    <div class="hud-layer" id="hud" style="display:none;">
        <div class="hud-top hud-group">
            <div class="glass-btn" onclick="openPanel('panelProfile')"><i class="fa-solid fa-user"></i></div>
            <div class="hud-group">
                <div class="glass-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></div>
                <div class="glass-btn" onclick="openPanel('panelShop')"><i class="fa-solid fa-bag-shopping"></i></div>
            </div>
        </div>

        <div class="hud-bottom hud-group">
            <div class="glass-btn" onclick="openPanel('panelCompass')"><i class="fa-regular fa-compass"></i></div>
            <div class="glass-btn active" onclick="locateMe()"><i class="fa-solid fa-location-arrow"></i></div>
            <div class="glass-btn" onclick="openPanel('panelLayers')"><i class="fa-solid fa-layer-group"></i></div>
        </div>
    </div>

    <!-- PANNEAUX WIDGETS -->
    
    <!-- SHOP / WIDGETS -->
    <div id="panelShop" class="panel">
        <div class="panel-header">
            <span class="panel-title">Widgets</span>
            <button class="close-btn" onclick="closePanels()">&times;</button>
        </div>
        <!-- Liste des widgets activables -->
        <div class="widget-item">
            <span>📡 Trafic en temps réel</span>
            <label class="switch"><input type="checkbox" onchange="toggleLayer('traffic', this.checked)"><span class="slider"></span></label>
        </div>
        <div class="widget-item">
            <span>🚇 Transports (Métro/Bus)</span>
            <label class="switch"><input type="checkbox" onchange="toggleLayer('transit', this.checked)"><span class="slider"></span></label>
        </div>
        <div class="widget-item">
            <span>🚲 Pistes Cyclables</span>
            <label class="switch"><input type="checkbox" onchange="toggleLayer('bike', this.checked)"><span class="slider"></span></label>
        </div>
    </div>

    <!-- LAYERS -->
    <div id="panelLayers" class="panel">
        <div class="panel-header">
            <span class="panel-title">Fonds de carte</span>
            <button class="close-btn" onclick="closePanels()">&times;</button>
        </div>
        <div class="widget-item" onclick="setBaseMap('standard')"><span>🗺️ Standard (Plan)</span></div>
        <div class="widget-item" onclick="setBaseMap('sat')"><span>🛰️ Satellite</span></div>
        <div class="widget-item" onclick="setBaseMap('dark')"><span>🌑 Dark Mode</span></div>
    </div>

    <!-- BOUSSOLE -->
    <div id="panelCompass" class="panel">
        <div class="panel-header">
            <span class="panel-title">Navigation</span>
            <button class="close-btn" onclick="closePanels()">&times;</button>
        </div>
        <div id="compassRing">
            <i id="compassArrow" class="fa-solid fa-location-arrow"></i>
        </div>
        <div style="text-align:center; opacity:0.6;">Orientez votre téléphone</div>
    </div>

    <!-- PROFIL -->
    <div id="panelProfile" class="panel">
        <div class="panel-header">
            <span class="panel-title">Mon Compte</span>
            <button class="close-btn" onclick="closePanels()">&times;</button>
        </div>
        <p id="userEmail" style="text-align:center; margin-bottom:30px; font-size:18px;"></p>
        <button class="login-btn" style="background:var(--danger);" onclick="logout()">Se déconnecter</button>
    </div>

<script>
    // ---------------------------------------------------------
    // 1. CONFIGURATION (CORRIGÉE)
    // ---------------------------------------------------------
    const SB_URL = 'https://vjlfbcwnfwyrxstfvefq.supabase.co'; // URL Corrigée (plus de ..)
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqbGZiY3duZnd5cnhzdGZ2ZWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMDc2MjcsImV4cCI6MjA4NDc4MzYyN30.WTuWbxB-8isJOp2lNnq73njQmifDjxTNEWngMgKtmv4';
    
    // Variables Globales
    let map, userMarker, sb;
    let layers = {}; 
    let state = { theme: 'light', watchId: null };
    
    // Fonction utilitaire pour logs
    const msg = (txt) => document.getElementById('msg').innerText = txt;

    // ---------------------------------------------------------
    // 2. AUTHENTIFICATION (Fonctions Globales Sécurisées)
    // ---------------------------------------------------------

    window.handleLogin = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email || !password) return msg("Remplissez tout.");
        
        msg("Connexion...");
        try {
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if(error) throw error;
            initApp(data.user);
        } catch(e) {
            msg(e.message);
        }
    };

    window.handleSignup = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email || !password) return msg("Remplissez tout.");
        
        msg("Création...");
        try {
            const { data, error } = await sb.auth.signUp({ email, password });
            if(error) throw error;
            
            if(data.session) initApp(data.user);
            else msg("Compte créé ! Vérifiez vos emails.");
        } catch(e) {
            msg(e.message);
        }
    };

    window.handleForgot = async () => {
        const email = document.getElementById('email').value;
        if(!email) return msg("Mettez votre email d'abord.");
        
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        msg(error ? error.message : "Email envoyé !");
    };

    window.logout = async () => {
        await sb.auth.signOut();
        location.reload();
    };

    // ---------------------------------------------------------
    // 3. FONCTIONNALITES APP (Carte, UI, Widgets)
    // ---------------------------------------------------------

    function initApp(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('userEmail').innerText = user.email;
        
        // Initialiser la carte si pas encore fait
        if(!map) initMap();
    }

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([43.604, 1.444], 13);
        
        // Couche de base (Standard)
        layers.base = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap', maxZoom: 19
        }).addTo(map);

        locateMe();
        
        // Gestion de la boussole
        if(window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const alpha = e.webkitCompassHeading || Math.abs(e.alpha - 360);
                document.getElementById('compassArrow').style.transform = `rotate(${-alpha}deg)`;
            });
        }
    }

    // Actions UI
    window.openPanel = (id) => {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
        document.getElementById(id).classList.add('open');
    };

    window.closePanels = () => {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
    };

    window.locateMe = () => {
        if(!map) return;
        map.locate({setView: true, maxZoom: 16, watch: true});
        map.on('locationfound', e => {
            if(!userMarker) {
                userMarker = L.circleMarker(e.latlng, {
                    color: '#007AFF', fillColor: '#007AFF', fillOpacity: 1, radius: 8
                }).addTo(map);
                L.circle(e.latlng, { radius: e.accuracy/2, color: '#007AFF', opacity: 0.1 }).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
            }
        });
    };

    window.toggleTheme = () => {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', state.theme);
        
        // Changer la carte
        const url = state.theme === 'dark' 
            ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
            : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
        layers.base.setUrl(url);
    };

    window.toggleLayer = (type, isActive) => {
        if(isActive) alert("Layer " + type + " activé (Simulation)");
    };

    window.setBaseMap = (type) => {
        let url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
        if(type === 'dark') url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        if(type === 'sat') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        
        layers.base.setUrl(url);
        closePanels();
    };

    // ---------------------------------------------------------
    // 4. DEMARRAGE (OnLoad)
    // ---------------------------------------------------------
    window.onload = async () => {
        try {
            sb = supabase.createClient(SB_URL, SB_KEY);
            const { data: { session } } = await sb.auth.getSession();
            
            if(session) {
                initApp(session.user);
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        } catch(e) {
            msg("Erreur init: " + e.message);
        }
    };

</script>
</body>
</html>
