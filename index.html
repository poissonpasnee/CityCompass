<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CityCompass v23 - Solid Connect</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Assurez-vous d'avoir config.js -->
  <script src="config.js"></script>

  <style>
    :root { --primary: #00f2ff; --bg: #050505; --text: #fff; --danger: #ff4757; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* UI LOGIN */
    #loginScreen { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.4s; }
    .hidden { display: none !important; }
    
    .login-box { width: 100%; max-width: 320px; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
    input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px; outline: none; text-align: center; }
    .btn-main { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 10px; font-size: 16px; margin-top: 5px; cursor: pointer; }
    .btn-link { background: transparent; color: #888; border: none; text-decoration: underline; font-size: 13px; cursor: pointer; }

    /* TOAST */
    #toast { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--primary); z-index: 10000; display: none; }
    
    /* APP */
    #app { display: none; width: 100%; height: 100%; position: relative; }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    /* PANELS */
    .panel { position: fixed; inset: 0; background: #000; z-index: 2000; transform: translateY(100%); transition: transform 0.3s; padding: 20px; display: flex; flex-direction: column; }
    .panel.open { transform: translateY(0); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 24px; font-weight: bold; }
    
    /* NAV */
    .nav-bar { position: absolute; bottom: 30px; left: 20px; right: 20px; height: 60px; background: rgba(20,20,20,0.95); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border: 1px solid #333; }
    .nav-icon { font-size: 24px; color: #666; padding: 10px; }
  </style>
</head>
<body>

<div id="toast">Info</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <i class="fa-regular fa-compass" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
    
    <!-- 1. LOGIN -->
    <div id="viewLogin" class="login-box">
        <h2 style="margin:0; text-align:center;">CONNEXION v23</h2>
        <input type="text" id="inpLoginId" placeholder="ID (16 chiffres)" inputmode="numeric" oninput="formatInput(this)">
        <input type="password" id="inpLoginPass" placeholder="Mot de Passe">
        <button class="btn-main" onclick="app.login()">ENTRER</button>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <button class="btn-link" onclick="app.show('viewSignup')">Créer Compte</button>
            <button class="btn-link" onclick="app.show('viewForgot')">Oublié ?</button>
        </div>
    </div>

    <!-- 2. SIGNUP -->
    <div id="viewSignup" class="login-box hidden">
        <h2 style="margin:0; text-align:center;">NOUVEAU COMPTE</h2>
        <input type="password" id="inpSignPass" placeholder="Mot de Passe">
        <select id="inpSignQ">
            <option value="animal">Nom de mon animal ?</option>
            <option value="ville">Ville de naissance ?</option>
        </select>
        <input type="text" id="inpSignA" placeholder="Réponse secrète">
        <button class="btn-main" onclick="app.signup()">CRÉER ID</button>
        <button class="btn-link" onclick="app.show('viewLogin')">Retour</button>
    </div>

    <!-- 3. RECOVERY -->
    <div id="viewForgot" class="login-box hidden">
        <h2 style="margin:0; text-align:center; color:var(--danger)">RÉCUPÉRATION</h2>
        <input type="text" id="inpForgotId" placeholder="Votre ID" inputmode="numeric" oninput="formatInput(this)">
        <button class="btn-main" onclick="app.checkRecovery()">SUIVANT</button>
        <button class="btn-link" onclick="app.show('viewLogin')">Retour</button>
    </div>
    
    <!-- 4. SECURITY CHECK -->
    <div id="viewSecurity" class="login-box hidden">
        <h2 style="margin:0; text-align:center; color:var(--danger)">SÉCURITÉ</h2>
        <p id="txtSecLabel" style="text-align:center; color:var(--primary)">?</p>
        <input type="text" id="inpSecAns" placeholder="Votre Réponse">
        <button class="btn-main" onclick="app.verifyRecovery()">VÉRIFIER</button>
        <button class="btn-link" onclick="app.show('viewLogin')">Annuler</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="app">
    <div id="map"></div>
    <div class="nav-bar">
        <i class="fa-solid fa-map nav-icon" onclick="app.closePanels()"></i>
        <i class="fa-solid fa-cart-shopping nav-icon" onclick="app.openPanel('panelShop')"></i>
        <i class="fa-solid fa-user nav-icon" onclick="app.openPanel('panelProfile')"></i>
    </div>
</div>

<!-- PANELS -->
<div id="panelProfile" class="panel">
    <div class="panel-head">Profil <i class="fa-solid fa-xmark" onclick="app.closePanels()"></i></div>
    <p>ID: <span id="txtProfileId" style="color:var(--primary); font-family:monospace;">-</span></p>
    <p>Points: <span id="txtPoints">0</span></p>
    <button class="btn-main" style="background:#333; color:#fff; margin-top:auto;" onclick="app.logout()">DÉCONNEXION</button>
</div>

<div id="panelShop" class="panel">
    <div class="panel-head">Boutique <i class="fa-solid fa-xmark" onclick="app.closePanels()"></i></div>
    <p>Items à venir...</p>
</div>

<script>
// FORMATTER GLOBAL
window.formatInput = function(e) {
    e.value = e.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ').trim();
};

// APP LOGIC
(function() {
    // 1. INIT SUPABASE
    if(typeof CONFIG === 'undefined') { alert("Config manquante !"); return; }
    const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    let currentUser = null;
    let recoveryId = null;

    // 2. TOAST SYSTEM
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // 3. EXPORT GLOBAL FUNCTIONS (Pour les onclick HTML)
    window.app = {
        show: function(viewId) {
            ['viewLogin','viewSignup','viewForgot','viewSecurity'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        },

        // --- AUTH ---
        signup: async function() {
            const pass = document.getElementById('inpSignPass').value;
            const q = document.getElementById('inpSignQ').value;
            const a = document.getElementById('inpSignA').value.toLowerCase().trim();
            if(!pass || !a) return toast("Remplissez tout !");

            const newId = Array.from({length:16}, ()=>Math.floor(Math.random()*10)).join('');
            const { error } = await sb.from('users').insert([{ id:newId, password:pass, secret_q:q, secret_a:a, points:50 }]);

            if(error) return toast("Erreur: " + error.message);
            
            alert(`COMPTE CRÉÉ !\nVOTRE ID: ${newId.replace(/(\d{4})(?=\d)/g,'$1 ')}\nNotez-le bien !`);
            document.getElementById('inpLoginId').value = window.formatInput({value:newId}); // Fake format
            app.show('viewLogin');
        },

        login: async function() {
            const id = document.getElementById('inpLoginId').value.replace(/\s/g,'');
            const pass = document.getElementById('inpLoginPass').value;
            if(!id || !pass) return toast("Infos manquantes");

            const { data, error } = await sb.from('users').select('*').eq('id', id).eq('password', pass).single();
            if(error || !data) return toast("Erreur ID ou Mot de Passe");

            currentUser = data;
            localStorage.setItem('cc_sess', id);
            app.launch();
        },

        logout: function() {
            localStorage.removeItem('cc_sess');
            location.reload();
        },

        // --- RECOVERY ---
        checkRecovery: async function() {
            const id = document.getElementById('inpForgotId').value.replace(/\s/g,'');
            if(id.length !== 16) return toast("ID incorrect");
            
            const { data } = await sb.from('users').select('secret_q').eq('id', id).single();
            if(!data || !data.secret_q) return toast("Compte introuvable");

            recoveryId = id;
            document.getElementById('txtSecLabel').innerText = (data.secret_q === 'animal' ? "Nom animal ?" : "Ville naissance ?");
            app.show('viewSecurity');
        },

        verifyRecovery: async function() {
            const ans = document.getElementById('inpSecAns').value.toLowerCase().trim();
            const { data } = await sb.from('users').select('secret_a').eq('id', recoveryId).single();

            if(!data || data.secret_a !== ans) return toast("Mauvaise réponse !");

            const tmp = "TMP-" + Math.floor(Math.random()*10000);
            await sb.from('users').update({password:tmp}).eq('id', recoveryId);
            
            alert("VOTRE MOT DE PASSE PROVISOIRE :\n\n" + tmp);
            app.show('viewLogin');
        },

        // --- APP UI ---
        launch: function() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            app.initMap();
            document.getElementById('txtProfileId').innerText = currentUser.id;
            document.getElementById('txtPoints').innerText = currentUser.points;
        },

        openPanel: function(id) { document.getElementById(id).classList.add('open'); },
        closePanels: function() { document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')); },

        initMap: function() {
            if(window.mapInit) return;
            const map = L.map('map', {zoomControl:false}).setView([43.6047, 1.4442], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            window.mapInit = true;
        }
    };

    // AUTO LOGIN
    const saved = localStorage.getItem('cc_sess');
    if(saved) {
        sb.from('users').select('*').eq('id', saved).single().then(({data})=>{
            if(data) { currentUser=data; app.launch(); }
        });
    }

})();
</script>
</body>
</html>
