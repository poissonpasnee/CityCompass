<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CityCompass v38</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #f2f2f7; --card: rgba(255,255,255,0.95);
      --text: #000; --muted: #8e8e93; --border: rgba(0,0,0,0.1);
      --accent: #007aff; --danger: #ff3b30; --success: #34c759;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --blur: blur(20px);
    }
    [data-theme="dark"] {
      --bg: #000; --card: rgba(28,28,30,0.95);
      --text: #fff; --muted: #98989f; --border: rgba(255,255,255,0.15);
      --accent: #0a84ff; --danger: #ff453a; --success: #30d158;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* --- LOGIN OVERLAY --- */
    #authOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; transition: opacity 0.4s ease;
    }
    #authOverlay.hidden { opacity: 0; pointer-events: none; }
    .auth-box { width: 100%; max-width: 320px; text-align: center; }
    .auth-title { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .auth-input {
      width: 100%; padding: 14px; margin: 8px 0;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 16px; outline:none;
    }
    .btn-auth {
      width: 100%; padding: 14px; margin-top: 10px;
      border-radius: 12px; background: var(--accent); color: white;
      font-weight: 700; border: none; font-size: 16px; cursor: pointer;
    }

    /* --- VUES --- */
    .view { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
    .view.active { display: flex; }
    
    /* Carte */
    #map { width: 100%; height: 100%; z-index: 1; }
    
    /* Search Bar + Suggestions */
    .search-wrap {
      position: absolute; top: 50px; left: 16px; right: 16px; z-index: 1000;
    }
    .search-bar {
      display: flex; gap: 8px;
    }
    .input-glass {
      flex: 1; height: 48px; padding: 0 16px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      box-shadow: var(--shadow); font-size: 16px; outline: none;
    }
    .btn-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); color: var(--accent); cursor: pointer;
    }
    /* Liste Prédictive */
    .suggestions-list {
      margin-top: 6px;
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-height: 200px; overflow-y: auto;
      display: none; /* Caché par défaut */
    }
    .suggestion-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-size: 14px; cursor: pointer;
    }
    .suggestion-item:last-child { border-bottom: none; }

    /* Boussole */
    .compass-wrapper {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .compass-ring {
      width: 260px; height: 260px;
      border: 4px solid var(--border); border-radius: 50%;
      position: relative; display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s linear; margin-bottom: 30px;
    }
    .compass-arrow {
      width: 0; height: 0;
      border-left: 20px solid transparent; border-right: 20px solid transparent;
      border-bottom: 90px solid var(--danger); transform: translateY(-10px);
    }
    .compass-val { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .btn-main {
      margin-top: 30px; padding: 14px 28px; border-radius: 30px;
      border: 1px solid var(--accent); background: var(--card); color: var(--accent);
      font-weight: 700; transition: 0.2s;
    }
    .btn-main.active { background: var(--success); border-color: var(--success); color: #fff; }

    /* Nav Bar */
    .tab-bar {
      height: 85px; background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding-bottom: 20px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 2000;
    }
    .tab-btn {
      background: none; border: none; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); font-size: 10px; font-weight: 600;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

    /* Autres */
    .view-content { padding: 20px; overflow-y: auto; height: 100%; padding-bottom: 100px; }
    .list-group { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    .list-item { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shop-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="authOverlay">
    <div class="auth-box">
      <div class="auth-title">CityCompass</div>
      <p style="color:var(--muted); margin-bottom:20px;">Connexion Sécurisée</p>
      <input type="email" id="loginEmail" class="auth-input" placeholder="Email" value="user@demo.com">
      <input type="password" id="loginPass" class="auth-input" placeholder="Mot de passe" value="123456">
      <button class="btn-auth" onclick="tryLogin()">Se Connecter</button>
      <p style="margin-top:15px; font-size:12px; color:var(--muted);">Pas de compte ? Cliquez pour créer (Auto).</p>
    </div>
  </div>

  <!-- APP CONTENT -->
  <div id="app" style="display:none; height:100%; flex-direction:column;">
    
    <!-- 1. MAP -->
    <div id="viewMap" class="view active">
      <div class="search-wrap">
        <div class="search-bar">
          <input type="text" id="searchInput" class="input-glass" placeholder="Rechercher une adresse..." autocomplete="off">
          <div class="btn-icon" onclick="locateUser()">📍</div>
        </div>
        <div id="suggestions" class="suggestions-list"></div>
      </div>
      <div id="map"></div>
    </div>

    <!-- 2. COMPASS -->
    <div id="viewCompass" class="view">
      <div class="compass-wrapper">
        <div class="compass-ring" id="ring"><div class="compass-arrow"></div></div>
        <div class="compass-val" id="headVal">---°</div>
        <div style="color:var(--muted); margin-top:-5px;" id="headDir">En attente</div>
        <button id="btnCompass" class="btn-main">Activer</button>
      </div>
    </div>

    <!-- 3. SHOP -->
    <div id="viewShop" class="view">
      <div class="view-content">
        <h2>Boutique</h2>
        <div class="list-group">
          <div class="list-item">
            <span>Points</span>
            <span style="font-weight:800; color:var(--accent);" id="userPoints">0</span>
          </div>
        </div>
        <h3>Extensions</h3>
        <div class="shop-grid" id="shopGrid"></div>
      </div>
    </div>

    <!-- 4. PROFILE -->
    <div id="viewProfile" class="view">
      <div class="view-content">
        <h2>Profil</h2>
        <div class="list-group">
          <div class="list-item">
            <span>Mode Nuit</span>
            <input type="checkbox" id="themeToggle">
          </div>
          <div class="list-item">
            <span>Son Activé</span>
            <input type="checkbox" id="soundToggle" checked>
          </div>
        </div>
        <div class="list-group">
          <div class="list-item" onclick="logout()" style="color:var(--danger); font-weight:700;">
            Déconnexion
          </div>
        </div>
      </div>
    </div>

    <!-- TAB BAR -->
    <nav class="tab-bar">
      <button class="tab-btn active" onclick="goTab('viewMap', this)"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>Carte</button>
      <button class="tab-btn" onclick="goTab('viewCompass', this)"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>Boussole</button>
      <button class="tab-btn" onclick="goTab('viewShop', this)"><svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>Shop</button>
      <button class="tab-btn" onclick="goTab('viewProfile', this)"><svg viewBox="0 0 24 24"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>Profil</button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* --- CONFIG & STATE --- */
    const WIDGETS = [
      { id:'w_nv', name:'Vision Nuit', price:150, icon:'🌑' },
      { id:'w_sn', name:'Sonar', price:300, icon:'📡' },
      { id:'w_tr', name:'Traceur', price:200, icon:'👣' },
      { id:'w_st', name:'Satellite', price:500, icon:'🛰️' },
      { id:'w_gd', name:'God Mode', price:9999, icon:'⚡', admin:true }
    ];
    let state = {
      user: localStorage.getItem('cc_user'),
      theme: localStorage.getItem('cc_theme') || 'light',
      points: parseInt(localStorage.getItem('cc_points') || '1250'),
      owned: JSON.parse(localStorage.getItem('cc_owned') || '[]'),
      sound: localStorage.getItem('cc_sound') !== 'false'
    };

    /* --- LOGIN SYSTEM --- */
    function checkAuth() {
      if(state.user) {
        document.getElementById('authOverlay').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        initApp();
      }
    }
    function tryLogin() {
      const email = document.getElementById('loginEmail').value;
      if(email.length > 3) {
        localStorage.setItem('cc_user', email);
        state.user = email;
        checkAuth();
      } else { alert('Email invalide'); }
    }
    function logout() {
      localStorage.removeItem('cc_user');
      location.reload();
    }
    window.onload = checkAuth;

    /* --- MAP SYSTEM --- */
    let map, userMarker;
    function initApp() {
      applyTheme(state.theme);
      
      // MAP INIT
      map = L.map('map', {zoomControl:false}).setView([43.604, 1.444], 13);
      L.tileLayer(getTileUrl(), {maxZoom:19}).addTo(map);
      
      // AUTO LOCATE
      locateUser();

      // SEARCH LISTENER
      document.getElementById('searchInput').addEventListener('input', handleSearch);
      
      // Render Shop & Profile
      renderShop();
      document.getElementById('themeToggle').checked = (state.theme==='dark');
    }

    function getTileUrl() {
      return state.theme==='dark' 
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
    }

    function locateUser() {
      map.locate({setView:true, maxZoom:16, enableHighAccuracy:true});
      map.on('locationfound', e => {
        if(userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, {
          radius:8, color:'#fff', fillColor:'#007aff', fillOpacity:1
        }).addTo(map).bindPopup("Vous êtes ici").openPopup();
      });
      map.on('locationerror', () => alert("Localisation impossible (autorisez le GPS)."));
    }

    /* --- PREDICTIVE SEARCH (Nominatim) --- */
    let searchTimeout;
    function handleSearch(e) {
      clearTimeout(searchTimeout);
      const q = e.target.value;
      const list = document.getElementById('suggestions');
      
      if(q.length < 3) { list.style.display='none'; return; }

      searchTimeout = setTimeout(async () => {
        try {
          // Appel API OpenStreetMap (Nominatim)
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`);
          const data = await res.json();
          
          list.innerHTML = '';
          if(data.length > 0) {
            list.style.display = 'block';
            data.forEach(place => {
              const item = document.createElement('div');
              item.className = 'suggestion-item';
              item.textContent = place.display_name.split(',').slice(0,3).join(','); // Shorten text
              item.onclick = () => {
                const lat = parseFloat(place.lat);
                const lon = parseFloat(place.lon);
                map.setView([lat, lon], 16);
                L.marker([lat, lon]).addTo(map).bindPopup(item.textContent).openPopup();
                list.style.display = 'none';
                document.getElementById('searchInput').value = item.textContent;
              };
              list.appendChild(item);
            });
          }
        } catch(err) { console.error(err); }
      }, 300); // 300ms debounce
    }

    /* --- COMPASS --- */
    let compassActive = false;
    document.getElementById('btnCompass').addEventListener('click', async () => {
      const btn = document.getElementById('btnCompass');
      if(!compassActive) {
        // Sound
        if(state.sound) {
          const ctx = new (window.AudioContext||window.webkitAudioContext)();
          const osc = ctx.createOscillator(); osc.frequency.value=880;
          osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.1);
        }
        // Permission
        if(typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission();
        }
        window.addEventListener('deviceorientation', updateCompass, true);
        compassActive = true;
        btn.classList.add('active'); btn.textContent = "Activé";
      } else {
        window.removeEventListener('deviceorientation', updateCompass, true);
        compassActive = false;
        btn.classList.remove('active'); btn.textContent = "Activer";
        document.getElementById('ring').style.transform = 'rotate(0deg)';
      }
    });

    function updateCompass(e) {
      let h = e.webkitCompassHeading || Math.abs(e.alpha-360);
      if(h) {
        document.getElementById('ring').style.transform = `rotate(${-h}deg)`;
        document.getElementById('headVal').textContent = Math.round(h)+'°';
        document.getElementById('headDir').textContent = ['N','NE','E','SE','S','SO','O','NO'][Math.round(h/45)%8];
      }
    }

    /* --- UI & THEME --- */
    function goTab(id, btn) {
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      if(id==='viewMap' && map) setTimeout(()=>map.invalidateSize(), 100);
    }

    document.getElementById('themeToggle').addEventListener('change', e => {
      state.theme = e.target.checked ? 'dark' : 'light';
      localStorage.setItem('cc_theme', state.theme);
      applyTheme(state.theme);
      // Reload tiles
      map.eachLayer(l => l._url && map.removeLayer(l));
      L.tileLayer(getTileUrl(), {maxZoom:19}).addTo(map);
    });

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
    }

    function renderShop() {
      document.getElementById('userPoints').textContent = state.points;
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      WIDGETS.forEach(w => {
        const owned = state.owned.includes(w.id);
        const div = document.createElement('div');
        div.className = 'shop-card';
        div.innerHTML = `
          <div style="font-size:30px">${w.icon}</div>
          <div style="font-weight:700; margin:5px 0;">${w.name}</div>
          <div style="color:var(--accent); font-weight:800; font-size:14px;">${owned ? 'ACQUIS' : w.price+' pts'}</div>
        `;
        div.onclick = () => {
          if(!owned && state.points >= w.price) {
            state.points -= w.price;
            state.owned.push(w.id);
            localStorage.setItem('cc_points', state.points);
            localStorage.setItem('cc_owned', JSON.stringify(state.owned));
            renderShop();
          }
        };
        grid.appendChild(div);
      });
    }
  </script>
</body>
</html>
