<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>CityCompass V56</title>

    <!-- LEAFLET -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- STYLE GLOBAL INTÉGRÉ (V56) -->
    <style>
        :root {
            --bg-body: #F2F2F7; --bg-card: #FFFFFF; --bg-glass: rgba(255, 255, 255, 0.90);
            --bg-input: rgba(118, 118, 128, 0.12);
            --text-primary: #000000; --text-secondary: #8E8E93;
            --separator: rgba(60, 60, 67, 0.12);
            --accent: #007AFF; --accent-rgb: 0, 122, 255;
            --gold: #FFD700; --danger: #FF3B30; --success: #34C759;
            --radius-l: 24px; --nav-height: 85px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
            --shadow-float: 0 12px 24px rgba(0,0,0,0.12);
        }
        [data-theme="dark"] {
            --bg-body: #000000; --bg-card: #1C1C1E; --bg-glass: rgba(30, 30, 30, 0.90);
            --bg-input: rgba(118, 118, 128, 0.24);
            --text-primary: #FFFFFF; --text-secondary: #98989D;
            --separator: rgba(84, 84, 88, 0.4);
            --accent: #0A84FF; --accent-rgb: 10, 132, 255;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; font-family: -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-primary); transition: background 0.3s; font-size: 17px; }
        .app { display: flex; flex-direction: column; height: 100%; position: relative; }

        /* VUES */
        .view { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav-height); overflow: hidden; opacity: 0; transition: opacity 0.3s; z-index: 0; pointer-events: none; }
        .view.active { display: block; opacity: 1; z-index: 10; pointer-events: auto; }
        #viewLogin { bottom: 0; z-index: 3000; background: var(--bg-body); }
        #viewLogin.active { display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        #viewDiscover { padding: 0 !important; }
        #viewCam { background: black; z-index: 2500; }
        .scroll-container { height: 100%; overflow-y: auto; padding: max(20px, var(--safe-top)) 20px 40px 20px; }

        /* UI ELEMENTS */
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 700; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-float); }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--separator); }
        
        .login-input { background: var(--bg-card); border: 1px solid var(--separator); border-radius: 16px; padding: 20px; font-size: 18px; text-align: center; width: 100%; color: var(--text-primary); margin-bottom: 16px; }

        /* MAP UI */
        #map { width: 100%; height: 100%; z-index: 1; background: var(--bg-input); }
        .map-controls-right { position: absolute; right: 16px; bottom: 40%; transform: translateY(50%); display: flex; flex-direction: column; gap: 16px; z-index: 900; pointer-events: auto; }
        .map-fab { width: 50px; height: 50px; background: var(--bg-glass); backdrop-filter: blur(15px); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: var(--shadow-float); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .floating-search { position: absolute; top: max(20px, var(--safe-top)); left: 16px; right: 16px; background: var(--bg-glass); backdrop-filter: blur(20px); border-radius: var(--radius-l); padding: 10px; z-index: 1000; box-shadow: var(--shadow-float); }
        .search-input-box { display: flex; align-items: center; background: var(--bg-input); border-radius: 14px; padding: 0 12px; height: 44px; }
        .search-input-box input { border: none; background: transparent; height: 100%; width: 100%; font-size: 17px; color: var(--text-primary); }
        
        .map-sheet { position: absolute; bottom: 20px; left: 16px; right: 16px; background: var(--bg-glass); backdrop-filter: blur(30px); border-radius: var(--radius-l); padding: 24px; z-index: 1000; box-shadow: var(--shadow-float); transform: translateY(120%); transition: transform 0.4s; display: flex; flex-direction: column; gap: 12px; }
        .map-sheet.active { transform: translateY(0); }

        /* SHOP & WIDGETS */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .shop-card { background: var(--bg-card); padding: 16px; border-radius: 18px; text-align: center; border: 1px solid var(--separator); cursor: pointer; }
        .shop-card.active-item { border: 2px solid var(--accent); }
        
        .profile-widgets-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .p-widget { background: var(--bg-card); padding: 12px; border-radius: 16px; text-align: center; border: 1px solid var(--separator); }
        .p-widget-val { font-size: 18px; font-weight: 800; color: var(--accent); }

        /* NAV BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: var(--bg-glass); backdrop-filter: blur(20px); border-top: 1px solid var(--separator); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 2000; }
        .nav-tab { background: none; border: none; color: var(--text-secondary); font-size: 10px; font-weight: 600; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; }
        .nav-tab.active { color: var(--accent); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* CAMERA */
        #videoFeed { width: 100%; height: 100%; object-fit: cover; }
        .cam-overlay { position: absolute; inset: 0; z-index: 2; padding: 40px 20px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .cam-overlay button { pointer-events: auto; }
    </style>
</head>

<body data-theme="light">
    <div class="app">
        
        <!-- 1. LOGIN -->
        <div class="view active" id="viewLogin">
            <div class="login-container">
                <h1 style="font-size:32px; font-weight:800; text-align:center;">City Compass</h1>
                <p style="text-align:center; opacity:0.6; margin-bottom:40px;">Exploration Urbaine V56</p>
                
                <input id="emailInput" placeholder="Email" class="login-input" />
                <input id="pwdInput" type="password" placeholder="Mot de passe" class="login-input" />
                
                <button class="btn btn-primary" onclick="Auth.login()">Connexion</button>
                <button class="btn btn-secondary" onclick="Auth.signup()" style="margin-top:10px;">Créer Compte</button>
                <p id="msg" style="color:var(--danger); text-align:center; margin-top:15px;"></p>
            </div>
        </div>

        <!-- 2. MAP (DISCOVER) -->
        <div class="view" id="viewDiscover">
            <div class="floating-search">
                <div class="search-input-box">
                    <span>🔍</span>
                    <input id="addrInput" placeholder="Rechercher..." onkeyup="MapManager.search(this.value)" />
                </div>
                <div id="searchResults" style="display:none; background:var(--bg-card); border-radius:12px; margin-top:4px;"></div>
            </div>
            <div id="map"></div>
            
            <div class="map-controls-right">
                <div class="map-fab" onclick="MapManager.center()">📍</div>
                <div class="map-fab" onclick="MapManager.toggleCam()">📷</div>
            </div>

            <div class="map-sheet" id="mapSheet">
                <div style="font-weight:700; font-size:22px;" id="sheetTitle">Lieu</div>
                <div style="font-size:14px; opacity:0.6;" id="sheetDesc">Description</div>
                <div style="display:flex; gap:12px; margin-top:12px;">
                    <button class="btn btn-primary" onclick="Nav.start()">🚀 Go</button>
                    <button class="btn btn-secondary" onclick="MapManager.closeSheet()">Fermer</button>
                </div>
            </div>
        </div>

        <!-- 3. CAMERA -->
        <div class="view" id="viewCam">
            <video id="videoFeed" autoplay playsinline muted></video>
            <div class="cam-overlay">
                <div style="color:white; font-family:monospace;">SYSTEM ONLINE</div>
                <button class="btn btn-secondary" style="background:rgba(0,0,0,0.5); color:white;" onclick="MapManager.toggleCam()">Fermer</button>
            </div>
        </div>

        <!-- 4. ACCOUNT & SHOP -->
        <div class="view" id="viewAccount">
            <div class="scroll-container">
                <div style="background:var(--accent); padding:24px; border-radius:24px; color:white; text-align:center; box-shadow:0 10px 30px -10px var(--accent); margin-bottom:20px;">
                    <div style="font-size:12px; font-weight:700; opacity:0.8;">XP DISPONIBLE</div>
                    <div style="font-size:42px; font-weight:800;" id="displayPoints">0</div>
                    <div id="profileEmail" style="opacity:0.8; margin-top:5px;">...</div>
                </div>

                <div class="profile-widgets-row">
                    <div class="p-widget"><div class="p-widget-val">1</div><div>Niveau</div></div>
                    <div class="p-widget"><div class="p-widget-val">💎</div><div>Premium</div></div>
                </div>

                <div style="font-weight:700; opacity:0.6; font-size:12px; margin-bottom:10px;">BOUTIQUE</div>
                <div class="shop-grid" id="shopGrid"></div>

                <button class="btn" style="background:var(--bg-input); color:var(--danger); margin-top:30px;" onclick="Auth.logout()">Déconnexion</button>
            </div>
        </div>

        <!-- NAV BAR -->
        <div class="bottom-nav" id="navBar" style="display:none;">
            <button class="nav-tab active" onclick="UI.show('viewDiscover')"><span class="nav-icon">🗺️</span>Carte</button>
            <button class="nav-tab" onclick="UI.show('viewAccount')"><span class="nav-icon">👤</span>Profil</button>
        </div>

    </div>

    <!-- SCRIPT LOADER -->
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mapManager.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
