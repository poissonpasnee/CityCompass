<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityCompass Explorer</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet CSS (Carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- FontAwesome (Icônes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- VUE : CARTE -->
    <div id="view-map" class="view active">
        <div id="map" style="width:100%; height:100%; border-radius:12px;"></div>
        <!-- Bouton recentrer -->
        <button onclick="MapManager.locate()" style="position:absolute; bottom:100px; right:20px; z-index:999; padding:10px; border-radius:50%; background:white; border:none; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
            <i class="fas fa-crosshairs text-primary"></i>
        </button>
    </div>

    <!-- VUE : BOUSSOLE (Avec Widgets) -->
    <div id="view-compass" class="view">
        <h2 style="text-align:center;">Navigation</h2>
        
        <!-- La Boussole -->
        <div class="compass-container">
            <div id="compass-card"></div>
            <div id="compass-needle"></div>
        </div>
        
        <!-- Stats Rapides -->
        <div class="compass-stats">
            <span id="val-heading">0°</span> | <span id="val-speed">0 km/h</span>
        </div>

        <hr style="border-color:#333; margin:20px 0;">

        <!-- Grille de Widgets (Météo, Altitude, etc.) -->
        <h3 style="margin-left:10px;">Tableau de bord</h3>
        <div id="widgets-grid">
            <!-- Rempli automatiquement par widgets.js -->
        </div>
    </div>

    <!-- VUE : PROFIL & ADMIN -->
    <div id="view-profile" class="view">
        <h2>Mon Profil</h2>
        <div class="widget-card" style="margin-bottom:20px;">
            <div class="widget-icon">👤</div>
            <div class="widget-val" id="profile-email">Chargement...</div>
            <div class="widget-name" id="profile-points">0 Points</div>
        </div>

        <!-- Section Admin (Visible uniquement si admin) -->
        <div id="admin-panel">
            <div class="admin-header">Panneau Administrateur 👑</div>
            <button class="admin-btn mod" onclick="Admin.broadcastMessage()" style="width:100%; margin-bottom:10px;">📢 Envoyer Message Global</button>
            <button class="admin-btn mod" onclick="Admin.addRecommendation()" style="width:100%; margin-bottom:10px;">⭐ Ajouter Recommandation</button>
            
            <div id="admin-user-list">
                <!-- Liste utilisateurs chargée par admin.js -->
            </div>
        </div>
        
        <button onclick="App.logout()" style="width:100%; padding:15px; background:#333; color:white; border:none; border-radius:12px; margin-top:20px;">Déconnexion</button>
    </div>

    <!-- BARRE DE NAVIGATION -->
    <div class="navbar">
        <button class="nav-item active" onclick="App.showView('view-map', this)">
            <i class="fas fa-map-marked-alt"></i> Carte
        </button>
        <button class="nav-item" onclick="App.showView('view-compass', this)">
            <i class="fas fa-compass"></i> Boussole
        </button>
        <button class="nav-item" onclick="App.showView('view-profile', this)">
            <i class="fas fa-user-astronaut"></i> Profil
        </button>
    </div>

    <!-- SCRIPTS -->
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- TES FICHIERS (Assure-toi de les avoir créés) -->
    <script src="js/config.js"></script>     <!-- Ta config Supabase -->
    <script src="js/auth.js"></script>       <!-- Gestion Auth -->
    <script src="js/widgets.js"></script>    <!-- Gestion Widgets (Nouveau) -->
    <script src="js/compass.js"></script>    <!-- Gestion Boussole (Nouveau) -->
    <script src="js/admin.js"></script>      <!-- Gestion Admin (Nouveau) -->
    <script src="js/mapManager.js"></script> <!-- Ta carte -->
    
    <!-- Script Principal (App.js) -->
    <script>
        // js/app.js intégré pour simplicité ou à mettre dans un fichier à part
        const App = {
            init: async () => {
                // Initialise Supabase via config.js (vérifie que window.supabaseClient existe)
                // Initialise les modules
                Widgets.init();
                Compass.init();
                
                // Vérifie connexion
                const {  { session } } = await AppState.supabase.auth.getSession();
                if(session) {
                    AppState.user = session.user;
                    // Vérifier si Admin
                    const {  profile } = await AppState.supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();
                        
                    if(profile) {
                        AppState.user.is_admin = profile.is_admin;
                        document.getElementById('profile-email').innerText = session.user.email;
                        document.getElementById('profile-points').innerText = (profile.points || 0) + " Points";
                        
                        // Si Admin, charger le panel
                        if(profile.is_admin) Admin.init();
                        else document.getElementById('admin-panel').style.display = 'none';
                    }
                }
            },

            showView: (viewId, btn) => {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                if(btn) btn.classList.add('active');

                // Si on va sur la carte, on force le redimensionnement pour éviter les bugs gris
                if(viewId === 'view-map' && window.map) window.map.invalidateSize();
            },

            logout: async () => {
                await AppState.supabase.auth.signOut();
                window.location.reload();
            }
        };

        window.onload = App.init;
    </script>
</body>
</html>
