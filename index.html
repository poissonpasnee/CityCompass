<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CityCompass Navigator</title>
    
    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* --- UI GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* --- MAP FIX --- */
        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #1a1a1a;
        }
        /* Cache les contrôles par défaut */
        .leaflet-control-zoom, .leaflet-control-attribution { display: none; }

        /* --- NAVIGATION BAR (BOTTOM) --- */
        .nav-bar {
            position: fixed;
            bottom: 25px;
            left: 20px;
            right: 20px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            border-radius: 25px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            gap: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: #0A84FF; text-shadow: 0 0 15px rgba(10, 132, 255, 0.5); }
        
        /* Bouton Central (Boussole) */
        .nav-item-center {
            position: relative;
            top: -20px;
            background: #0A84FF;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 25px rgba(10, 132, 255, 0.4);
            border: 5px solid #000; /* Fusion visuelle avec le fond */
            font-size: 28px;
            transition: transform 0.2s;
        }
        .nav-item-center:active { transform: scale(0.95); }

        /* --- PAGES --- */
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; /* Caché par défaut */
            flex-direction: column;
            z-index: 10;
        }
        .page.active { display: flex; z-index: 20; }
        /* La carte a un z-index spécial pour rester en fond si besoin, 
           mais ici on la gère comme une page */
        #page-map { z-index: 1; } 

        /* --- PAGE: CARTE --- */
        .top-bar-container {
            position: absolute;
            top: 50px; left: 20px; right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            pointer-events: none; /* Permet de cliquer à travers les zones vides */
        }
        .search-container {
            flex: 1;
            pointer-events: auto;
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 50px;
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0 50px 0 20px;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            outline: none;
        }
        .search-icon {
            position: absolute;
            right: 15px; top: 15px;
            color: #aaa;
        }

        /* BOUTON PROFIL (Nouveau) */
        .profile-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .profile-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Suggestions */
        .suggestions-box {
            position: absolute;
            top: 60px; left: 0; right: 0;
            background: rgba(30,30,30, 0.95);
            border-radius: 15px;
            overflow: hidden;
            display: none;
            z-index: 2000;
        }
        .suggestion-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
            color: #eee;
        }
        .suggestion-item:active { background: rgba(255,255,255,0.1); }

        /* --- PAGE: BOUSSOLE --- */
        .compass-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000; /* Fond noir uni pour contraste */
        }
        .compass-ring {
            width: 280px; height: 280px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        /* SVG Cercle Dynamique */
        .progress-ring {
            position: absolute;
            top: -10px; left: -10px;
            width: 300px; height: 300px;
            transform: rotate(-90deg);
            pointer-events: none;
        }
        .progress-ring circle { transition: stroke-dashoffset 0.5s ease; }

        /* Disque Rotatif */
        .compass-inner {
            width: 240px; height: 240px;
            background: radial-gradient(circle at 50% 50%, #2a2a2a, #000);
            border-radius: 50%;
            box-shadow: inset 0 0 30px #000, 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 0.1s linear; /* Fluidité rotation */
        }
        .nav-arrow {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 70px solid #0A84FF;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 15px #0A84FF);
        }
        .north-mark {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%);
            color: #ff3b30; font-weight: bold; font-size: 16px;
        }

        /* Info Nav */
        .nav-info { text-align: center; margin-bottom: 30px; }
        .dist-value { font-size: 48px; font-weight: 800; }
        .target-label { color: #0A84FF; font-size: 16px; margin-top: 5px; }

        /* Widget Vitesse Waze */
        .waze-speed {
            width: 80px; height: 80px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid #ff3b30;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .waze-val { font-size: 28px; font-weight: 900; line-height: 1; }
        .waze-unit { font-size: 10px; font-weight: 700; color: #888; }

        /* --- PAGE: OUTILS/PROFIL --- */
        .page-content {
            padding: 100px 20px;
            overflow-y: auto;
            height: 100%;
        }
        .tool-item {
            background: rgba(30,30,30,0.6);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Bouton iOS */
        #ios-perm {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            background: #0A84FF; padding: 15px 30px;
            border-radius: 30px; z-index: 9999;
            display: none;
        }

    </style>
</head>
<body>

    <!-- Bouton Permission iOS -->
    <div id="ios-perm" onclick="requestPerm()">Activer la Boussole</div>

    <!-- NAVBAR -->
    <div class="nav-bar glass-panel">
        <div class="nav-item" onclick="switchPage('tools')">
            <i class="fa-solid fa-layer-group"></i>
            <span>Outils</span>
        </div>
        <div class="nav-item-center" onclick="switchPage('compass')">
            <i class="fa-regular fa-compass"></i>
        </div>
        <div class="nav-item active" onclick="switchPage('map')">
            <i class="fa-solid fa-map"></i>
            <span>Carte</span>
        </div>
    </div>

    <!-- PAGE 1: CARTE -->
    <div id="page-map" class="page active">
        <div class="top-bar-container">
            <!-- Barre de Recherche -->
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Rechercher..." oninput="handleSearch(this.value)">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <div id="suggestions" class="suggestions-box glass-panel"></div>
            </div>
            <!-- Bouton Profil -->
            <div class="profile-btn" onclick="switchPage('profile')">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- PAGE 2: BOUSSOLE -->
    <div id="page-compass" class="page">
        <div class="compass-container">
            <svg class="progress-ring">
                <circle stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="transparent" r="140" cx="150" cy="150" />
                <circle id="dist-circle" stroke="#0A84FF" stroke-width="6" stroke-linecap="round" fill="transparent" r="140" cx="150" cy="150" stroke-dasharray="880" stroke-dashoffset="880" />
            </svg>

            <div class="compass-ring">
                <div class="compass-inner" id="compass-disk">
                    <div class="north-mark">N</div>
                    <div class="nav-arrow"></div>
                </div>
            </div>

            <div class="nav-info">
                <div class="dist-value" id="dist-val">--</div>
                <div class="target-label" id="target-name">Aucune destination</div>
            </div>

            <div class="waze-speed">
                <div class="waze-val" id="speed-val">0</div>
                <div class="waze-unit">km/h</div>
            </div>
        </div>
    </div>

    <!-- PAGE 3: OUTILS -->
    <div id="page-tools" class="page">
        <div class="page-content">
            <h2>Outils</h2>
            <div class="tool-item">Mode Fantôme <i class="fa-solid fa-toggle-off"></i></div>
            <div class="tool-item">Calques <i class="fa-solid fa-layer-group"></i></div>
        </div>
    </div>

    <!-- PAGE 4: PROFIL (Simulé) -->
    <div id="page-profile" class="page">
        <div class="page-content">
            <h2>Mon Profil</h2>
            <div class="tool-item" style="flex-direction:column; align-items:flex-start;">
                <h3>Utilisateur</h3>
                <p style="color:#888; font-size:14px;">Connecté en tant que Invité</p>
            </div>
            <div class="tool-item">Déconnexion <i class="fa-solid fa-right-from-bracket"></i></div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        // Remplacez 'VOTRE_CLE_SUPABASE_ANON' par la clé réelle si vous l'avez
        const SB_URL = 'https://scbihxaceelyygrlacvm.supabase.co'; 
        const SB_KEY = 'VOTRE_CLE_SUPABASE_ANON'; // Insérez votre clé ici
        
        let map, userMarker, targetMarker;
        let currentPos = null, targetPos = null, currentHeading = 0, startDist = 0;

        // --- 2. INITIALISATION ROBUSTE ---
        window.onload = () => {
            initMap();
            // Petit délai pour forcer le redimensionnement une fois le DOM prêt
            setTimeout(() => {
                if(map) map.invalidateSize();
            }, 500);
            
            startSensors();
        };

        function initMap() {
            // Initialisation Leaflet
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                zoomSnap: 0, // Fluidité
                zoomDelta: 0.5
            }).setView([48.8566, 2.3522], 13);

            // Fond de carte Sombre (Stable)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            // Marqueur Utilisateur
            const icon = L.divIcon({
                className: 'user-dot',
                html: '<div style="width:18px;height:18px;background:#0A84FF;border:3px solid #fff;border-radius:50%;box-shadow:0 0 15px #0A84FF;"></div>',
                iconSize: [20, 20]
            });
            userMarker = L.marker([0,0], {icon: icon}).addTo(map);

            // Clic Carte -> Destination
            map.on('click', (e) => {
                setTarget(e.latlng.lat, e.latlng.lng, "Point Repère");
            });
        }

        // --- 3. NAVIGATION PAGES ---
        function switchPage(pageId) {
            // Masquer toutes les pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            // Afficher la page demandée
            const targetPage = document.getElementById('page-' + pageId);
            if(targetPage) targetPage.classList.add('active');

            // Mise à jour icône navbar
            if (pageId === 'map') {
                document.querySelector('.nav-item:nth-child(3)').classList.add('active');
                // FIX ÉCRAN NOIR : Redimensionner la carte quand elle devient visible
                setTimeout(() => map.invalidateSize(), 100);
            } else if (pageId === 'tools') {
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
            }
        }

        // --- 4. CAPTEURS (GPS + BOUSSOLE) ---
        function startSensors() {
            // GPS
            if(navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const { latitude, longitude, speed } = pos.coords;
                    currentPos = { lat: latitude, lng: longitude };
                    
                    // Mise à jour Carte
                    userMarker.setLatLng([latitude, longitude]);
                    
                    // Mise à jour Vitesse Waze
                    const kmh = speed ? Math.round(speed * 3.6) : 0;
                    document.getElementById('speed-val').innerText = kmh;

                    updateCompass();
                }, err => console.log(err), { enableHighAccuracy: true });
            }

            // BOUSSOLE
            if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('ios-perm').style.display = 'block';
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function requestPerm() {
            DeviceOrientationEvent.requestPermission().then(resp => {
                if(resp === 'granted') {
                    document.getElementById('ios-perm').style.display = 'none';
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            });
        }

        function handleOrientation(e) {
            if(e.webkitCompassHeading) currentHeading = e.webkitCompassHeading;
            else if(e.alpha) currentHeading = 360 - e.alpha;
            updateCompass();
        }

        // --- 5. LOGIQUE BOUSSOLE INTELLIGENTE ---
        function setTarget(lat, lng, name) {
            targetPos = { lat, lng };
            document.getElementById('target-name').innerText = name;
            
            if(targetMarker) map.removeLayer(targetMarker);
            targetMarker = L.marker([lat, lng]).addTo(map);

            if(currentPos) {
                startDist = getDistance(currentPos.lat, currentPos.lng, lat, lng);
            }
            // Switch auto vers boussole (optionnel, activé ici pour demo)
            // switchPage('compass');
        }

        function updateCompass() {
            if(!currentPos || !targetPos) {
                // Si pas de cible, on indique le Nord
                document.getElementById('compass-disk').style.transform = `rotate(${-currentHeading}deg)`;
                return;
            }

            // Calculs
            const dist = getDistance(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);
            const bearing = getBearing(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);
            const rotation = bearing - currentHeading;

            // Affichage
            document.getElementById('dist-val').innerText = dist < 1000 ? Math.round(dist) + 'm' : (dist/1000).toFixed(1) + 'km';
            document.getElementById('compass-disk').style.transform = `rotate(${rotation}deg)`;

            // Cercle dynamique
            const maxDash = 880; 
            if(startDist > 0) {
                let ratio = dist / startDist;
                if(ratio > 1) ratio = 1; 
                // ratio 1 = loin (cercle ouvert?), utilisateur veut "fermer de plus en plus" -> dashOffset tend vers 0
                // dashOffset max = vide. dashOffset 0 = plein.
                // On commence ouvert (vide) ? Non, cercle présent.
                // Disons : plein au début, se vide ? Ou l'inverse.
                // "Se ferme de plus en plus" => le cercle se complète.
                // Donc à dist max => vide (offset 880). A dist 0 => plein (offset 0).
                const offset = maxDash * ratio;
                document.getElementById('dist-circle').style.strokeDashoffset = offset;
            }
        }

        // --- OUTILS MATHS ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1)*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)*Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(startLat, startLng, destLat, destLng) {
            const y = Math.sin((destLng-startLng)*Math.PI/180) * Math.cos(destLat*Math.PI/180);
            const x = Math.cos(startLat*Math.PI/180)*Math.sin(destLat*Math.PI/180) -
                      Math.sin(startLat*Math.PI/180)*Math.cos(destLat*Math.PI/180)*Math.cos((destLng-startLng)*Math.PI/180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // --- RECHERCHE ---
        async function handleSearch(q) {
            const box = document.getElementById('suggestions');
            if(q.length < 3) { box.style.display='none'; return; }
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=5`);
            const data = await res.json();
            box.innerHTML = '';
            if(data.length){
                box.style.display='block';
                data.forEach(p => {
                    const div = document.createElement('div');
                    div.className='suggestion-item';
                    div.innerText = p.display_name.split(',')[0];
                    div.onclick = () => {
                        setTarget(parseFloat(p.lat), parseFloat(p.lon), p.display_name.split(',')[0]);
                        map.setView([p.lat, p.lon], 16);
                        box.style.display='none';
                        document.getElementById('search-input').value = p.display_name.split(',')[0];
                    };
                    box.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
