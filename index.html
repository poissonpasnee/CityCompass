<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CityCompass v20 - Strict Auth</title>
  <!-- Leaflet & FontAwesome -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #00f2ff; --bg: #0a0a0a; --panel: #141414; --text: #e0e0e0;
      --danger: #ff2a2a; --success: #00ff88;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
    
    /* --- ECRAN DE CONNEXION (Overlay total) --- */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(15px);
      z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
      transition: opacity 0.5s ease;
    }
    .compass-anim {
      font-size: 60px; color: var(--primary); margin-bottom: 30px;
      animation: spinCompass 3s infinite ease-in-out;
    }
    @keyframes spinCompass { 0% {transform: rotate(0deg);} 50% {transform: rotate(180deg);} 100% {transform: rotate(360deg);} }
    
    .login-box {
      width: 100%; max-width: 320px; background: rgba(255,255,255,0.05);
      padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    .login-box h2 { margin: 0 0 20px 0; font-weight: 300; letter-spacing: 2px; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #888; }
    .styled-input {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid #333;
      border-radius: 10px; color: #fff; font-size: 16px; outline: none;
      transition: border-color 0.3s;
    }
    .styled-input:focus { border-color: var(--primary); }
    
    .btn-main {
      width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), #00a8ff);
      border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer;
      font-size: 16px; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
    }
    .btn-sec { background: transparent; color: #888; border: 1px solid #333; margin-top: 10px; color: #fff; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 20px; }

    /* --- APP INTERFACE --- */
    #app { display: none; height: 100%; width: 100%; position: relative; }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    /* UI Overlay Elements */
    .ui-layer { position: absolute; z-index: 1000; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; }
    .interactive { pointer-events: auto; }
    
    /* Top Bar */
    .top-bar {
        position: absolute; top: 10px; left: 10px; right: 10px;
        display: flex; justify-content: space-between; align-items: flex-start;
    }
    .user-pill {
        background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 15px;
        border-radius: 30px; display: flex; align-items: center; gap: 10px;
        border: 1px solid rgba(255,255,255,0.1); color: white;
    }
    
    /* Bottom Nav */
    .nav-bar {
        position: absolute; bottom: 20px; left: 20px; right: 20px;
        background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
        border-radius: 25px; padding: 15px; display: flex; justify-content: space-around;
        border: 1px solid rgba(255,255,255,0.1); pointer-events: auto;
    }
    .nav-item { color: #666; font-size: 20px; transition: 0.3s; position: relative; }
    .nav-item.active { color: var(--primary); transform: translateY(-2px); }
    .nav-item.active::after {
        content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
        width: 4px; height: 4px; background: var(--primary); border-radius: 50%;
    }

    /* Panels (Profile, Shop, etc) */
    .panel-view {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: var(--bg); z-index: 1100; padding: 20px;
        transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-view.open { transform: translateY(0); }
    
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .panel-title { font-size: 24px; font-weight: bold; }
    .close-btn { font-size: 24px; padding: 10px; color: #666; }
    
    /* Widgets */
    .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .widget {
        background: #1a1a1a; padding: 15px; border-radius: 15px; text-align: center;
        border: 1px solid #333; position: relative; overflow: hidden;
    }
    .widget i { font-size: 24px; margin-bottom: 10px; color: var(--primary); }
    .widget h4 { margin: 0 0 5px 0; font-size: 14px; }
    .widget p { margin: 0; font-size: 12px; color: #888; }

    /* Admin */
    .admin-controls { border-top: 1px solid #333; padding-top: 20px; margin-top: 20px; display: none; }
    .admin-visible { display: block; }
  </style>
</head>
<body>

<!-- ECRAN DE CONNEXION STRICT -->
<div id="loginScreen">
  <div class="compass-anim"><i class="fa-regular fa-compass"></i></div>
  <div class="login-box">
    <h2>CITY COMPASS</h2>
    
    <div id="loginForm">
        <div class="input-group">
            <label>IDENTIFIANT (16 chiffres)</label>
            <input type="text" id="inputCode" class="styled-input" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>
        <div class="input-group">
            <label>MOT DE PASSE</label>
            <input type="password" id="inputPass" class="styled-input" placeholder="••••••••" required>
        </div>
        <div class="error-msg" id="loginError"></div>
        
        <button class="btn-main" id="btnLogin">CONNEXION</button>
        <button class="btn-main btn-sec" id="btnSignupMode">CRÉER UN COMPTE</button>
    </div>

    <div id="signupForm" style="display:none;">
        <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Un identifiant unique sera généré. Choisissez un mot de passe fort.</p>
        <div class="input-group">
            <label>CRÉEZ VOTRE MOT DE PASSE</label>
            <input type="password" id="createPass" class="styled-input" placeholder="••••••••" required>
        </div>
        <button class="btn-main" id="btnCreateAccount">GÉNÉRER MON ID & ENTRER</button>
        <button class="btn-main btn-sec" id="btnBackLogin">RETOUR CONNEXION</button>
    </div>
  </div>
</div>

<!-- APPLICATION -->
<div id="app">
    <div id="map"></div>
    
    <!-- Top Bar -->
    <div class="ui-layer">
        <div class="top-bar">
            <div class="user-pill interactive" onclick="openPanel('profile')">
                <i class="fa-solid fa-user-astronaut"></i>
                <span id="displayPoints">0</span> pts
            </div>
            <div class="user-pill interactive" style="background:var(--primary); color:black;" id="compassBtn">
                <i class="fa-regular fa-compass"></i> Cap
            </div>
        </div>
        
        <!-- Bottom Nav -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('map')"><i class="fa-solid fa-map"></i></div>
            <div class="nav-item" onclick="openPanel('shop')"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="nav-item" onclick="openPanel('profile')"><i class="fa-solid fa-bars"></i></div>
        </div>
    </div>
    
    <!-- PANELS -->
    <div id="panelProfile" class="panel-view">
        <div class="panel-header">
            <div class="panel-title">Profil</div>
            <div class="close-btn interactive" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="widget">
            <h4>Mon ID Unique</h4>
            <p id="profileID" style="font-family:monospace; letter-spacing:1px; margin-top:5px; color:#fff;">-</p>
        </div>
        <br>
        <div class="widget-grid">
            <div class="widget">
                <i class="fa-solid fa-trophy"></i>
                <h4>Classement</h4>
                <p>#42 Global</p>
            </div>
            <div class="widget">
                <i class="fa-solid fa-shoe-prints"></i>
                <h4>Traces</h4>
                <p>12 km</p>
            </div>
        </div>
        
        <div id="adminSection" class="admin-controls">
            <h3 style="color:var(--primary)"> <i class="fa-solid fa-shield-halved"></i> ADMIN PANEL</h3>
            <button class="btn-main btn-sec" onclick="alert('Fonction Admin: Editer Points')">Gérer Points</button>
            <button class="btn-main btn-sec" onclick="alert('Fonction Admin: Modérer Lieux')">Modérer Lieux</button>
            <button class="btn-main btn-sec" onclick="alert('Fonction Admin: Broadcast')">Message Global</button>
        </div>
        
        <button class="btn-main btn-sec" style="margin-top:auto; border-color:var(--danger); color:var(--danger)" id="btnLogout">DÉCONNEXION</button>
    </div>

    <div id="panelShop" class="panel-view">
        <div class="panel-header">
            <div class="panel-title">Boutique</div>
            <div class="close-btn interactive" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <p>Échangez vos points contre des améliorations.</p>
        <div class="widget-grid" id="shopGrid">
            <!-- Items générés par JS -->
        </div>
    </div>
</div>

<script>
/* --- SYSTEME DE DONNEES (Simulation Database) --- */
// On utilise localStorage pour simuler une base de données persistante
// Structure: "cc_db" = { "1234...": { pass: "abc", points: 100, role: "user" } }

const DB_KEY = 'cc_users_v20';
const CURRENT_USER_KEY = 'cc_current_user';

function getDB() {
    return JSON.parse(localStorage.getItem(DB_KEY)) || {};
}

function saveDB(db) {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function generateID() {
    let id = '';
    for(let i=0; i<16; i++) id += Math.floor(Math.random()*10);
    return id;
}

/* --- AUTHENTIFICATION STRICTE --- */
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('app');
const inputCode = document.getElementById('inputCode');
const inputPass = document.getElementById('inputPass');
const errorMsg = document.getElementById('loginError');

// Formatage auto de l'ID (0000 0000...)
inputCode.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g,'');
    if(v.length > 16) v = v.slice(0,16);
    let f = v.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    e.target.value = f;
});

// LOGIN
document.getElementById('btnLogin').onclick = () => {
    const rawId = inputCode.value.replace(/\s/g,'');
    const pass = inputPass.value;
    
    errorMsg.innerText = "";
    
    if(rawId.length < 16) { errorMsg.innerText = "ID invalide (16 chiffres requis)"; return; }
    if(!pass) { errorMsg.innerText = "Mot de passe OBLIGATOIRE."; return; }

    const db = getDB();
    const user = db[rawId];

    if(!user) {
        errorMsg.innerText = "Compte introuvable.";
        return;
    }

    // Gestion cas "Migration" : Si l'utilisateur existait mais sans mot de passe (vieux compte)
    if(!user.pass) {
        // On force la mise à jour
        const newPass = prompt("SÉCURITÉ REQUISE : Votre compte n'a pas de mot de passe. Veuillez en créer un maintenant :");
        if(newPass && newPass.length > 0) {
            user.pass = newPass; // On enregistre le nouveau pass
            saveDB(db);
            alert("Mot de passe enregistré ! Vous pouvez maintenant vous connecter.");
        } else {
            errorMsg.innerText = "Mise à jour annulée. Connexion impossible.";
            return;
        }
    }

    // VÉRIFICATION STRICTE
    if(user.pass === pass) {
        launchApp(rawId);
    } else {
        errorMsg.innerText = "Mot de passe incorrect.";
    }
};

// SIGNUP
document.getElementById('btnSignupMode').onclick = () => {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'block';
};
document.getElementById('btnBackLogin').onclick = () => {
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
};

document.getElementById('btnCreateAccount').onclick = () => {
    const pass = document.getElementById('createPass').value;
    if(!pass) { alert("Choisissez un mot de passe !"); return; }
    
    const newId = generateID();
    const db = getDB();
    
    db[newId] = {
        pass: pass,
        points: 50, // Bonus bienvenue
        role: 'user',
        items: []
    };
    
    // Admin Hardcodé (Simulation)
    if(newId.startsWith('333')) db[newId].role = 'admin'; // Cheat pour test
    
    saveDB(db);
    
    alert(`COMPTE CRÉÉ !\n\nVOTRE ID: ${newId.replace(/(\d{4})(?=\d)/g, '$1 ')}\nMOT DE PASSE: ${pass}\n\nNotez-le bien !`);
    launchApp(newId);
};

// LOGOUT
document.getElementById('btnLogout').onclick = () => {
    localStorage.removeItem(CURRENT_USER_KEY);
    location.reload();
};

/* --- CORE APP --- */
let currentUser = null;
let map = null;

function launchApp(userId) {
    localStorage.setItem(CURRENT_USER_KEY, userId);
    currentUser = userId;
    
    // UI Transition
    loginScreen.style.opacity = '0';
    setTimeout(() => {
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        initMap();
        updateUI();
    }, 500);
}

function updateUI() {
    const db = getDB();
    const userData = db[currentUser];
    
    document.getElementById('displayPoints').innerText = userData.points;
    document.getElementById('profileID').innerText = currentUser.replace(/(\d{4})(?=\d)/g, '$1 ');
    
    // Admin Panel Visibility
    // Pour test: l'ID spécifique que tu m'avais donné ou tout ID commençant par 333
    if(currentUser === '3339683758546584' || userData.role === 'admin') {
        document.getElementById('adminSection').classList.add('admin-visible');
    }
    
    renderShop(userData);
}

/* --- MAP ENGINE --- */
function initMap() {
    if(map) return;
    
    // Centré sur Toulouse par défaut
    map = L.map('map', { zoomControl: false }).setView([43.6047, 1.4442], 15);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OSM, &copy; CartoDB',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);
    
    // Géolocalisation réelle
    if(navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            // Marqueur User
            // Ici on pourrait mettre un marker custom
        }, err => console.log(err), { enableHighAccuracy: true });
    }
    
    loadPOIs();
}

function loadPOIs() {
    // Simulation de lieux chargés
    const pois = [
        {name: "Capitole", lat: 43.6045, lng: 1.4440, type: "Monument"},
        {name: "Saint-Sernin", lat: 43.6084, lng: 1.4420, type: "Eglise"}
    ];
    
    pois.forEach(p => {
        L.marker([p.lat, p.lng])
         .addTo(map)
         .bindPopup(`<b>${p.name}</b><br>${p.type}`);
    });
}

/* --- SHOP LOGIC --- */
const SHOP_ITEMS = [
    {id: 1, name: "Vision Nocturne", icon: "fa-eye", price: 100},
    {id: 2, name: "Trace Permanente", icon: "fa-shoe-prints", price: 500},
    {id: 3, name: "Radar Admin", icon: "fa-satellite-dish", price: 1000},
    {id: 4, name: "Badge Explorateur", icon: "fa-certificate", price: 50}
];

function renderShop(userData) {
    const grid = document.getElementById('shopGrid');
    grid.innerHTML = "";
    
    SHOP_ITEMS.forEach(item => {
        const owned = (userData.items || []).includes(item.id);
        const div = document.createElement('div');
        div.className = 'widget';
        div.style.borderColor = owned ? 'var(--success)' : '#333';
        div.innerHTML = `
            <i class="fa-solid ${item.icon}" style="color:${owned ? 'var(--success)' : 'var(--primary)'}"></i>
            <h4>${item.name}</h4>
            <p>${owned ? 'ACQUIS' : item.price + ' pts'}</p>
        `;
        
        if(!owned) {
            div.onclick = () => buyItem(item);
        }
        grid.appendChild(div);
    });
}

function buyItem(item) {
    const db = getDB();
    const user = db[currentUser];
    
    if(user.points >= item.price) {
        if(confirm(`Acheter ${item.name} pour ${item.price} pts ?`)) {
            user.points -= item.price;
            if(!user.items) user.items = [];
            user.items.push(item.id);
            saveDB(db);
            updateUI();
            alert("Achat confirmé !");
        }
    } else {
        alert("Pas assez de points !");
    }
}

/* --- UI NAVIGATION --- */
window.openPanel = (id) => {
    document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('open'));
    if(id === 'profile') document.getElementById('panelProfile').classList.add('open');
    if(id === 'shop') document.getElementById('panelShop').classList.add('open');
};

window.closePanels = () => {
    document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('open'));
};

window.switchTab = (tab) => {
    closePanels();
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    // Gestion simple de l'active state
    if(tab === 'map') document.querySelector('.nav-item:nth-child(1)').classList.add('active');
};

// Check Session au démarrage
const savedUser = localStorage.getItem(CURRENT_USER_KEY);
if(savedUser) {
    // Même si une session existe, on peut forcer la reco pour la sécurité
    // Mais pour l'UX, on vérifie juste si le user existe toujours
    const db = getDB();
    if(db[savedUser]) {
        // Optionnel : Décommenter la ligne suivante pour forcer le login à chaque refresh (sécurité max)
        // launchApp(savedUser); 
        // Sinon on demande le mot de passe quand même ? 
        // Pour "Connexion impossible sans mot de passe", le mieux est de ne pas auto-login
        // Donc on NE lance PAS launchApp(savedUser) automatiquement ici.
        // L'utilisateur doit se reconnecter.
        localStorage.removeItem(CURRENT_USER_KEY); // On nettoie la session pour forcer le login
    }
}

</script>
</body>
</html>
