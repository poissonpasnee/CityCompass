<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>CityCompass v57</title>

    <!-- LIBS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- DESIGN SYSTEM LIQUID GLASS (V57) --- */
        :root { --glass: rgba(255, 255, 255, 0.88); --blur: blur(25px); --shadow: 0 12px 40px rgba(0,0,0,0.18); --accent: #007AFF; --danger: #FF3B30; --success: #34C759; --text: #000; }
        body[data-theme="dark"] { --glass: rgba(32, 32, 35, 0.88); --text: #FFF; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; background: #000; color: var(--text); user-select: none; }

        /* DEBUG CONSOLE (Cachée par défaut sauf erreur grave) */
        #debug-console { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; background: rgba(0,0,0,0.8); color: lime; font-size: 10px; z-index: 99999; overflow-y: scroll; display: none; padding: 5px; pointer-events: none; }
        
        /* CARTE */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #222; }
        .leaflet-zoom-anim .leaflet-zoom-animated { transition: transform 0.2s cubic-bezier(0,0,0.2,1) !important; }

        /* HUD & INTERFACE */
        .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) 15px calc(env(safe-area-inset-bottom) + 20px) 15px; }

        /* RECHERCHE */
        .search-container { margin-top: 15px; pointer-events: auto; position: relative; width: 100%; max-width: 450px; align-self: center; }
        .search-bar { background: var(--glass); backdrop-filter: var(--blur); border-radius: 24px; padding: 14px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
        .search-inp { border: none; background: transparent; font-size: 16px; width: 100%; outline: none; color: var(--text); font-weight: 500; }
        .search-results { position: absolute; top: 65px; left: 0; width: 100%; background: var(--glass); backdrop-filter: var(--blur); border-radius: 20px; max-height: 300px; overflow-y: auto; display: none; padding: 10px; box-shadow: var(--shadow); z-index: 2000; }
        .result-item { padding: 14px; border-bottom: 1px solid rgba(128,128,128,0.1); cursor: pointer; font-size: 15px; }
        .xp-badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; }

        /* DOCK */
        .dock-wrapper { position: relative; width: 100%; max-width: 400px; align-self: center; pointer-events: auto; }
        .dock { background: var(--glass); backdrop-filter: var(--blur); border-radius: 35px; padding: 12px 30px; display: flex; justify-content: space-between; box-shadow: var(--shadow); }
        .dock-icon { font-size: 24px; color: #999; padding: 10px; transition: 0.2s; position: relative; cursor: pointer; }
        .dock-icon.active { color: var(--accent); transform: translateY(-3px); }
        .fab-compass { position: absolute; left: 50%; top: -35px; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 50%; background: var(--glass); backdrop-filter: var(--blur); box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--accent); cursor: pointer; border: 4px solid rgba(255,255,255,0.1); }
        
        /* PANNEAUX */
        .panel { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--glass); backdrop-filter: blur(40px); z-index: 2000; transition: right 0.35s cubic-bezier(0.19, 1, 0.22, 1); padding: 80px 20px 120px 20px; overflow-y: auto; pointer-events: auto; }
        .panel.open { right: 0; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .close-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(128,128,128,0.15); color: var(--text); font-size: 18px; cursor: pointer; }

        /* ITEMS */
        .shop-item { background: rgba(128,128,128,0.08); padding: 16px; border-radius: 22px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .shop-info { display: flex; align-items: center; gap: 15px; }
        .shop-icon { width: 48px; height: 48px; border-radius: 14px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .buy-btn { background: var(--text); color: var(--glass); border: none; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
        
        /* LOGIN */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.7); backdrop-filter: blur(30px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: var(--glass); padding: 35px; border-radius: 35px; width: 85%; max-width: 360px; text-align: center; box-shadow: var(--shadow); }
        .inp { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); font-size: 16px; background: rgba(128,128,128,0.05); color: var(--text); }
        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: white; font-weight: 700; font-size: 16px; margin-top: 10px; cursor: pointer; }

        /* BOUSSOLE FULL */
        #compassOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--glass); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        #compassOverlay.active { opacity: 1; pointer-events: auto; }
        #compassRing { width: 280px; height: 280px; border: 8px solid var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.05s linear; margin-bottom: 30px; position: relative; }
        
        /* TOGGLE */
        .toggle-switch { position: relative; width: 50px; height: 30px; display: inline-block; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body data-theme="light">

    <!-- DEBUG VISUEL -->
    <div id="debug-console"></div>

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1 style="margin:0 0 25px 0;">CityCompass</h1>
            <input type="email" id="email" class="inp" placeholder="Email">
            <input type="password" id="password" class="inp" placeholder="Mot de passe">
            <button class="btn-main" onclick="window.Auth.login()">Connexion</button>
            <button class="btn-main" style="background:transparent; color:var(--text); border:1px solid rgba(128,128,128,0.3);" onclick="window.Auth.signup()">Créer un compte</button>
            <p id="msg" style="color:var(--danger); font-size:13px; margin-top:15px; min-height:15px;"></p>
        </div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>

    <!-- HUD (Interface principale) -->
    <div class="hud-layer" id="hud" style="display:none;">
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="opacity:0.5; font-size:18px;"></i>
                <input type="text" class="search-inp" id="searchInp" placeholder="Où aller ?" onkeyup="window.MapManager.search(this.value)">
                <div class="xp-badge" onclick="window.UI.open('panelProfile')"><span id="hudPoints">0</span> XP</div>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="dock-wrapper">
            <div class="fab-compass" onclick="window.Compass.open()"><i class="fa-regular fa-compass"></i></div>
            <div class="dock">
                <div class="dock-icon" onclick="window.UI.open('panelShop')"><i class="fa-solid fa-store"></i></div>
                <div class="dock-icon" onclick="window.UI.open('panelTools')"><i class="fa-solid fa-layer-group"></i></div>
                <div class="dock-icon active" onclick="window.MapManager.locate()"><i class="fa-solid fa-location-arrow"></i></div>
                <div class="dock-icon" onclick="window.UI.open('panelProfile')"><i class="fa-solid fa-user"></i></div>
            </div>
        </div>
    </div>

    <!-- PANNEAUX -->
    <div id="panelShop" class="panel">
        <div class="panel-head"><h2>Boutique</h2><button class="close-btn" onclick="window.UI.close()">&times;</button></div>
        <div style="background:var(--accent); color:white; padding:25px; border-radius:25px; margin-bottom:25px; text-align:center;">
            <div style="font-size:36px; font-weight:800;" id="shopPoints">0</div>
            <div style="opacity:0.9;">Points Disponibles</div>
        </div>
        <div id="shopList"></div>
    </div>

    <div id="panelTools" class="panel">
        <div class="panel-head"><h2>Outils</h2><button class="close-btn" onclick="window.UI.close()">&times;</button></div>
        <h3 style="opacity:0.6; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Mes Favoris</h3>
        <div id="favList" style="margin-bottom:30px; color:gray;">Aucun favori</div>
        <h3 style="opacity:0.6; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Carte</h3>
        <div class="shop-item" onclick="window.MapManager.setLayer('standard')"><div class="shop-info"><div class="shop-icon">🗺️</div><b>Standard</b></div></div>
        <div class="shop-item" onclick="window.MapManager.setLayer('sat')"><div class="shop-info"><div class="shop-icon">🛰️</div><b>Satellite</b></div></div>
        <div class="shop-item" onclick="window.MapManager.setLayer('dark')"><div class="shop-info"><div class="shop-icon">🌑</div><b>Mode Nuit</b></div></div>
    </div>

    <div id="panelProfile" class="panel">
        <div class="panel-head"><h2>Mon Compte</h2><button class="close-btn" onclick="window.UI.close()">&times;</button></div>
        <div style="text-align:center; margin-bottom:40px;">
            <div style="width:90px; height:90px; background:var(--accent); color:white; border-radius:50%; margin:0 auto 15px auto; display:flex; align-items:center; justify-content:center; font-size:36px;">👤</div>
            <h3 id="profileEmail" style="margin:0;">...</h3>
        </div>
        <div class="shop-item" onclick="window.Settings.toggleTheme()"><div class="shop-info"><b>Mode Sombre / Clair</b></div><div class="shop-icon" style="width:30px; height:30px;"><i class="fa-solid fa-adjust"></i></div></div>
        <button class="btn-main" style="background:var(--danger); margin-top:20px;" onclick="window.Auth.logout()">Se déconnecter</button>
        
        <div id="adminPanel" style="display:none; margin-top:30px; border-top:1px solid #ddd; padding-top:20px;">
             <h3 style="color:var(--danger);">Admin</h3>
             <button class="buy-btn" onclick="window.Admin.modPoints(500)">+500 XP</button>
             <button class="buy-btn" onclick="window.Admin.addPublicPlace()">Ajouter Lieu</button>
        </div>
    </div>

    <!-- BOUSSOLE NAVIGATION -->
    <div id="compassOverlay">
        <button class="close-btn" style="position:absolute; top:40px; right:20px;" onclick="window.Compass.close()">&times;</button>
        <div id="compassRing">
            <div style="position:absolute; top:-40px; font-weight:bold; font-size:18px;">NORD</div>
            <i class="fa-solid fa-location-arrow" style="font-size:100px; color:var(--danger);"></i>
        </div>
        <h1 id="compassDeg">0°</h1>
        <button class="btn-main" style="width:auto; padding:10px 30px;" onclick="window.Compass.requestPerm()">Calibrer / Autoriser</button>
        
        <div id="navInfoBox" style="display:none; width:90%; max-width:360px; margin-top:30px;">
            <div class="shop-item" style="background:var(--accent); color:white;">
                <div class="shop-info">
                    <div class="shop-icon" style="background:rgba(255,255,255,0.2); color:white;">🏁</div>
                    <div><b id="navTargetName">Destination</b><br><span style="font-size:13px; opacity:0.8;">Dist: <span id="navDist">--</span></span></div>
                </div>
                <button class="buy-btn" style="background:rgba(0,0,0,0.3);" onclick="window.Compass.stopNav()">Stop</button>
            </div>
        </div>
    </div>

    <script>
        // LOG SYSTEM
        function log(m) { console.log(m); /* document.getElementById('debug-console').innerHTML += m + '<br>'; */ }

        // VARIABLES GLOBALES (Accessibles depuis le HTML)
        window.AppState = { sb: null, map: null, userMarker: null, user: null, profile: null, theme: 'light', lastLoc: null, navTarget: null, searchTimer: null };
        const CFG = {
            sbUrl: 'https://scbihxaceelyygrlacvm.supabase.co',
            sbKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYmloeGFjZWVseXlncmxhY3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjU3MTcsImV4cCI6MjA4NTE0MTcxN30.rgUH-kltyNX99-HTDmGEyzGyu8qFXR9LF1QxsjY0W44',
            items: [
                { id: 'color_purple', name: 'Thème Violet', price: 200, icon: '🎨', type: 'theme', val: '#AF52DE' },
                { id: 'color_orange', name: 'Thème Orange', price: 200, icon: '🎨', type: 'theme', val: '#FF9500' },
                { id: 'color_teal', name: 'Thème Turquoise', price: 200, icon: '🎨', type: 'theme', val: '#30B0C7' },
                { id: 'w_traffic', name: 'Info Trafic', price: 100, icon: '🚦', type: 'widget' },
                { id: 'w_ghost', name: 'Mode Fantôme', price: 500, icon: '👻', type: 'widget' }
            ],
            maps: {
                standard: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
                sat: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            }
        };

        // --- MODULES (Attachés à window pour être publics) ---

        window.UI = {
            msg: (t) => document.getElementById('msg').innerText = t,
            open: (id) => { document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')); document.getElementById(id).classList.add('open'); },
            close: () => document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'))
        };

        window.Auth = {
            login: async () => {
                const e = document.getElementById('email').value, p = document.getElementById('password').value;
                if(!e || !p) return window.UI.msg("Remplissez tout.");
                window.UI.msg("Connexion...");
                const { data, error } = await window.AppState.sb.auth.signInWithPassword({ email:e, password:p });
                if(error) window.UI.msg(error.message); else window.App.start(data.user);
            },
            signup: async () => {
                const e = document.getElementById('email').value, p = document.getElementById('password').value;
                if(!e || !p) return window.UI.msg("Remplissez tout.");
                window.UI.msg("Création...");
                const { data, error } = await window.AppState.sb.auth.signUp({ email:e, password:p });
                if(error) window.UI.msg(error.message); else if(data.session) window.App.start(data.user); else window.UI.msg("Compte créé !");
            },
            logout: async () => { await window.AppState.sb.auth.signOut(); location.reload(); }
        };

        window.MapManager = {
            init: () => {
                if(window.AppState.map) return;
                window.AppState.map = L.map('map', { zoomControl: false }).setView([43.6, 1.4], 13);
                window.MapManager.setLayer(window.AppState.theme === 'dark' ? 'dark' : 'standard');
                window.AppState.map.on('click', (e) => {
                     L.popup().setLatLng(e.latlng).setContent(`<div style="text-align:center; padding:5px;"><button class="buy-btn" onclick="window.MapManager.addFav(${e.latlng.lat}, ${e.latlng.lng})">⭐ Favori</button><br><br><button class="buy-btn" onclick="window.MapManager.goNav(${e.latlng.lat}, ${e.latlng.lng}, 'Point')">🧭 Aller</button></div>`).openOn(window.AppState.map);
                });
                window.MapManager.locate();
            },
            locate: () => {
                window.AppState.map.locate({setView: true, watch: true, enableHighAccuracy: true});
                window.AppState.map.on('locationfound', e => {
                    window.AppState.lastLoc = e.latlng;
                    if(!window.AppState.userMarker) window.AppState.userMarker = L.circleMarker(e.latlng, { radius: 9, color: 'white', weight:3, fillColor: '#007AFF', fillOpacity:1 }).addTo(window.AppState.map);
                    else window.AppState.userMarker.setLatLng(e.latlng);
                    
                    if(window.AppState.navTarget) {
                        const d = window.AppState.map.distance(e.latlng, window.AppState.navTarget.loc);
                        document.getElementById('navDist').innerText = d > 1000 ? (d/1000).toFixed(1)+'km' : Math.round(d)+'m';
                    }
                });
            },
            search: (q) => {
                clearTimeout(window.AppState.searchTimer);
                window.AppState.searchTimer = setTimeout(async () => {
                    if(q.length < 3) return document.getElementById('searchResults').style.display = 'none';
                    const c = window.AppState.map.getCenter();
                    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&viewbox=${c.lng-0.5},${c.lat+0.5},${c.lng+0.5},${c.lat-0.5}&bounded=0&limit=5`);
                    const d = await r.json();
                    const l = document.getElementById('searchResults'); l.innerHTML = ''; l.style.display = 'block';
                    d.forEach(p => {
                        const div = document.createElement('div'); div.className = 'result-item';
                        div.innerHTML = `<b>${p.display_name.split(',')[0]}</b>`;
                        div.onclick = () => { window.MapManager.goNav(p.lat, p.lon, p.display_name.split(',')[0]); l.style.display = 'none'; };
                        l.appendChild(div);
                    });
                }, 300);
            },
            goNav: (lat, lng, name) => {
                window.AppState.navTarget = { loc: L.latLng(lat, lng), name: name };
                document.getElementById('navTargetName').innerText = name;
                document.getElementById('navInfoBox').style.display = 'block';
                window.UI.close(); window.Compass.open();
            },
            addFav: async (lat, lng) => {
                const n = prompt("Nom ?"); if(!n) return;
                const f = [...(window.AppState.profile.favorites || []), { name: n, lat, lng }];
                await window.AppState.sb.from('profiles').update({ favorites: f }).eq('id', window.AppState.user.id);
                window.AppState.profile.favorites = f; window.MapManager.renderFavs(); window.AppState.map.closePopup();
            },
            renderFavs: () => {
                const c = document.getElementById('favList'); c.innerHTML = '';
                (window.AppState.profile.favorites || []).forEach(f => {
                    const d = document.createElement('div'); d.className = 'shop-item';
                    d.innerHTML = `<span>⭐ ${f.name}</span> <button class="buy-btn" onclick="window.MapManager.goNav(${f.lat}, ${f.lng}, '${f.name}')">Aller</button>`;
                    c.appendChild(d);
                });
            },
            setLayer: (t) => {
                window.AppState.map.eachLayer(l => { if(l._url) window.AppState.map.removeLayer(l); });
                L.tileLayer(CFG.maps[t], { maxZoom: 19 }).addTo(window.AppState.map);
            }
        };

        window.Compass = {
            open: () => document.getElementById('compassOverlay').classList.add('active'),
            close: () => document.getElementById('compassOverlay').classList.remove('active'),
            stopNav: () => { window.AppState.navTarget = null; document.getElementById('navInfoBox').style.display = 'none'; },
            requestPerm: async () => {
                if(typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const r = await DeviceOrientationEvent.requestPermission();
                    if(r === 'granted') window.addEventListener('deviceorientation', window.Compass.handle);
                } else window.addEventListener('deviceorientation', window.Compass.handle);
            },
            handle: (e) => {
                const a = e.webkitCompassHeading || Math.abs(e.alpha - 360);
                document.getElementById('compassRing').style.transform = `rotate(${-a}deg)`;
                document.getElementById('compassDeg').innerText = Math.round(a) + "°";
            }
        };

        window.Shop = {
            render: () => {
                const c = document.getElementById('shopList'); c.innerHTML = '';
                CFG.items.forEach(i => {
                    const owned = (window.AppState.profile.items || []).includes(i.id);
                    const active = (window.AppState.profile.active_items || []).includes(i.id);
                    let btn = `<button class="buy-btn" onclick="window.Shop.buy('${i.id}')">${i.price} XP</button>`;
                    if(owned) btn = `<label class="toggle-switch"><input type="checkbox" ${active?'checked':''} onchange="window.Shop.toggle('${i.id}', this.checked)"><span class="slider"></span></label>`;
                    const d = document.createElement('div'); d.className = 'shop-item';
                    d.innerHTML = `<div class="shop-info"><div class="shop-icon" style="background:${i.val||'#eee'}">${i.icon}</div><div><b>${i.name}</b></div></div>${btn}`;
                    c.appendChild(d);
                });
            },
            buy: async (id) => {
                const i = CFG.items.find(x => x.id === id);
                if(window.AppState.profile.points < i.price) return alert("Pas assez de points !");
                if(confirm("Acheter ?")) {
                    window.AppState.profile.points -= i.price;
                    window.AppState.profile.items = [...(window.AppState.profile.items || []), id];
                    await window.AppState.sb.from('profiles').update({ points: window.AppState.profile.points, items: window.AppState.profile.items }).eq('id', window.AppState.user.id);
                    window.App.applySettings(); window.Shop.render();
                }
            },
            toggle: async (id, on) => {
                let a = window.AppState.profile.active_items || [];
                if(on) a.push(id); else a = a.filter(x => x !== id);
                window.AppState.profile.active_items = a;
                await window.AppState.sb.from('profiles').update({ active_items: a }).eq('id', window.AppState.user.id);
                const item = CFG.items.find(i => i.id === id);
                if(item.type === 'theme' && on) { document.documentElement.style.setProperty('--accent', item.val); window.AppState.profile.color = item.val; await window.AppState.sb.from('profiles').update({color: item.val}).eq('id', window.AppState.user.id); }
            }
        };

        window.Settings = {
            toggleTheme: () => {
                window.AppState.theme = window.AppState.theme === 'light' ? 'dark' : 'light';
                document.body.setAttribute('data-theme', window.AppState.theme);
                localStorage.setItem('cc_theme', window.AppState.theme);
                window.MapManager.setLayer(window.AppState.theme === 'dark' ? 'dark' : 'standard');
            }
        };

        window.Admin = {
            modPoints: async (am) => {
                window.AppState.profile.points += am;
                await window.AppState.sb.from('profiles').update({ points: window.AppState.profile.points }).eq('id', window.AppState.user.id);
                window.App.applySettings(); alert("Points mis à jour");
            },
            addPublicPlace: async () => {
                const n = prompt("Nom ?");
                if(n && window.AppState.lastLoc) await window.AppState.sb.from('places').insert({ name: n, lat: window.AppState.lastLoc.lat, lng: window.AppState.lastLoc.lng, type: 'admin_pick' });
            }
        };

        window.App = {
            init: async () => {
                log("App init...");
                window.AppState.sb = supabase.createClient(CFG.sbUrl, CFG.sbKey);
                window.AppState.theme = localStorage.getItem('cc_theme') || 'light';
                document.body.setAttribute('data-theme', window.AppState.theme);
                
                const { data } = await window.AppState.sb.auth.getSession();
                if(data?.session) window.App.start(data.session.user);
            },
            start: async (user) => {
                log("App start user: " + user.email);
                window.AppState.user = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('profileEmail').innerText = user.email;
                window.MapManager.init();
                await window.App.loadData();
            },
            loadData: async () => {
                let { data, error } = await window.AppState.sb.from('profiles').select('*').eq('id', window.AppState.user.id).single();
                if(error && error.code === 'PGRST116') { // Créer profil si existe pas
                    await window.AppState.sb.from('profiles').insert({ id: window.AppState.user.id });
                    return window.App.loadData();
                }
                if(data) {
                    window.AppState.profile = data;
                    window.App.applySettings();
                    window.Shop.render();
                    window.MapManager.renderFavs();
                    if(data.is_admin) document.getElementById('adminPanel').style.display = 'block';
                }
            },
            applySettings: () => {
                document.getElementById('hudPoints').innerText = window.AppState.profile.points || 0;
                document.getElementById('shopPoints').innerText = window.AppState.profile.points || 0;
                if(window.AppState.profile.color) document.documentElement.style.setProperty('--accent', window.AppState.profile.color);
            }
        };

        // Lancement au chargement
        window.onload = window.App.init;
    </script>
</body>
</html>
